name: php-rust
ddev_version_constraint: '>= v1.25.5'
project_files:
  - docker-compose.phpr.yaml
  - config.php-rust-lifecycle.yaml
  - commands/host/phpr
  - commands/host/tracker
  - commands/host/serena-mcp
  - commands/host/serena-dashboard
pre_install_actions:
  - |
    test -f scripts/configure-runtime.py && test -f runtime/Dockerfile || { echo 'Install this add-on from the drupalphprust project source.' >&2; exit 1; }
post_install_actions:
  - python3 ../scripts/configure-runtime.py --render
removal_actions:
  - python3 ../scripts/cleanup-project.py
