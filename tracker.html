</main><script id="snapshot" type="application/json">{"pages": {"PROGRESS.md": "# Drupal on PHP Rust\n\nUpdated: 2026-11-13\n\n**Installer:** Bundled DDEV add-on gives the tracker its own hostname and uses\nnormal AIBP/DDEV deletion, requiring DDEV 1.25.5+. Add-on installation, rendered\nroutes and native cleanup are verified in an isolated fixture; full fresh\ninstallation/browser acceptance remains open. An early version check now prints user-run\nupgrade commands; DDEV\u2019s version constraint blocks unsupported service starts. [Receipt](docs/receipts/2026-11-12-native-ddev-addon.md).\n\n**Try it and take over:** [What works, known failures and next steps](docs/TRY-IT.md). The environment can be shared while compatibility tasks remain open.\n\n**Agent tooling:** Containerised Serena and pinned Rust analysis tools; installer\nchoices for Codex/Claude and host/DDEV execution. Both MCP transports pass Rust\nsymbol lookup locally. Fresh Coder and authenticated clients remain unverified.\n[Setup](docs/SERENA.md) \u00b7 [Receipt](docs/receipts/2026-11-12-serena-ddev.md).\n\n**Serena dashboard:** DDEV route and tracker button implemented; OLI registers\nits hostname and deletion cleans up project-owned aliases. DDEV Freeform button\nprepared and Terraform-validated, not published. [Receipt](docs/receipts/2026-11-12-serena-dashboard.md).\n\n**Current installation:** Drupal CMS runs on PHP Rust for the verified homepage,\nlogin, dashboard, Utility-page creation, editing and publishing journey. The\npublished synthetic page is accessible anonymously and survives a service restart.\nRendering is clean after a cache rebuild. All 49 comparison probes and 47 PHPT\ncases in both compiler modes pass.\n[What changed and evidence](docs/receipts/2026-11-13-authenticated-runtime.md).\n\n**Release suite:** 1,756 passed, 3 failed, 2 ignored. Remaining failures cover\nopcode accounting, source-size limits and the reference-allocation guard.\n\n**Next:** Resolve those release failures; test a fresh One Line\nInstaller build and DDEV Freeform; then prepare discrete upstream contribution\npackets. Broader runtime coverage and partial-request server blocking remain open.\nNo speed or complete Drupal parity claim. Standard PHP remains the comparison oracle.\n\n**Research alongside fixes:** [Upstream submission process](.agents/plan/current/13-upstream-process.md) and [comparisons beyond speed](docs/COMPARISON.md), separating today's behavior from Drupal-change opportunities.\n", ".agents/plan/archive/2026-11-11-standalone-extraction.md": "# Standalone project decision \u2014 2026-11-11\n\nThe investigation began in a migration/Coder workspace only because a Coder\nmachine was needed. The user clarified that the actual project is getting Drupal\nCMS working on PHP Rust, with a fast repeatable setup and comparisons against Zend.\n\nDestination: https://github.com/jamieaa64/drupalphprust\nFoundation: DDEV and the Drupal One Line Installer; Coder freeform is a host, not a\nseparate Drupal provisioning implementation.\n\nRetained: 29 ordered runtime patches, independent fixtures, database/SPL findings,\ncurrent blockers and experimental build recipe. Standard-PHP provisioning remains\nnecessary while PHP Rust compatibility is incomplete.\n\nExcluded: migration dashboard/agents, MCP/OAuth integration, earlier migration\ninstaller/seed gates, private credentials, browser sessions, database contents and\nraw logs. The old repositories remain untouched as historical local evidence.\n\nReplaced by: ../current/README.md. This decision does not claim that the new\ninstaller hook, DDEV service or Coder routing has passed end-to-end tests.\n", ".agents/plan/archive/2026-11-12-milestones/01-repository.md": "# 01. Portable repository\n\nStatus: done\n\nStandalone source, patches and handover are in place.\n\n## Work\n\n- Keep source independent of the old migration folder and Coder.\n- Preserve the pinned runtime patches and private-file exclusions.\n\n## Test / finish\n\n- Reconstruct all 31 patches from the pinned source.\n- Run repository and secret checks; inspect a clean checkout.\n\n[Overall plan](README.md) \u00b7 [Next](02-static-references.md) \u00b7 [Evidence / guidance](../../../../docs/receipts/2026-11-11-repository-extraction.md)\n", ".agents/plan/archive/2026-11-12-milestones/02-static-references.md": "# 02. Static references\n\nStatus: done\n\nViews reference binding and finally handling pass regression checks.\n\n## Work\n\n- Preserve aliases when static storage is rebound.\n- Keep the fix and fixture independently reviewable.\n\n## Test / finish\n\n- Compare the static-property-reference probe with Zend.\n- Verify finally executes and the returned alias still mutates its source.\n\n[Overall plan](README.md) \u00b7 [Previous](01-repository.md) \u00b7 [Next](03-runtime.md) \u00b7 [Evidence / guidance](../../../../docs/receipts/2026-11-12-static-property-reference.md)\n", ".agents/plan/archive/2026-11-12-milestones/03-runtime.md": "# 03. Runtime compatibility\n\nStatus: active\n\nNext blocker: Fiber suspension inside a Generator.\n\n## Work\n\n- Preserve both continuations when a Fiber suspends during generator execution.\n- Avoid replaying side effects; keep each runtime fix separate.\n\n## Test / finish\n\n- Compare fiber-generator-suspend.php with Zend; it currently panics on PHP Rust.\n- Cover nested generators, repeated suspension, exceptions and finally; obtain review.\n\n[Overall plan](README.md) \u00b7 [Previous](02-static-references.md) \u00b7 [Next](04-browser.md) \u00b7 [Evidence / guidance](../../../../docs/receipts/2026-11-12-fiber-generator-blocker.md)\n", ".agents/plan/archive/2026-11-12-milestones/04-browser.md": "# 04. Drupal browser check\n\nStatus: blocked\n\nWaiting for the rendering blocker in step 3.\n\n## Work\n\n- Use one disposable, explicitly scoped Drupal CMS site.\n- Exercise homepage, login, dashboard, create, edit and view.\n\n## Test / finish\n\n- Confirm saved content persists and edits appear after reload.\n- Check response content for PHP errors, not just HTTP success.\n\n[Overall plan](README.md) \u00b7 [Previous](03-runtime.md) \u00b7 [Next](05-regressions.md) \u00b7 [Evidence / guidance](../../../../docs/TESTING.md)\n", ".agents/plan/archive/2026-11-12-milestones/05-regressions.md": "# 05. Combined regressions\n\nStatus: pending\n\n29 differential probes pass; the complete acceptance suite remains.\n\n## Work\n\n- Run language, database, iterator and HTTP/session checks on one candidate.\n- Record the image, oracle version and remaining exclusions.\n\n## Test / finish\n\n- Require matching expected output and empty unexpected stderr.\n- Run focused tests for new fixes, then the combined suite.\n\n[Overall plan](README.md) \u00b7 [Previous](04-browser.md) \u00b7 [Next](06-local-install.md) \u00b7 [Evidence / guidance](../../../../docs/TESTING.md)\n", ".agents/plan/archive/2026-11-12-milestones/06-local-install.md": "# 06. Local installation\n\nStatus: active\n\nConfig is prepared; the interactive install is not yet verified.\n\n## Work\n\n- Run the repo-only One Line Installer command from a parent directory.\n- Choose Local and enter any DDEV administrator password in your own terminal.\n\n## Test / finish\n\n- Check the runtime-ready marker and both DDEV services.\n- Verify generated site files, database access and stop/start persistence.\n\n[Overall plan](README.md) \u00b7 [Previous](05-regressions.md) \u00b7 [Next](07-coder.md) \u00b7 [Evidence / guidance](../../../../docs/USAGE.md)\n", ".agents/plan/archive/2026-11-12-milestones/07-coder.md": "# 07. Coder freeform\n\nStatus: pending\n\nUse the same installer configuration on an optional Coder host.\n\n## Work\n\n- Select a disposable DDEV freeform workspace.\n- Run the installer with --config coder; use private access.\n\n## Test / finish\n\n- Check Zend and PHP Rust access through the workspace/tunnel.\n- Verify DDEV restart and workspace restart preserve the site.\n\n[Overall plan](README.md) \u00b7 [Previous](06-local-install.md) \u00b7 [Next](08-fast-setup.md) \u00b7 [Evidence / guidance](../../../../docs/CODER.md)\n", ".agents/plan/archive/2026-11-12-milestones/08-fast-setup.md": "# 08. Fast setup and restore\n\nStatus: pending\n\nPrepare a reusable seed after correctness passes.\n\n## Work\n\n- Capture a disposable site with no real users, credentials or client content.\n- Separate runtime build, service startup and site restore.\n\n## Test / finish\n\n- Restore into a fresh named project and repeat the browser checks.\n- Verify file/database identity and record each setup duration separately.\n\n[Overall plan](README.md) \u00b7 [Previous](07-coder.md) \u00b7 [Next](09-comparison.md) \u00b7 [Evidence / guidance](../../../../docs/TESTING.md)\n", ".agents/plan/archive/2026-11-12-milestones/09-comparison.md": "# 09. Compare with Zend\n\nStatus: pending\n\nNo valid performance result yet.\n\n## Work\n\n- Use release builds and identical application code, data and settings.\n- Alternate Zend and Rust runs; retain raw results.\n\n## Test / finish\n\n- Reject error responses and report cache state, hardware and repetitions.\n- Compare startup and request timings separately; state exclusions.\n\n[Overall plan](README.md) \u00b7 [Previous](08-fast-setup.md) \u00b7 [Next](10-upstream.md) \u00b7 [Evidence / guidance](../../../../docs/TESTING.md)\n", ".agents/plan/archive/2026-11-12-milestones/10-upstream.md": "# 10. Upstream submissions\n\nStatus: pending\n\nPrepare discrete contributions; submit only after E2E and user approval.\n\n## Work\n\n- Split fixes by behavior with minimal dependencies and regression fixtures.\n- Keep project/DDEV changes separate from PHP Rust changes.\n\n## Test / finish\n\n- Reconstruct each proposed patch set and run the relevant upstream gates.\n- Review scope, licensing, evidence and remaining limitations before submission.\n\n[Overall plan](README.md) \u00b7 [Previous](09-comparison.md) \u00b7 [Evidence / guidance](../../../../docs/UPSTREAM.md)\n", ".agents/plan/archive/2026-11-12-milestones/README.md": "# Overall plan\n\nRun Drupal CMS on PHP Rust using DDEV and the One Line Installer; then compare\nit fairly with standard PHP. Coder is an optional host. No migration tooling.\n\nOpen [the tracker](../../../..//tracker.html) for the short view. Each step below\ncontains its work, tests, status and links to neighbouring steps.\n\n1. [Portable repository](01-repository.md)\n2. [Static references](02-static-references.md)\n3. [Runtime compatibility](03-runtime.md)\n4. [Drupal browser check](04-browser.md)\n5. [Combined regressions](05-regressions.md)\n6. [Local installation](06-local-install.md)\n7. [Coder freeform](07-coder.md)\n8. [Fast setup and restore](08-fast-setup.md)\n9. [Compare with Zend](09-comparison.md)\n10. [Upstream submissions](10-upstream.md)\n\nRuntime fixes unblock browser acceptance. Local provisioning can progress alongside\nthat work. Performance and upstream submission follow correctness, not before it.\n\n[Current summary](../../../../PROGRESS.md) \u00b7 [Handover](../../../../docs/HANDOVER.md) \u00b7\n[Future scope](../../future/README.md) \u00b7 [Archive](../../archive/README.md)\n\nUpdate the affected step after verified progress. Keep it short; put detailed\nreceipts in docs/receipts. Regenerate tracker.html with `python3 scripts/tracker.py`.\n", ".agents/plan/archive/README.md": "# Archived plans\n\nArchive completed or superseded plans here; retain outcome, date and replacement.\n\n- [2026-11-11: standalone extraction](2026-11-11-standalone-extraction.md)\n\nEarlier migration-specific objectives are superseded, not unfinished requirements\nof this repository. No migration setup scripts, OAuth credentials or seed data\nare part of this extraction.\n\n- [2026-11-12: superseded milestone checklist](2026-11-12-milestones/README.md). Replaced with implementation and contribution tasks; its statuses are historical.\n", ".agents/plan/current/01-fiber-generators.md": "# 01. Complete Drupal runtime support\n\nStatus: active\n\nDestination: PHP Rust + this repository\n\nThe selected installation now completes login, dashboard, Utility-page creation,\nediting, publishing and anonymous viewing on PHP Rust. The page survives restart.\nThis is a scoped CMS journey, not an inventory of every remaining runtime defect.\n\n## Current browser evidence\n\nExplicit Generator continuations cover repeated suspension, changed resume depth,\ndelegation and finally cleanup. `iterator_to_array` also retains partial collection\nacross suspension. Unsupported native helper boundaries reject safely. References,\nstream wrappers and date fixes were needed to complete the form journey and remain\nowned by tasks 05, 06 and 08. See the\n[current receipt](../../../docs/receipts/2026-11-13-authenticated-runtime.md).\n\n## Work\n\n- Fix Fiber/Generator continuations, including nested suspension, exceptions and finally.\n- Fix further reproduced runtime failures separately; do not patch Drupal to conceal them.\n\n## Test / finish\n\n- [x] Fix the Views static-property reference compiler gap and add its regression.\n- [x] Match Zend on the implemented Fiber/Generator fixtures and obtain runtime review.\n- [x] Verify the dashboard and page creation form.\n- [x] Verify create \u2192 edit \u2192 publish \u2192 anonymous view through PHP Rust.\n- [ ] Run all regressions against the final combined build; record the final candidate result in the receipt.\n\n## Upstream\n\n- [ ] Finish separate local contribution units with fixtures across tasks 02\u201308.\n- [ ] Review submissions after end-to-end success and user approval.\n\nThen [package a reusable seed](11-fast-seed.md) and [compare startup/page performance](12-benchmark.md).\nThe superseded checklist came from the old drupal-runtime-comparison/PROGRESS.md\n(11 November); its unchecked Views item is now resolved, not a new blocker.\n\nPatches: fiber-static-dispatch.patch, fiber-callback-trampoline.patch, fiber-generator-continuation.patch, fiber-generator-collector.patch\n\n[Overall plan](README.md) \u00b7 [Next](02-pdo-mysql.md) \u00b7 [Evidence / guidance](../../../docs/HANDOVER.md) \u00b7 [Fiber reproducer](../../../docs/receipts/2026-11-12-fiber-generator-blocker.md)\n", ".agents/plan/current/02-pdo-mysql.md": "# 02. PDO MySQL driver\n\nStatus: patched\n\nDestination: PHP Rust\n\n## What this does\n\nPDO is the PHP database interface Drupal uses to send queries, bind values and\nread results. This patch connects that interface to MySQL/MariaDB so Drupal can\nstore and retrieve its content and configuration. Without it, the existing\nMariaDB-based site could not boot.\n\n## What is implemented\n\nThe local driver passes the recorded MariaDB fixtures and Drupal database boot\nchecks. \u201cPatched\u201d describes this implemented driver scope; it does not promise\nevery PDO mode or compatibility with every MySQL configuration.\n\n## How it is tested\n\n`tests/test-database.sh` runs pdo-mysql, pdo-mysql-edge, database-regressions and\ndrupal-database probes against standard PHP and PHP Rust on a disposable DDEV\nMariaDB project. It requires identical output and no unexpected stderr. A separate\nrestrictions probe checks deliberately rejected charset/comment/SQL-mode cases.\nThese tests were previously recorded as passing; they have not been rerun during\nthis documentation update. Full Drupal create/edit/view remains a separate gate.\n\n## Work\n\n- Audit transactions, bindings, fetch modes and error behavior against Zend.\n- Split any discovered gaps into driver fixes with independent fixtures.\n\n## Test / finish\n\n- Run the MariaDB-backed driver suite and Drupal database operations.\n- Prepare the driver contribution with its supported surface and explicit limitations.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: pdo-mysql.patch\n\n[Overall plan](README.md) \u00b7 [Previous](01-fiber-generators.md) \u00b7 [Next](03-iterators-filesystem.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/03-iterators-filesystem.md": "# 03. Iterators and filesystem\n\nStatus: patched\n\nDestination: PHP Rust\n\n## What this does\n\nIterators let PHP walk collections without loading everything at once.\nRecursiveCallbackFilterIterator walks a directory tree while a callback decides\nwhich entries to keep. Drupal and its libraries use filesystem traversal and\nmetadata when discovering project files.\n\n## What is implemented\n\nThe patches supply recursive callback filtering, make touch work on an existing\ndirectory, and add SplFileInfo::getCTime(). The timestamp fix unblocked Drupal's\nProjectInfo code. A missing file must raise the expected exception without leaking\nan internal warning into Drupal's custom error handler.\n\n## How it is tested\n\n`tests/test-iterator.sh` compares recursive-callback-iterator.php on Zend and PHP\nRust. `tests/test-oob-runtime.sh` includes touch-directory and spl-fileinfo-ctime;\noutput must match exactly with no unexpected stderr. The latter covers the custom\nerror-handler case. The recorded combined 29-probe run passes; that is focused\nbehavioral evidence, not a claim that every SPL class is implemented.\n\n## Work\n\n- Prepare separate iterator, touch and SplFileInfo contributions.\n- Review callback filtering and missing-file error-handler behavior for parity.\n\n## Test / finish\n\n- Run each patch fixture under Zend and PHP Rust.\n- Run the upstream gates and preserve the custom-error-handler regression.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: recursive-callback-iterator.patch, touch-directory.patch, spl-fileinfo-ctime.patch\n\n[Overall plan](README.md) \u00b7 [Previous](02-pdo-mysql.md) \u00b7 [Next](04-class-loading.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/04-class-loading.md": "# 04. Class loading and serialization\n\nStatus: patched\n\nDestination: PHP Rust\n\n## What this does\n\nPHP autoloading locates a class or trait when code first refers to it. Traits\nshare methods between classes. Serialization saves object state so it can later\nbe reconstructed, including private inherited fields and enum values. Drupal's\nservices and cached objects rely on these language behaviors.\n\n## What is implemented\n\nThe patches preserve trait names during autoload, handle shared traits reached\nthrough multiple inheritance paths, avoid autoloading an empty class name, and\ncorrect private-field and enum restoration. These are discrete reproduced bugs,\nnot an unfinished rewrite of PHP's class system.\n\n## How it is tested\n\nThe combined runtime runner compares Zend and PHP Rust using trait-autoload,\ntrait-diamond, serialization-inheritance and enum-serialization probes, alongside\nthe remaining runtime fixtures. It rejects output differences and unexpected\nstderr. The recorded combined run passes. Upstream corpus testing and the final\nDrupal container/cache/browser checks remain submission gates, rather than proof\nthat these specific patches are unimplemented.\n\n## Work\n\n- Separate trait/autoload fixes from serialization fixes for upstream review.\n- Audit case handling, inheritance and serialized field identity.\n\n## Test / finish\n\n- Compare each independent fixture with Zend.\n- Run upstream tests and Drupal container/cache rebuild before preparing submissions.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: trait-autoload-case.patch, trait-diamond.patch, unserialize-private-fields.patch, enum-serialization.patch, empty-class-autoload.patch\n\n[Overall plan](README.md) \u00b7 [Previous](03-iterators-filesystem.md) \u00b7 [Next](05-callables-references.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/05-callables-references.md": "# 05. Callables and references\n\nStatus: patched\n\nDestination: PHP Rust\n\n## What this does\n\nA callable is a function or method passed around for later execution. A PHP\nreference lets two names address the same stored value instead of copying it.\nDrupal uses both heavily: callbacks invoke services, while render arrays and\nViews depend on changes reaching the original array or static property.\n\n## What is implemented\n\nLocal fixes handle reproduced callable dispatch/autoload errors and preserve\nreferences across calls, returns, ArrayAccess and static properties. The Views\nassignment `static::$pageRenderArray = &$element` now compiles; its regression also\nchecks aliases and finally execution.\n\nAdditional fixes cover unpacked builtin arguments targeting fields, forwarded\nfunction reference returns, and value-context static reference returns. The latter\nremoves a native stack overflow during Drupal form validation: a normal assignment\nnow copies the returned value instead of storing a reference inside itself.\n\n## How it is tested\n\n`tests/test-oob-runtime.sh` compares callable-autoload, cross-unit-reference,\ndynamic-reference, static-reference, arrayaccess-reference, return-reference and\nstatic-property-reference probes, among others, against Zend. The recorded\nearlier 29-probe run is superseded by the combined candidate tests in the\n[current receipt](../../../docs/receipts/2026-11-13-authenticated-runtime.md).\nThe actual create/edit/publish journey now succeeds; independent alias, dynamic-call,\nnamed/spread, exception and evaluation-order cases received adversarial review.\n\n## Scope limits\n\nNamed/spread/dynamic reference-argument paths need further investigation. Typed\nstatic-property enforcement and additional expression forms are outside the\nspecific Views fix. Unknown broader coverage does not undo the tested fixes;\nconfirmed new defects should receive their own reproducer and task.\n\n## Work\n\n- Prepare focused dispatch and reference contributions; document dependencies.\n- Probe named/spread/dynamic reference arguments; implement each confirmed gap separately.\n\n## Test / finish\n\n- Run the combined reference/callable probes against Zend.\n- Retain the Views/static-reference regression and obtain runtime review.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: builtin-object-dispatch.patch, callable-method-arguments.patch, callable-autoload.patch, cross-unit-reference-call.patch, dynamic-reference-builtin.patch, static-reference.patch, arrayaccess-reference.patch, return-reference.patch, static-property-reference.patch, ref-builtin-field-spread.patch, function-reference-forward.patch, static-reference-value.patch\n\n[Overall plan](README.md) \u00b7 [Previous](04-class-loading.md) \u00b7 [Next](06-rendering-twig.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/06-rendering-twig.md": "# 06. Rendering and Twig semantics\n\nStatus: partial\n\nDestination: PHP Rust\n\n## What this does\n\nTwig turns Drupal templates and render values into HTML. Its compiler inspects\nPHP functions through reflection, tokenizes text using regex offsets, and expects\nobjects representing markup to convert to strings correctly.\n\n## What is implemented\n\nLocal fixes cover reproduced Stringable conversion, object snapshots, Unicode\nregex byte offsets and chained magic-property argument reads. Their focused\nfixtures pass in the recorded combined run.\n\n## Why this task is still partial\n\nBuiltin reflection currently describes only six named functions rather than a\ngeneral solution. The dashboard and published Utility-page rendering are verified;\nbroader reflection and rendering coverage remain open.\nThis is a specific limitation, not merely waiting for upstream submission.\n\n## How it is tested\n\n`tests/test-oob-runtime.sh` compares strtr-stringable, markup-string, field-concat,\ntwig-markup, builtin-reflection, object-vars-copy, preg-byte-offset and\nchained-magic-argument probes with Zend. Exact output and clean stderr are required.\nThe real dashboard, page form and published content have been inspected. Retain\nthose checks when extending coverage; a successful HTTP status alone is insufficient.\n\n## Work\n\n- Patched dynamic callable unpacking references; the Mercury font prefix is\n  correct after rebuilding Drupal caches. Array-copy isolation is tested.\n  Follow-up namespace, token-scanner and Fiber fixes are implemented separately.\n  See [receipt](../../../docs/receipts/2026-11-12-callable-unpack-reference.md).\n- Patched extended regex comments so token scanning resolves `[site:name]`.\n- Patched string/natural multisort to invoke Stringable conversion. Pure Drupal\n  labels pass; side-effectful conversion order remains different from Zend.\n  [Receipt](../../../docs/receipts/2026-11-12-continuations-and-rendering.md).\n- Audit reflection coverage needed by Drupal; implement missing descriptors with fixtures.\n- Resolve remaining rendering defects revealed after the Fiber fix in separate patches.\n\n- Binary preg replacement preserves Drupal date markers. Current-time DateTime\n  constructors clear stale parse errors, allowing revision timestamp validation.\n  Multibyte case conversion handles translated-label Stringable objects.\n  [Receipt](../../../docs/receipts/2026-11-13-authenticated-runtime.md).\n\n## Test / finish\n\n- Match Zend fixtures, including byte offsets and magic-call ordering.\n- Verify rendered Drupal content contains no fatal errors or placeholder class names.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: strtr-stringable-map.patch, concat-stringable.patch, field-concat-stringable.patch, builtin-reflection.patch, object-vars-snapshot.patch, preg-byte-offset.patch, chained-magic-argument.patch, callable-unpack-reference.patch, preg-extended-comments.patch, multisort-stringable.patch, preg-binary-replacement.patch, date-current-errors.patch, mb-stringable.patch\n\n[Overall plan](README.md) \u00b7 [Previous](05-callables-references.md) \u00b7 [Next](07-sessions-http.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/07-sessions-http.md": "# 07. Sessions and HTTP serving\n\nStatus: patched\n\nDestination: PHP Rust\n\n## What this does\n\nA session cookie connects consecutive browser requests to the same Drupal login.\nWhen Drupal regenerates a session ID, the browser must receive its replacement.\nBrowsers can also open an idle connection before sending a request; that must not\nfreeze the server while other requests are waiting.\n\n## What is implemented\n\nThe session patch emits the replacement cookie on ID regeneration; recorded\nbrowser login persists. The preconnect patch handles idle speculative sockets.\nBoth fixes are implemented and have focused passing evidence.\n\n## How it is tested\n\n`tests/test-session-regenerate.py` exercises a disposable HTTP fixture on both\nruntimes: start and double rotation, an existing cookie, flags, unrelated cookies\nand cookies disabled. `tests/test-server-preconnect.py` checks serving a real asset\nwhile an idle connection is open. These recorded passes are not a fresh test run.\n\n## Separate remaining defect\n\nA connection that sends only part of an HTTP request can still block the sequential\nserver. Idle preconnect handling does not fix that case. It now has its own\n[partial-request handling task](15-http-partial-requests.md), so the two completed\npatches need not be labelled unfinished. Production hardening remains unclaimed.\n\n## Work\n\n- Prepare separate server and session contributions.\n- Keep partial-request handling separate from these two fixes.\n\n## Test / finish\n\n- Run fixtures and check session persistence across requests.\n- Verify Drupal login/logout and requests with early-disconnected clients.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nPrepare discrete fixes; submit only after end-to-end acceptance and user approval.\n\nPatches: server-preconnect.patch, session-regenerate-cookie.patch\n\n[Overall plan](README.md) \u00b7 [Previous](06-rendering-twig.md) \u00b7 [Next](08-optional-cms-gaps.md) \u00b7 [Evidence / guidance](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/08-optional-cms-gaps.md": "# 08. Deferred CMS compatibility\n\nStatus: partial\n\nDestination: PHP Rust\n\nDOM namespace XPath and registered wrapper writes are patched; broader XPath,\ndefault stream-context APIs and cron gaps remain.\nXMLWriter memory support is now owned and patched in task 16; full XMLWriter\nAPI coverage remains outside that focused contribution.\n\n## Current implementation\n\nNamespace XPath support is patched and matches independent Zend fixtures for\ninheritance, shadowing, predicates and PHP namespace-node properties. The current\nregistered wrapper write patch fixes asset generation through `temporary://`.\nThe browser homepage now renders with styles, fonts and JavaScript. Registered\nwrapper enumeration also preserves registration order and resets per request,\navoiding duplicate-registration warnings during Drupal subrequests.\nThe write fixture covers append, arrays, partial writes, contexts, resource input,\nexceptions and zero/false/negative/oversized results. See the\n[current receipt](../../../docs/receipts/2026-11-12-continuations-and-rendering.md).\n\n## Work\n\n- Keep optional sitemap/klaro, aggregation and request cron exclusions explicit.\n- After baseline acceptance, choose individual compatibility gaps to implement.\n\n## Test / finish\n\n- For each chosen gap, add a Zend parity fixture before changing the runtime.\n- Re-enable only the affected feature and prove it works; no blanket CMS parity claim.\n\n## Upstream\n\nNot submitted; prepare discrete fixes. Submit only after end-to-end acceptance and user approval.\n\nPatches: dom-doctype.patch, stream-constants.patch, dom-namespace-axis.patch, user-wrapper-write.patch, stream-wrapper-registry.patch\n\n[Overall plan](README.md) \u00b7 [Previous](07-sessions-http.md) \u00b7 [Next](09-installer.md) \u00b7 [Evidence / guidance](../../../docs/TESTING.md)\n", ".agents/plan/current/09-installer.md": "# 09. Portable one-line installation\n\nStatus: active\n\nDestination: This repository\n\nLocal installation completed. Tracker landing and completion text are implemented locally; automatic local hostname setup is implemented and the existing-site hook passes; fresh-install and Coder acceptance remain open.\n\n## Work\n\n- Finish the canonical repository-based install and fix failures in the owning component.\n- Register unresolved local runtime hostnames through DDEV before launch; user handles authentication. Skip already resolved names and preserve Coder private routing.\n- Publish recovery instructions in the tracker even when registration fails; explain known compatibility gaps prominently.\n- Provide labelled php. and rust. hostnames and print exact URLs; preserve settings and secret-free portable configuration.\n\n- Use OLI launch_path, replacement welcome text and existing hooks; no upstream installer change needed.\n- Preserve Markdown navigation and live preview; installed URLs/status remain credential-free.\n\n- Bundled `php-rust` add-on uses native pre-delete on DDEV 1.25.5+: ordinary AIBP deletion releases owned aliases and previews. DDEV builds a project-scoped image. No bespoke delete command or upstream patch is needed.\n- Dedicated tracker service and hostname; dynamic absolute OLI launch URL. Runtime and hostname setup run before completion.\n- Add-on installation/removal, Compose rendering and native deletion failure/success verified with isolated DDEV 1.25.5 fixture. Full fresh installation/browser checks remain open. See [receipt](../../../docs/receipts/2026-11-12-native-ddev-addon.md).\n\n- Added early DDEV version check with user-run upgrade/trust commands. Native DDEV version constraint enforces the stop before Drupal installation, because OLI hooks are best-effort. Five isolated prerequisite tests pass; see [receipt](../../../docs/receipts/2026-11-12-ddev-prerequisite.md).\n\n## Test / finish\n\n- Serena service and OLI choices implemented: Codex, Claude Code, both or manual;\n  host/Coder VM or DDEV. STDIO and internal HTTP Rust symbol tests pass locally.\n  Existing config is preserved; users handle trust and sign-in. Fresh OLI/Coder and\n  authenticated client sessions remain unverified. See [Serena receipt](../../../docs/receipts/2026-11-12-serena-ddev.md).\n\n- [x] Observe completed installation and running web/phpr services.\n- [x] Verify actual OLI launch opens the tracker; final message lists all three URLs.\n- [x] Verify distinct runtime identities with explicit local DNS resolution.\n- [x] Verify ordinary HTTPS URLs after user repairs DNS: PHP 200; Rust 500 (missing XMLWriter), not a routing failure.\n- [ ] Fresh-install amended configuration; verify Coder and restart persistence.\n- Five hostname tests, seven tracker tests, eight installer tests and repository checks pass. Existing-site setup hook reports both names ready and publishes the tracker. [Receipt](../../../docs/receipts/2026-11-12-tracker-landing.md).\n- Verify named routes reach distinct services, TLS, Drupal trusted hosts and restart persistence; record remaining limitations.\n\n## Upstream\n\nNo upstream change is needed for the requested manual-upgrade guidance and native version constraint. OLI support for aborting before any scaffold is created remains optional; automatic upgrades are outside the requested behavior. Nothing submitted.\n\n[Overall plan](README.md) \u00b7 [Previous](08-optional-cms-gaps.md) \u00b7 [Next](10-coder-tracker.md) \u00b7 [Evidence / guidance](../../../docs/USAGE.md)\n", ".agents/plan/current/10-coder-tracker.md": "# 10. Coder tracker and Serena dashboard integration\n\nStatus: active\n\nDestination: Coder DDEV + this repository\n\nThe existing freeform template can gain a private app button. Integration is designed, not deployed.\n\nTarget confirmed: **DDEV Freeform** (`freeform`), not canvas-migration. Read-only\naccess to its active staging template is verified. The optional owner-only\nSerena app is prepared in `coder/freeform/serena.tf`. Terraform validation and\ntwo mocked plans passed against the downloaded active template. Publication,\nworkspace upgrade and actual Coder proxy acceptance remain pending.\n\nLocal DDEV dashboard routing and HTTP/STDIO Rust symbol lookup pass. OLI hostname\nregistration includes Serena; isolated tests verify cleanup removes only owned\naliases. Existing Mac hostname registration still needs the user's terminal.\nSee [receipt](../../../docs/receipts/2026-11-12-serena-dashboard.md) and\n[Freeform instructions](../../../docs/CODER-SERENA.md).\n\n## Work\n\n- Add optional tracker startup/restart handling and an app resource to existing freeform.\n- Keep installation independent of Coder credentials and template ownership.\n\n## Test / finish\n\n- Check private button access, Markdown refresh and workspace restart.\n- Check local mode remains unchanged and a missing checkout reports not ready.\n\n## Upstream\n\nProposed freeform change; no template update or upstream submission yet.\n\n[Overall plan](README.md) \u00b7 [Previous](09-installer.md) \u00b7 [Next](11-fast-seed.md) \u00b7 [Evidence / guidance](../../../docs/CODER-TRACKER.md)\n", ".agents/plan/current/11-fast-seed.md": "# 11. Fast build and clean seed\n\nStatus: pending\n\nDestination: This repository\n\nA reusable clean Drupal CMS seed and measured fast setup remain to be built.\n\n## Work\n\n- Build a reproducible disposable seed with no real accounts or client data.\n- Cache runtime builds and restore the same baseline for both runtimes.\n\n## Test / finish\n\n- Measure cold build, cached build and seed restore separately.\n- Verify restored content/configuration match and no credentials enter Git.\n\n## Upstream\n\nProject work belongs here; send only proven generic defects to their owning upstream.\n\n[Overall plan](README.md) \u00b7 [Previous](10-coder-tracker.md) \u00b7 [Next](12-benchmark.md) \u00b7 [Evidence / guidance](../../../docs/TESTING.md)\n", ".agents/plan/current/12-benchmark.md": "# 12. Compare capabilities and tradeoffs\n\nStatus: active\n\nDestination: This repository\n\nDesign the study now; Drupal outcome claims wait for matching correctness.\nLatency is one dimension, not the purpose of the comparison.\n\n## Work\n\n- Build a reproducible experiment runner and report for speed, resource cost, security boundaries, operations and agent-assisted development.\n- Choose workloads that expose differences: slow dependencies, constrained memory, parallel sites, failure recovery and debugging.\n- Show wins, losses and inconclusive results; separate measured behavior from hypotheses.\n\n## Test / finish\n\n- Use matched application/configuration/seed and document server-stack differences.\n- Publish repeatable recipes, correctness checks, resource samples and uncertainty for each experiment.\n- Compare completed useful work per budget, not just fast responses; apply the security and agent controls in the study plan.\n\n## Upstream\n\nKeep comparison tooling here. Turn reproducible defects into minimal reports for\nthe owning project. Do not present hypothetical architectural benefits as results.\n\n[Overall plan](README.md) \u00b7 [Previous](11-fast-seed.md) \u00b7 [Next](13-upstream-process.md) \u00b7 [Study design](../../../docs/COMPARISON.md) \u00b7 [Now versus changed Drupal](14-drupal-opportunities.md)\n", ".agents/plan/current/13-upstream-process.md": "# 13. Work out upstream submission process\n\nStatus: pending\n\nDestination: This repository + each owning upstream\n\nExisting patch exports are not yet maintainer-ready submissions. Research and\nlocal preparation can proceed before Drupal end-to-end acceptance.\n\n## Work\n\n- Verify each upstream's current contribution, AI-disclosure, licensing, issue/PR and test requirements; record source links and check dates.\n- Check existing issues/changes for duplicates; choose submission order and explicit dependencies.\n- Prepare independent branches, regression evidence, draft descriptions and exact user-run push/submission steps.\n\n## Test / finish\n\n- Dry-run one small contribution locally from clean upstream: reproduce before, pass after, run required gates.\n- Confirm the package contains only its intended fix and prerequisites; no secrets or unrelated Drupal setup.\n- Produce a reusable submission checklist and identify unanswered maintainer questions without posting them.\n\n## Upstream\n\nPublish only after end-to-end success and user approval. The user handles\nauthentication and pushes; plan how to handle review, revisions and patch retirement.\n\n[Overall plan](README.md) \u00b7 [Previous](12-benchmark.md) \u00b7 [Next](14-drupal-opportunities.md) \u00b7 [Submission preparation](../../../docs/UPSTREAM.md)\n", ".agents/plan/current/14-drupal-opportunities.md": "# 14. Benefits now versus Drupal changes\n\nStatus: pending\n\nDestination: This repository; possible Drupal / PHP Rust proposals\n\nExplore where the runtimes differ today and which opportunities need application\nchanges. No benefit from async, Rust or persistent execution is assumed.\n\n## Work\n\n- Build an opportunity register: unchanged Drupal today, runtime-only changes, Drupal changes, or combined changes.\n- Explore async external I/O, concurrent independent work, background jobs and persistent workers with request-state isolation.\n- Specify the smallest prototype, likely benefit, compatibility cost and owning project for each promising idea.\n\n## Test / finish\n\n- Compare unchanged Drupal first, then one controlled change at a time on both runtimes where supported.\n- Check output/permissions, transactions, cancellation, ordering and cross-request state isolation as well as resource use.\n- Retain negative results; recommend changes only with measured evidence and maintenance costs.\n\n## Upstream\n\nDraft an architectural proposal separately from language-parity fixes. Verify\nDrupal's current processes before proposing changes; submit only with user approval.\n\n[Overall plan](README.md) \u00b7 [Previous](13-upstream-process.md) \u00b7 [Next](15-http-partial-requests.md) \u00b7 [Exploration design](../../../docs/COMPARISON.md) \u00b7 [Contribution process](13-upstream-process.md)\n", ".agents/plan/current/15-http-partial-requests.md": "# 15. Partial HTTP request handling\n\nStatus: pending\n\nDestination: PHP Rust\n\n## What this does\n\nAn HTTP client can connect, send only part of its headers or body, then stall.\nThe recorded sequential-server limitation is that this can hold up unrelated\nrequests. Fixing idle browser preconnections does not cover this case.\n\n## Work\n\n- Reproduce the recorded blocking behavior with a bounded local fixture.\n- Implement appropriate request deadlines or connection scheduling without changing valid request behavior.\n\n## Test / finish\n\n- While one client stalls mid-request, verify a second valid request completes within a declared bound.\n- Check timeout cleanup and valid slow/fragmented requests; avoid an unbounded test hang.\n- Rerun the existing preconnect and session tests. No new fix or passing regression exists yet for this task.\n\n## Upstream\n\nUpstream status: Not submitted.\n\nKeep this server change independent of session-cookie and idle-preconnect fixes.\nPrepare a minimal reproduction and regression for upstream review.\n\n[Overall plan](README.md) \u00b7 [Previous](14-drupal-opportunities.md) \u00b7 [Existing HTTP fixes](07-sessions-http.md) \u00b7 [Recorded limitation](../../../docs/HANDOVER.md)\n", ".agents/plan/current/16-xmlwriter.md": "# 16. Implement XMLWriter for out-of-box Drupal CMS\n\nStatus: patched\n\nDestination: PHP Rust + this repository\n\nThe missing-XMLWriter homepage blocker is fixed locally. The unchanged Drupal\nhomepage returns HTTP 200 and its hero content renders in the browser. Standard\nPHP still responds successfully. Authenticated create/edit/view remains open.\n\n`xmlwriter-memory.patch` implements OO memory writers through libxml2, including\ninheritance, namespaces, escaping, indentation, buffer lifecycle and PHP/libxml\nerror handling. Three parity fixtures and all 32 combined runtime probes pass.\nTwo Cargo integration tests pass in dev-release; the required adversarial review\nfound no remaining blocker for this tested scope. Fresh reconstruction matches.\n\nURI, DTD and procedural APIs remain absent. Native buffers for expired objects\nare reclaimed at later allocation or request shutdown, not necessarily `unset`.\nPHP 8.5-specific reflection/type/error contracts are not certified. See\n[implementation receipt](../../../docs/receipts/2026-11-12-xmlwriter-memory.md).\n\nThe developer image now bundles a pinned PHP 8.5.7 oracle. The real upstream\ndifferential checks pass without bypasses; the full release run reports 1,757\npasses, 2 ignored and 2 failures reproduced on the pre-XMLWriter baseline.\nRun `bash scripts/test-runtime-upstream.sh`; full upstream promotion remains open.\n\n## Work\n\n- Identify the exact Drupal/dependency call path and XMLWriter methods required;\n  do not assume the triggering module from the earlier scoped experiment.\n- Minimise the failure into independent Zend parity fixtures.\n- Implement the required XMLWriter runtime support in the reconstructed upstream\n  checkout, following its process and adversarial review requirement.\n- Export a discrete patch and keep series, Dockerfile and manifest aligned.\n- Do not disable modules or alter Drupal core to count this task as complete.\n\n## Test / finish\n\n- [x] Reproduce ordinary HTTPS homepage: Rust 500, standard PHP 200 on this installation.\n- [x] Match Zend output, escaping, state transitions and error behaviour for required APIs.\n- [ ] Run upstream-required checks and relevant combined runtime regressions.\n- [x] Rebuild the candidate and verify the unchanged CMS homepage.\n- [ ] Continue the full login/create/edit/view journey; record subsequent blockers separately.\n\n## Upstream\n\nNot submitted. Scoped memory support is patched; full upstream promotion gates\nremain open. Keep this as a discrete contribution with its review and fixtures.\nThe user handles authentication and pushes; no upstream submission yet.\n\n## Initial reproduction on phprusttest1 (2026-11-12, before the patch)\n\nThe 31-patch candidate returned HTTP 500 for missing XMLWriter. The independent\nsitemap fixture passed Zend and exited 255 on Rust at its subclass declaration.\nThis historical baseline is preserved in the\n[reproduction receipt](../../../docs/receipts/2026-11-12-phprusttest1-xmlwriter.md).\n\n[Overall plan](README.md) \u00b7 [Runtime completion](01-fiber-generators.md) \u00b7\n[Installation evidence](../../../docs/receipts/2026-11-12-tracker-landing.md)\n", ".agents/plan/current/README.md": "# Overall plan\n\nProvide a reproducible environment where people can try Drupal CMS on PHP Rust,\nsee documented failures and take over tasks. Full runtime parity is not required\nto share the environment. Continue making the out-of-box CMS baseline work,\ninstall it through DDEV / One Line Installer, then explore its capabilities, limitations and tradeoffs against Zend.\nCoder is optional. Migration tooling, OAuth and MCP are excluded.\n\nThese are agent implementation/contribution tasks. Tests are acceptance criteria\ninside each task, not separate project milestones. **Patched** means the described fixes are implemented locally with recorded tests.\n**Partial** is reserved for identified unfinished implementation within a task,\nnot simply waiting for upstream. Each detail explains scope and evidence.\nUpstream status is separate: not submitted, prepared, submitted, then merged\n(committed upstream). No fixes have been submitted or merged upstream yet.\n\n1. [Complete Drupal runtime support](01-fiber-generators.md)\n2. [PDO MySQL driver](02-pdo-mysql.md)\n3. [Iterators and filesystem](03-iterators-filesystem.md)\n4. [Class loading and serialization](04-class-loading.md)\n5. [Callables and references](05-callables-references.md)\n6. [Rendering and Twig semantics](06-rendering-twig.md)\n7. [Sessions and HTTP serving](07-sessions-http.md)\n8. [Deferred CMS compatibility](08-optional-cms-gaps.md)\n9. [Portable one-line installation](09-installer.md)\n10. [Coder tracker integration](10-coder-tracker.md)\n11. [Fast build and clean seed](11-fast-seed.md)\n12. [Compare capabilities and tradeoffs](12-benchmark.md)\n13. [Work out upstream submission process](13-upstream-process.md)\n14. [Benefits now versus Drupal changes](14-drupal-opportunities.md)\n15. [Partial HTTP request handling](15-http-partial-requests.md)\n16. [Implement XMLWriter for out-of-box Drupal CMS](16-xmlwriter.md)\n\nThe current installation has completed login, dashboard, Utility-page creation,\nediting, publishing and anonymous viewing on PHP Rust. The saved page survives a\nservice restart. See the [current receipt](../../../docs/receipts/2026-11-13-authenticated-runtime.md)\nfor the cold-cache follow-up, exact build/test evidence and remaining limits.\nNext priorities are final regression gates, fresh One Line Installer acceptance,\nDDEV Freeform validation and discrete upstream contribution preparation. No full\nruntime-parity or performance claim follows from the scoped browser journey.\nNo upstream fixes have been submitted. User approval remains required for that work.\n[Comparison study](../../../docs/COMPARISON.md) separates today's behavior from\nopportunities requiring Drupal or runtime changes.\n\n[Tracker](../../../tracker.html) \u00b7 [Summary](../../../PROGRESS.md) \u00b7\n[Handover](../../../docs/HANDOVER.md) \u00b7 [Testing](../../../docs/TESTING.md) \u00b7\n[Contribution map](../../../docs/UPSTREAM.md) \u00b7 [Future](../future/README.md) \u00b7\n[Archive](../archive/README.md)\n", ".agents/plan/future/README.md": "# Future work\n\nDo not silently promote these into acceptance requirements for today's extraction.\n\n1. Full One Line Installer matrix: fresh git/local-source installs, update/rerun,\n   interrupted builds, offline/failed downloads, name collisions, different hosts.\n2. Full Coder template lifecycle: workspace recreate/restart, Docker persistence,\n   private app route, websocket/large response behavior, parallel project ports.\n3. Untouched Drupal CMS: restore sitemap/XMLWriter, Klaro/XPath, aggregate assets\n   through stream wrappers, and cron; independently prove each before removing an\n   exclusion. Migration/OAuth/MCP are outside scope, not future promises.\n4. Published multi-architecture runtime images by immutable digest, provenance,\n   cold-cache pulls and verified seed artifacts with no real users or credentials.\n5. Alternative database backends only if they reduce blockers. MariaDB is the current\n   working fixture path; SQLite is an earlier investigation, not the selected stack.\n6. Matched HTTP-server and concurrency studies, memory/CPU profiles and long-running\n   request isolation once correctness and a release build are established.\n7. Broader PHP corpus gates and upstream maintainer review for each contribution.\n8. Choose a license for original repository glue/documentation before inviting broad\n   redistribution. PHP Rust-derived code retains its upstream license and notices.\n", "docs/ARCHITECTURE.md": "# Architecture and ownership\n\n## Installation and runtime\n\n```text\nOne Line Installer + this repository's .drupalaibp config\n  -> DDEV creates Drupal CMS Starter with Composer/Drush on standard PHP\n  -> source overlay supplies runtime patches, tools, docs and plans\n  -> late host hook installs the bundled add-on; DDEV builds the project runtime image\n       |-- web: nginx/PHP-FPM (standard PHP control, Composer and Drush)\n       |-- db: MariaDB\n       |-- phpr: PHP Rust development HTTP server + CLI\n       |-- tracker: static tracker on tracker.\u003cproject-host>\n       `-- serena: pinned Rust analysis tools + agent MCP connections\n```\n\nThe root `.ddev/config.yaml` belongs to the installer/generated project and is\nignored. The tracked `.ddev/config.php-rust.yaml` is a small version overlay;\nit does not replace project names, Coder routing or other generated settings.\nThe bundled `ddev-addon/` supplies services, host commands and a native\npre-delete hook (DDEV 1.25.5+). It is installed after Drupal scaffolding. DDEV\nbuilds PHP Rust from `runtime/Dockerfile`, with a project-specific image tag and\nCompose ownership labels. Standard PHP remains the default web service.\nThe static tracker has no PHP interpreter or database configuration and mounts\nonly generated tracker content. OLI reads its exact URL through `LAUNCH_PATH`.\n\nThe Serena developer service shares project source. MCP port 9121 stays internal;\nits separate dashboard has a DDEV hostname and a loopback-only port for Coder.\nHost agents connect over STDIO through DDEV; container agents use internal HTTP.\nInstaller choices configure Codex/Claude project settings and optionally install\ntheir DDEV add-ons. See [agent setup](SERENA.md).\n\nPHP Rust reads the same project volume and database as Zend. This is useful for\ncorrectness diagnosis, but shared caches contaminate an independent performance\ncomparison. Use cloned seeds/isolated DDEV projects for measurements (TESTING.md).\nThe development server binds host loopback only; no public service is provisioned.\n\n## Repository boundaries\n\n- This repository owns the installer configuration, DDEV service integration,\n  reproducible patch application, fixtures, comparison scripts and project plans.\n- `francescotinti/php-rust` owns language/compiler/runtime fixes. This repository\n  distributes patches against its pinned revision, not a vendored second runtime.\n- `one_line_installer` owns installer behavior. Generic installer bugs should be\n  isolated there; a project-specific hook belongs here. Its generated `drupalaibp`\n  must not be edited directly: upstream changes go in `src/` and are regenerated.\n- The Coder/DDEV template owns VM/container setup, Docker, project naming and\n  authenticated routes. It should invoke the same installer/config, not fork its\n  Drupal setup. No Terraform/template changes are made in this extraction.\n- Drupal owns Drupal behavior. A PHP Rust failure is not a reason to modify Drupal\n  core to mask missing language semantics. Explicit optional scope reductions are\n  documented separately and applied to both comparison arms.\n\n## Reproducibility\n\n`runtime/manifest.json` pins upstream and SHA256 values. `runtime/series` records\napplication order, which is dependency order, not alphabetical order. Docker's\nCOPY/apply order must match. `prepare-runtime.py` reconstructs a fresh checkout\nwithout the original local branches. PHP Rust-derived files retain upstream\nlicensing; see runtime/licenses and NOTICE.md.\n\nRuntime pin does not pin Drupal. Store Composer lock, enabled-module list, theme,\nDDEV/PHP/database versions, build profile, image ID, CPU architecture and seed hash\nwith each acceptance/benchmark receipt. Do not compare two fresh unpinned installs.\n", "docs/CLEANUP.md": "# Normal project deletion\n\nUse the usual AIBP **delete** command. No separate cleanup command or installer\npatch is required for new installations using DDEV **1.25.5 or newer**.\nAIBP calls `ddev delete` from the selected project, then removes its directory.\nDDEV's native `pre-delete` hook releases this checkout's recorded host aliases\nand stops its live tracker previews before DDEV removes project containers,\nvolumes and Compose-built images. DDEV alone leaves the source directory intact.\n\nThe bundled `php-rust` DDEV add-on installs the service configuration and deletion\nhook. PHP Rust is built by DDEV under a project-scoped image tag, rather than a\nshared `drupalphprust:dev-release` tag. Docker base images and build cache may\nremain, as in other DDEV projects. No global prune or process-name kill is used.\n\n## Ownership and failure\n\nRegistration records the absolute checkout root and only aliases it attempts to\ncreate in ignored `.ddev/.runtime-owned-hostnames.json`. Already resolving names\nare not adopted. Cleanup refuses a receipt from another root and keeps failed\nentries for retry. DDEV stops deletion if this hook fails. Handle administrator\npasswords directly in your terminal; never put them in Git or the tracker.\n\nManually created aliases without ownership evidence are preserved. Old sites do\nnot acquire hooks merely by upgrading DDEV: their project configuration must\nalso be updated. The old globally tagged runtime image is not owned by the new\nadd-on and is never removed automatically, because other sites may use it.\n\nTo disable the experiment while keeping Drupal and its database, use:\n\n```bash\nddev add-on remove php-rust\nddev restart\n```\n\nThis removes add-on-managed configuration and commands and releases its aliases.\nIt does not delete your Drupal database. Normal full project deletion remains\nthe AIBP delete workflow. See the [verification receipt](receipts/2026-11-12-native-ddev-addon.md)\nfor tested scope and remaining fresh-install checks.\n", "docs/CODER-SERENA.md": "# Serena dashboard in DDEV Freeform\n\nTarget: the existing **DDEV Freeform** (`freeform`) template in\n`ddev/coder-ddev/freeform`, deployed at `https://staging-coder.ddev.com`.\nRead-only template download succeeded on 12 November 2026: active version\n`thankful_west78`, ID `416847ac-a65f-4303-83e0-e5a3824347a2`.\nDo not use `canvas-migration` or create a separate Drupal PHP Rust template.\n\n## Prepared button\n\n`coder/freeform/serena.tf` adds an opt-in **Serena dashboard** button to\n`coder_agent.main`. It always uses `share = \"owner\"`, independent of the\ntemplate's public website-sharing switch. It uses a subdomain because Serena's\ndashboard makes root-relative requests. The button serves the dashboard only;\nMCP port 9121 remains internal to DDEV.\n\nThe default backend is `http://localhost:24283/dashboard/index.html`. This is\nthe workspace loopback, not the user's laptop. One button targets one Serena\nservice per workspace. Change the parameter if that port is already in use.\n\n## Prepare and publish\n\nDownload the currently active template before every update, preserve its other\nfiles, and add the supplied `serena.tf`. Do not replace the deployed template\nwith an upstream checkout: the deployed version has additional modules.\n\n```bash\ncoder templates pull freeform .work/coder-freeform-new --version active --yes\ncp coder/freeform/serena.tf .work/coder-freeform-new/serena.tf\nmkdir -p .work/coder-freeform-new/tests\ncp coder/freeform/tests/serena.tftest.hcl .work/coder-freeform-new/tests/\n```\n\nThe user publishes an inactive version for review:\n\n```bash\ncoder templates push freeform --directory .work/coder-freeform-new \\\n  --name serena-dashboard-20261112 --activate=false\n```\n\nReview/activate that version in Coder, then update an explicitly selected\ndisposable **Freeform** workspace and enable its Serena dashboard parameter.\nUpdating a workspace can stop/restart it; no existing workspace was updated by\nthe assistant. Template publication, workspace update and the real proxied button\nremain unverified until performed by the user.\n\n## Configure the installed project\n\nInside that workspace, pin the same loopback port while installing:\n\n```bash\nSERENA_DASHBOARD_PORT=24283 bash \u003c(curl -fsSL https://aibp.drupalstarforge.ai/install.sh) \\\n  https://github.com/jamieaa64/drupalphprust --config coder\n```\n\nFor an existing selected site use:\n\n```bash\nSERENA_DASHBOARD_PORT=24283 bash scripts/enable-runtime.sh dev-release\n```\n\nThe chosen port is saved across restarts. Only the dashboard is published, bound\nto `127.0.0.1`. Coder's proxy may preserve its external app Host header. Copy the\nSerena button's hostname (no scheme/path) from Coder and explicitly trust it:\n\n```bash\nddev dotenv set .ddev/.env --serena-dashboard-extra-hosts=YOUR_EXACT_SERENA_APP_HOSTNAME\nddev restart\n```\n\nDo not use `*` or an empty trusted-host list. A 400 Invalid Host response means\nthe exact external hostname has not been allowed; it is not an MCP failure.\nThis does not require a Coder token in Drupal or the repository.\n\n## Acceptance\n\nVerify button visibility, owner-only access, dashboard assets and API requests,\nthe active `php-rust` project, tool activity and stop/start recovery in a disposable\nFreeform workspace. Confirm the public website-sharing switch does not publish\nthe dashboard. Local DDEV checks do not certify Coder proxy behaviour.\n\nThe shared dashboard reflects the long-running HTTP Serena process. Host Codex\nSTDIO connections have separate Serena processes and their calls are not included.\nThe Mac URL on port 24282 belongs to the separately installed host Serena instance.\n", "docs/CODER-TRACKER.md": "# Tracker button in Coder\n\nResearch checked 2026-11-12. This is a proposed integration, not a deployed button.\nThe staging template version has not been compared with upstream freeform yet.\n\n## Can buttons be added later?\n\nYes. Coder's documented persistent workspace buttons are `coder_app` resources in\nthe workspace template. A template administrator can add one to the existing\nfreeform template, then existing workspaces adopt that template version. Updating\na running workspace stops and restarts it. Creating a new Drupal-specific template\nis unnecessary. See [Coder app/port forwarding](https://coder.com/docs/admin/networking/port-forwarding/)\nand [updating workspaces](https://coder.com/docs/user-guides/workspace-management).\n\nThe installer runs inside the workspace; it does not own Terraform resources.\nNo supported installer-only dynamic app-registration mechanism was found in the\nreviewed documentation. Do not put a Coder API token in the project to bypass that\nboundary. Without a template change, start the tracker and open port 8765 through\nCoder's **Open Ports** UI (if allowed by that deployment).\n\n## What freeform already provides\n\nThe reviewed [DDEV freeform template](https://github.com/ddev/coder-ddev/blob/main/freeform/template.tf)\nuses `coder_agent.main` and a mutable `project_names` parameter that creates app\nbuttons for DDEV projects. That parameter is useful for additional Drupal sites;\nit does not register an arbitrary Python tracker port. The default site-sharing\nsetting is private. Keep the tracker owner-only independently of site sharing.\n\n## Small proposed addition\n\nAdd an optional tracker app to the existing freeform template. This illustrative\nresource matches the reviewed agent name; reconcile it with the deployed template\nbefore applying. It does not start the server itself.\n\n```hcl\nresource \"coder_app\" \"drupalphprust_tracker\" {\n  agent_id     = coder_agent.main.id\n  slug         = \"drupalphprust-tracker\"\n  display_name = \"PHP Rust tracker\"\n  url          = \"http://localhost:8765\"\n  share        = \"owner\"\n  subdomain    = false\n  open_in      = \"tab\"\n\n  healthcheck {\n    url       = \"http://localhost:8765/\"\n    interval  = 10\n    threshold = 3\n  }\n}\n```\n\nConfirm fields against the [coder_app provider schema](https://registry.terraform.io/providers/coder/coder/latest/docs/resources/app).\nFor general freeform use, make app creation opt-in with a mutable parameter.\nA later generic contribution should support configurable app names and ports,\nnot hard-code this project into everyone's workspace.\n\n## Work still needed\n\n- Inspect the selected staging freeform version and prepare the minimal template\n  change in its owning repository. No credentials or template state belong here.\n- Add opt-in server lifecycle handling for Coder mode: start after installation\n  and restart with the workspace, using the actual checkout path. Avoid duplicate\n  servers or claiming an unrelated process on port 8765. Until then, run\n  `python3 scripts/tracker.py --serve` from the checkout in a workspace terminal.\n- Keep local installation unchanged. The tracker binds loopback and only serves\n  its documentation snapshot. Its refresh URL is relative for Coder path routing.\n\n## Acceptance\n\nCreate/update a disposable freeform workspace and install with the existing Coder\nconfig. Verify button visibility, owner-only access, nested document navigation,\nlive refresh after Markdown changes and workspace stop/start recovery. Check a\nmissing checkout or failed server is shown as not ready. Recheck local preview.\nThe Terraform example and Coder proxy behavior have not yet been deployment-tested.\n\n[Implementation task](../.agents/plan/current/10-coder-tracker.md) \u00b7\n[Tracker usage](TRACKER.md) \u00b7 [Coder setup](CODER.md) \u00b7\n[Overall plan](../.agents/plan/current/README.md)\n", "docs/CODER.md": "# Optional Coder freeform host\n\nThe project targets **DDEV Freeform** (`freeform`) from\n[ddev/coder-ddev/freeform](https://github.com/ddev/coder-ddev/tree/main/freeform).\nThe known deployment is [staging-coder.ddev.com](https://staging-coder.ddev.com).\nOn 12 November 2026, the existing CLI session could list and download its active\nversion, `thankful_west78` (`416847ac-a65f-4303-83e0-e5a3824347a2`). This is verified\nread access, not a promise of future access or evidence of template publication.\nOlder workspaces named for PHP Rust still use `canvas-migration`; they are not\nthe template target. Do not infer the intended template from those names.\n\nThe [Serena dashboard button](CODER-SERENA.md) is prepared against that template.\n\nCoder supplies a machine with Docker and DDEV. The source and local installation\nhave no Coder dependency. Both hosts use the same One Line Installer config\nfetched directly from this repository and branch.\nNo API keys, workspace tokens, Terraform state or new Coder template are needed\nin this repository. Coder authentication stays in the user's local CLI store.\n\n## Create or select a workspace\n\nUse an existing **DDEV freeform** workspace or create a fresh one in your Coder\nUI. It must provide Docker access, DDEV, Git, Python 3, Bash, the installer and\nenough disk/CPU for a Rust build. Workspace creation and provider login are\nseparate from project installation. No workspace name or server is hardcoded.\n\nIf authentication is needed, run these yourself on your laptop:\n\n```bash\ncoder login YOUR_CODER_URL\ncoder ssh WORKSPACE\n```\n\nInside that workspace, from a parent directory:\n\n```bash\nbash \u003c(curl -fsSL https://aibp.drupalstarforge.ai/install.sh) \\\n  https://github.com/jamieaa64/drupalphprust --config coder\n```\n\nOr omit `--config coder` and choose Coder in the installer's Local/Coder picker.\nThe normal local command uses the same repository URL, with Local selected by\ndefault. Publish changes to `main` first; `--ref` is only for branch testing.\nThe installer reads `.drupalaibp/coder.json` and creates the project using DDEV.\nNo pre-clone or custom launcher is required.\n\nThe repo is public, so cloning needs no GitHub API key. A private fork can use\nuser-managed Git authentication; never add credentials to the remote URL.\n\n## Access the site privately\n\nThe named `php.\u003cproject-host>` and `rust.\u003cproject-host>` routes are served by the\nDDEV router on the workspace machine. They are not automatically public Coder app\nURLs. The Rust service also retains a direct workspace-loopback port for private\ntunnelling. On your laptop:\n\n```bash\ncoder port-forward WORKSPACE --tcp 127.0.0.1:18090:18090\n```\n\nKeep the tunnel running and visit `http://127.0.0.1:18090/`. Choose a different\nlocal port if occupied; prefix the installer with `PHPR_HTTP_PORT=18091` if the remote\nport is occupied. This route needs no template modification or public exposure.\n\nFor the normal Zend site run `ddev describe` in the installed project and forward\nits direct HTTP port in the same way. If your existing template supplies named\nDDEV routes, follow its instructions (`ddev coder-setup` may be available). This\nis optional and is not invoked by our portable installer.\n\n## Work locally, update remotely\n\nUse Git for source changes. The user performs pushes/authentication:\n\n```bash\n# Local source checkout, after reviewing and committing changes:\ngit push -u origin HEAD\n```\n\nThen inside the Coder workspace's source checkout:\n\n```bash\ngit fetch origin\ngit switch YOUR_BRANCH\ngit pull --ff-only\n```\n\nFor a fresh reproducible site run the One Line Installer with a new `--name`. For\nan existing disposable installed site, first ensure its tracked working tree is\nclean, then fetch/switch/pull there and rebuild:\n\n```bash\nbash scripts/build-runtime.sh dev-release\nbash scripts/enable-runtime.sh dev-release\n```\n\nInstaller-managed edits to AGENTS.md or other files may make the installed tree\ndirty. Inspect them; never use reset/clean to force an update. Do not rerun the\nfresh-site installer into an existing destination. Database/content changes and\nComposer lock differences require a separate deliberate sync/restore plan.\n\n## Acceptance and boundaries\n\nCheck both services, login response content, restart persistence and private\naccess. A local install does not prove Coder routing or full Drupal compatibility.\nThe earlier experiment used a standalone server container on an old workspace;\nthose receipts do not certify this DDEV service or this freeform setup.\n\nFor the proposed private workspace button and server lifecycle work, see\n[Tracker in Coder](CODER-TRACKER.md). This integration is not deployed yet.\n", "docs/COMPARISON.md": "# What could PHP Rust change for Drupal?\n\nThe study should explain where PHP Rust is useful, where standard PHP is better,\nand what would need to change to unlock something different. A faster homepage\nalone is not the goal. This is an experiment design, not a list of proven benefits.\nNo security, cost, async or agent-productivity advantage has been demonstrated.\n\n[Comparison task](../.agents/plan/current/12-benchmark.md) \u00b7\n[Now versus changes task](../.agents/plan/current/14-drupal-opportunities.md) \u00b7\n[Execution and baseline controls](TESTING.md) \u00b7 [Overall plan](../.agents/plan/current/README.md)\n\n## Two questions, kept separate\n\n1. **What is better or worse now?** Use unchanged Drupal and equivalent enabled\n   features on both runtimes. Runtime bugs and setup friction count as costs.\n2. **What could become better with changes?** Label the required runtime, Drupal,\n   library or infrastructure changes. Prototype them separately; do not attribute\n   a redesigned application's results to the runtime alone.\n\nKeep an untouched standard Drupal CMS control for feature coverage and a matched\nscoped control for fair comparisons. Reduced functionality is not an efficiency\nwin. The existing HTTP script is one starting instrument, not the whole study.\n\n## Experiment menu\n\n### Useful work under constraints\n\nGo beyond page latency: measure successful concurrent sessions, CPU time per\ncompleted operation, peak/steady memory, startup and idle resource use. Try a\nsmall-memory developer machine, several isolated sites, and a burst after idle.\nFind where each configuration fails or degrades; report errors and tail latency.\nInclude database writes and rendered-content validation, not just HTTP status.\n\nQuestion: can the same resources support more useful work, or does compatibility,\nserver behavior or memory retention erase any apparent advantage?\n\n### Developer and operating cost\n\nMeasure clean install/build, cached rebuild, clean-seed restore, restart and time\nto diagnose an injected fault. Count downloads, disk use, manual steps, patch\nmaintenance and recovery effort as well as CPU/RAM. Distinguish developer cost\nfrom hosting cost: an expensive build may be amortised across many requests.\n\nEstimate cost per verified workload and per idle/active site-hour using explicit\nresource quantities. If converting to money, record provider, region, date and\nprices when running the experiment. Include sensitivity to traffic and utilisation;\ndo not invent a single universal monthly saving.\n\n### Security boundaries and resilience\n\nFirst map the compared stacks: runtime, server, extensions, dependencies, filesystem\npermissions and process/network isolation. Rust implementation alone does not prove\na safer Drupal application. Separate memory-safety hypotheses from application\nvulnerabilities, dependency risk and operational configuration.\n\nOn disposable local fixtures, compare malformed requests, request-size limits,\nslow/partial connections, error disclosure, resource exhaustion and cross-request\nstate leakage. Record whether failures stay contained, cause a crash, expose data,\nor disrupt unrelated work. Also review update/provenance and patch-maintenance\nprocesses. These are bounded observations, not a security audit or vulnerability\ncount contest; do not test third-party services.\n\n### Ease of working with coding agents\n\nUse the same model/version, task prompt, tools, time/token budget and clean starting\nstate on both stacks. Try a small Drupal change, a broken service diagnosis, a\nruntime regression reduction and creating a fresh disposable site. No migration\nagent or MCP integration is required for this study.\n\nMeasure verified completion rate, time/tokens, human interventions, reproducibility,\nquality of error messages and whether another agent can resume from the repository.\nRepeat tasks with fresh contexts and vary run order to reduce familiarity effects.\nInclude developer tooling compatibility and documentation gaps. Score output with\nan independent acceptance check rather than the agent's own success statement.\n\n### Behavior under waiting and long-lived work\n\nUse a controlled local dependency with known delays/failures to study independent\noutbound calls, background jobs and concurrent requests. Measure throughput,\nresource use, fairness and recovery alongside correctness. Fiber support alone\nis not proof of an async scheduler, nonblocking I/O or safe parallel rendering.\nKeep server differences explicit: nginx/FPM versus a native server is a whole-stack\ncomparison unless a separate experiment isolates the runtime.\n\n## Opportunity register: today versus redesigned Drupal\n\nCreate one short record per idea with: problem, current baseline, proposed change,\nowner, dependencies, prediction, smallest falsifying experiment, risks and result.\nAssign one of these categories before measuring:\n\n- **Available today:** no Drupal changes; verify actual support on the pinned builds.\n- **Runtime change:** PHP Rust work only, preserving Drupal/PHP semantics.\n- **Drupal change:** application/core/contrib/library changes with a standard-PHP path.\n- **Combined change:** requires both; isolate their effects where possible.\n\nInitial ideas to investigate, not promised capabilities:\n\n- Concurrent independent external I/O: do relevant clients and schedulers support\n  it, and does batching help both runtimes equally? Check timeout/cancellation and\n  deterministic output before measuring reduced waiting.\n- Async rendering or background work: identify true dependency boundaries; preserve\n  access checks, cache metadata, transaction ordering and exception semantics.\n- Persistent workers: explore startup amortisation against memory growth, service\n  reset requirements and session/user-state leakage across requests.\n- More structured diagnostics and reproducible environments for agents: compare\n  current tooling first, then a small diagnostic or setup improvement on each stack.\n\nFor feasible ideas compare unchanged Zend, unchanged PHP Rust, modified Zend and\nmodified PHP Rust. If an arm is unsupported, explain why rather than awarding it\nzero or crediting a hypothetical improvement. Include implementation/maintenance\ncost, portability and upstream appetite in the recommendation. Keep architectural\nproposals separate from fixes needed for existing PHP behavior.\n\n## Deliverables and decision gates\n\nStart with experiment specifications while runtime work continues. Focused probes\ncan run early if labelled as probes; do not generalise them to Drupal outcomes.\nAfter correctness, build a runner that captures versions, configuration, commands,\nresource limits, seeded data identity and sanitised evidence. Use separate restored\nDB/cache/files for each arm, warm independently, repeat runs and vary order.\n\nEach experiment report should fit on one page: question, prediction, baseline,\nchange, correctness checks, measurements, uncertainty, result and next decision.\nUse verdicts **better**, **worse**, **no material difference**, **inconclusive** or\n**unsupported** with an explicit metric and workload. Keep larger raw results out\nof the short tracker. Results may support a tradeoff rather than an overall winner.\n\nProduce a final capability/tradeoff matrix and a prioritised opportunity register.\nChoose a few high-value experiments from the menu rather than claiming exhaustive\ncoverage. Publish no composite score until its weights and purpose are justified.\n", "docs/GITHUB.md": "# GitHub handoff\n\nDestination: https://github.com/jamieaa64/drupalphprust (public, empty when inspected\n2026-11-11). This extraction is prepared on a local `codex/standalone-ddev-project`\nbranch. No push or authentication is performed by the agent.\n\nAfter reviewing the local commit, the user can populate the empty repository's main:\n\n```bash\ncd /absolute/path/to/drupalphprust\ngit status --short\ngit log -1 --stat\ngit push -u origin HEAD:main\n```\n\nUse the actual checkout path provided in the handoff. If the remote has acquired\ncommits since extraction, fetch/review and integrate them first; do not force-push.\nAlternatively publish the prepared branch for review using:\n\n```bash\ngit push -u origin codex/standalone-ddev-project\n```\n\nIn that case installer trials must name `--ref codex/standalone-ddev-project` until\nmain contains the config. The user performs any GitHub login in their own terminal.\nPublishing this project is distinct from submitting patches to PHP Rust upstream.\n\nOnce published, another agent can clone the repository, read AGENTS.md, inspect\n.agents/plan/current/README.md and reproduce runtime source with the provided script.\nDo not require the previous local directories, chat or Coder credentials to begin.\n", "docs/HANDOVER.md": "# Resume from Git\n\nRead AGENTS.md and `.agents/plan/current/README.md` first. This document is the\nhandover for the standalone repository, not a request to resume migration work.\n\n## Portable project entry\n\nThe earlier extraction checkout was recreated outside the migration folder at\n`/Users/jamesabrahams/code/ai/drupalphprust` on `codex/portable-installer`.\nThis path is a local convenience, not a runtime requirement. Use the One Line Installer directly with just the GitHub repository URL from a parent directory. Local is the first\nconfiguration choice; Coder is selectable interactively or with `--config coder`.\nPublish to main for that default command; `--ref` is only for branch testing. The Python launcher\nis an optional developer helper, not the supported user-facing setup command.\nSource is shared through Git; installed databases, credentials and build outputs\nstay local to each host. See USAGE.md and CODER.md before provisioning.\n\n## Fresh installation and contributor entry\n\nThe installed tracker opens before Drupal exploration and prominently renders\n[Try it](TRY-IT.md): known failures, ownership and recovery. The fresh CMS homepage\nnow renders on PHP Rust after the XMLWriter memory fix, owned by task 16.\nSee [implementation evidence](receipts/2026-11-12-xmlwriter-memory.md): 32\ncombined probes pass and the browser shows the expected hero. That was the earlier XMLWriter checkpoint; the newer browser evidence is below.\nThe historical Fiber/Generator receipt describes the earlier reduced-feature site;\nthe current runtime section below records the newer CMS journey.\nFull parity is not required to share this experimental environment.\n\nThe new bundled DDEV add-on requires DDEV 1.25.5+, gives the tracker its own\nhostname, and uses normal DDEV deletion hooks. See the\n[native integration receipt](receipts/2026-11-12-native-ddev-addon.md); fresh full\ninstallation and browser checks remain pending. Older sites are not upgraded automatically. An early project check now prints\nmanual upgrade instructions and writes a native DDEV version constraint before\nthe first service start; see the [prerequisite receipt](receipts/2026-11-12-ddev-prerequisite.md).\n\nAutomatic local hostname registration now runs before OLI announces completion using\nactual runtime URLs and DDEV; passwords remain in the user terminal. Coder keeps\nprivate routes/tunnels. No Rust language fix was made in this installer change.\n\n## Current runtime status \u2014 13 November 2026\n\nThe selected disposable installation is `phprusttest1`, at\n`/Users/jamesabrahams/code/ai/phprust/phprusttest1`. Its local DDEV runtime image is\n`debian:bookworm-slim-phprusttest1-phpr-built`. These names describe this receipt,\nnot portable installer requirements.\n\nPHP Rust has now completed the actual browser journey: login, dashboard, create a\nUtility page, edit its body, publish it and view the updated content anonymously.\nThe synthetic page is node 2,
