h snapshots and observed controls. Use a dedicated\nlocal disposable account; credentials stay in an ignored file or user-managed secret.\n\n1. Homepage: expected theme/hero/content, no raw class names, warnings or errors.\n2. Login: submit the actual form; verify a subsequent authenticated request, not\n   only a redirect or session row. Check dashboard content independently.\n3. Create: open a standard page form, fill title/body, save/publish, verify success\n   and database persistence through Drupal's normal interfaces.\n4. Edit: change the saved page through the UI, save and confirm the changed text.\n5. View: fresh request and anonymous browser context show published content correctly.\n6. Reload/restart: verify the result after a service restart and record any limitation.\n\nRepeat on standard PHP with the same application version, enabled modules and seed.\nInspect browser console/server diagnostics and response content. HTTP 200, a title\nor a heading alone is insufficient. Record which runtime handled each request.\nNo successful Rust create/edit/view has been recorded yet.\n\n## 4. Installer and DDEV smoke test \u2014 prepared, deliberately not run now\n\nUse a clean source checkout and disposable target outside it. Record installer\nrevision/version, source branch/commit, DDEV/Docker versions and architecture.\n\n- Run USAGE.md's local-source One Line Installer command once.\n- Confirm profile installed Drupal CMS Starter and Composer lock was captured.\n- Confirm source overlay retained the generated base DDEV name/config and docs/plans.\n- Require `.ddev/.runtime-ready`, correct image, actual running phpr service and\n  expected page responses; installer may swallow hook failures as warnings.\n- Check Zend still works, files/database are shared as designed, `ddev phpr` works.\n- Stop/start DDEV and verify both endpoints again.\n- Verify optional exclusions were not silently applied by the installer.\n\nFull rerun/upgrade/failure matrix is deferred in `.agents/plan/future/README.md`.\nDo not spend this phase testing all One Line Installer features.\n\n## 5. Coder smoke test\n\nRun the same installer/config in DDEV freeform. Validate the additional host/router\ncontract in CODER.md: project name, Docker permissions, persistence, private URLs,\nlogin cookies and restart behavior. Do not use the old CMS migration template as a\nhidden dependency. Template changes, if needed, are their own contribution.\n\n## 6. Normal Drupal CMS control and fair runtime comparison\n\nMaintain two kinds of control:\n\n- **Untouched standard Drupal CMS:** identifies features currently excluded from\n  PHP Rust. This is a coverage reference, not a fair speed comparator if it runs\n  more modules/features.\n- **Matched standard-PHP control:** identical lock, modules, settings, seed DB/files\n  and content to the candidate. This is the speed/correctness comparator.\n\nCapture a clean synthetic seed after setup; give it a content hash, include files\nand config, and exclude real client data. Restore into separate named DDEV projects\nfor measured runs. Each engine needs its own DB/cache/files to avoid warming or\ncorrupting the other arm. Warm each independently and use matching cache states.\nPrepared seed/restore automation is future work; do not reuse the old migration\nharness with MCP/OAuth gates.\n\nRecord before every run: Git/runtime/patch manifest hashes, image ID and profile,\nComposer lock hash, Drupal/modules/theme, PHP/database/DDEV/Docker versions, host\nCPU/RAM/architecture, resource limits, server stack, OPcache/JIT settings, fixture\nand seed identity, cache policy, run order and sample count.\n\nMeasure separately:\n\n| Metric | Boundary | What it answers |\n| --- | --- | --- |\n| Runtime source build | Clean build vs cached rebuild | Developer/build cost |\n| Installer provisioning | Empty project to ready verified services | Setup cost |\n| Seed restore | Prepared artifact to verified usable site | Fast start strategy |\n| Service startup | Existing image/site stopped to ready | Restart cost |\n| First request | Known cold application cache | Cold request cost |\n| Warm requests | Equivalent warmed caches, valid responses | Steady latency |\n| Memory/CPU/errors | Same workload and concurrency | Resource/robustness cost |\n\nUse release builds for reported performance. Do not compare Rust dev-release with\nan optimized Zend stack and call it an interpreter result. The supplied script:\n\n```bash\npython3 scripts/benchmark-http.py --zend http://127.0.0.1:ZEND_PORT \\\n  --rust http://127.0.0.1:RUST_PORT --contains 'Your hero content goes here' \\\n  --rounds 20 --output results/homepage-http.json\n```\n\nReplace port placeholders. It records sequential ABAB whole-stack requests and\nexcludes the first observation from warm summaries. It validates status/text but\nstill needs prior browser/error validation. Fixed ABAB order can bias results;\nrepeat with reversed order or extend to seeded random/ABBA order before publishing.\nFirst observation is not a cold-cache measurement unless caches were controlled.\nReport raw samples, median/p95, errors and variance across repeated runs. No speedup\nclaim until both arms pass all correctness checks. Match serving stacks in a later\nexperiment if isolating interpreter cost; nginx/FPM versus native server is a\nwhole-stack comparison.\n", "docs/TRACKER.md": "# Small progress tracker\n\nOpen **tracker.html** in a browser or the site's preview window. It is a standalone\nsnapshot with no external libraries, login or network dependency. Select a task\nto see its short work/test plan. Markdown remains the source of truth.\n\nFor a live preview from the repository root:\n\n```bash\npython3 scripts/tracker.py --serve\n```\n\nOpen `http://127.0.0.1:8765` in the site window. It refreshes from the Markdown\nfiles every five seconds. The server binds loopback and serves only the tracker\nand its documentation snapshot, never the whole checkout. Use `--port` if needed.\nStop it with Ctrl-C. No Drupal, DDEV or Coder is needed to view progress.\n\nAfter editing the plans, refresh the standalone file:\n\n```bash\npython3 scripts/tracker.py\n```\n\nEdit PROGRESS.md for the short summary. Edit numbered Markdown files under\n`.agents/plan/current/` for implementation work, acceptance checks and contribution\nownership. Statuses: active, patched, partial, blocked, pending, deferred, done. **Patched**\nmeans the described fixes are implemented locally with recorded test evidence.\n**Partial** means identified implementation work remains within the task.\nUpstream status is independent: not submitted, prepared, submitted or merged\n(committed upstream). Preparing or waiting for review does not make a fix partial. Every runtime patch belongs to one\ntask; the patch inventory stays in Markdown while the UI keeps it out of the way.\nKeep detailed logs in receipts. Overall, adjacent-task, future and archive links\nconnect the documents. Agents regenerate the snapshot after plan changes.\n\nFor a Coder UI button, see [Coder tracker integration](CODER-TRACKER.md).\n\nBrowsers normally restrict reading neighbouring files from a file:// page. The\nstandalone HTML therefore embeds a generated snapshot; the optional local server\nreads the same Markdown live. No file-picker permissions or browser exceptions.\n\n[Overall plan](../.agents/plan/current/README.md) \u00b7 [Progress](../PROGRESS.md)\n\n## Installed landing page\n\nOLI opens `tracker.\u003cproject-host>`, a generated snapshot served by a separate\nstatic DDEV service from `.ddev/.tracker`, outside Drupal\u2019s document root. Prominent\nlinks read `.ddev/.runtime-urls`; timestamped service status is separate from\nruntime compatibility. Portable Git snapshots contain no installation metadata.\nNo dotenv file, credentials or complete DDEV response is embedded.\n\nUse `python3 scripts/tracker.py --install` to refresh service status and publish.\nNormal regeneration updates Markdown in an already managed installed page too.\n`--serve` retains the live Markdown view; use `--port 8766` if 8765 is occupied.\nCoder private routes/tunnels remain necessary; local URLs are not assumed to be\naccessible outside the workspace.\n\nThe prominent introduction is authored in `docs/TRY-IT.md`; update that document\nwhen known blockers or contributor entry steps change. Hostname setup has its own\nstatus, independent of service health and runtime acceptance. Failed registration\nis recorded with explicit retry steps; if the tracker hostname itself cannot\nresolve, use `python3 scripts/tracker.py --serve` for the loopback preview.\n", "docs/TRY-IT.md": "# Try the project: what works and what is missing\n\nThis is an experimental development environment, not a finished replacement for\nPHP. The installer builds the candidate, starts both runtimes and opens this\ntracker so you can explore failures and take over a task. Completing every PHP\nRust feature is not a prerequisite for sharing the environment.\n\n## Start here\n\nUse **Drupal on standard PHP** for the working control homepage. Use **Drupal on\nPHP Rust** to try the candidate against the same Drupal files and database.\nChanges made in either site affect the other; service status alone does not prove\nruntime compatibility. Use synthetic content, and do not compare performance on\nthis shared database.\n\n## Current known failures\n\n- **Fresh CMS homepage: missing XMLWriter.** PHP Rust returns HTTP 500 on the\n  observed installation because this PHP class is absent. This is expected to\n  remain broken until [task 16](../.agents/plan/current/16-xmlwriter.md) is fixed.\n  The exact dependency call path still needs investigation. Standard PHP returned\n  HTTP 200 on the same installation. Reinstalling does not implement XMLWriter.\n- **Earlier reduced-feature experiment: Fiber suspension inside a Generator.**\n  Page creation reached this runtime failure after earlier fixes and explicit\n  feature exclusions. [Task 01](../.agents/plan/current/01-fiber-generators.md)\n  owns it; it has not yet been reached on the untouched fresh CMS installation.\n- **Additional known coverage gaps:** DOM XPath, stream-wrapper writes, request\n  cron and other CMS paths remain unverified or incomplete. See the historical\n  scope in [task 08](../.agents/plan/current/08-optional-cms-gaps.md). XMLWriter now\n  has its own active task; the older deferred classification is not a fresh-site\n  compatibility claim.\n- **HTTP server limitation:** partial requests may block the development server.\n  [Task 15](../.agents/plan/current/15-http-partial-requests.md) owns this. Do not\n  treat the experimental server as production-ready.\n\n## If site links do not open\n\nLocal installation registers unresolved runtime hostnames through DDEV. Enter any\nadministrator password directly in the installer's terminal. If that step fails\nor is cancelled, run `python3 scripts/register-runtime-hostnames.py`, followed by\n`python3 scripts/tracker.py --install`. The tracker shows hostname setup separately\nfrom timestamped service status and runtime compatibility. Coder users need their\nexisting private workspace routes or tunnels; see [Coder access](CODER.md).\n\n## Pick up the work\n\nSelect a numbered task below for scope, tests and upstream status. **Patched**\nmeans implemented locally; it does not mean submitted upstream or full CMS parity.\nStart with [handover](HANDOVER.md) and [testing](TESTING.md). Record the image,\nfixture and exact result in a receipt. Do not conceal runtime failures by silently\nturning off Drupal features. Historical exclusions are documented experiments,\nnot automatic installer changes. No end-to-end or speed claim has been established.\n\n## Removing an installation\n\nUse the normal AIBP delete command. With DDEV 1.25.5+ and this add-on installed,\nDDEV performs the project cleanup automatically. See [cleanup](CLEANUP.md).\n", "docs/UPSTREAM.md": "# Discrete upstream contributions\n\nNothing is submitted upstream until the scoped Drupal end-to-end flow works and\nthe user decides to submit. Preparation can happen now: small fixes, independent\nfixtures, explicit dependencies and local review. Do not publish one giant\n\u201cDrupal support\u201d PR.\n\n## Ownership\n\n| Change | Destination |\n| --- | --- |\n| PHP language, compiler, VM, SPL/PDO/DOM behavior | francescotinti/php-rust |\n| Project config, DDEV service, benchmark/handover tooling | jamieaa64/drupalphprust |\n| Generic One Line Installer defect | Drupal one_line_installer, source in src/ |\n| Coder host/routing/template defect | The actual DDEV/Coder template repository |\n| Drupal bug reproducible on supported standard PHP | Relevant Drupal core/contrib project |\n\nDo not submit installer/template changes merely because this config needs a hook.\nDo not patch Drupal to conceal PHP Rust language differences.\n\n## Candidate units and evidence\n\nOrder below is the integration patch order. Rows are candidate review units, not\nan assertion of independent applicability. Several patches touch the same VM files;\nuse declared dependency chains or rebuild a minimal branch from pinned upstream.\n\n| Patch | Review focus / regression |\n| --- | --- |\n| pdo-mysql | MariaDB PDO behavior and explicit unsupported modes; database probes; likely split driver from edge fixes |\n| recursive-callback-iterator | Recursive callback and filesystem traversal; contains more than one original branch, split if independently testable |\n| trait-autoload-case | Preserve trait name case through autoload; trait-autoload PHPT |\n| trait-diamond | Reuse identical trait implementation; depends on trait resolution behavior |\n| unserialize-private-fields | Restore private storage; inheritance round-trip fixture |\n| builtin-object-dispatch | Dynamic builtin object protocols (Countable etc.) |\n| callable-method-arguments | Deferred callback arguments resolved in caller scope |\n| callable-autoload | Class autoload while building static callable |\n| cross-unit-reference-call | Reference-returning function across included units |\n| fiber-static-dispatch | Native Fiber calls through dispatch variants; builtin-dispatch dependency |\n| fiber-callback-trampoline | Suspension through call_user_func wrappers; Fiber dispatch dependency |\n| dom-doctype | DOM document/namespace construction; document limited namespace semantics |\n| strtr-stringable-map | Stringable replacement-map conversion |\n| concat-stringable | Stringable concatenation in slot operations |\n| dynamic-reference-builtin | Correct mutation through dynamic reference-first builtins |\n| enum-serialization | Enum round-trip serialization |\n| static-reference | Reference binding to static call results; original NestedArray blocker |\n| field-concat-stringable | Render-array leaf concatenation, aliases, reentrancy and COW; concat dependency |\n| arrayaccess-reference | Nested reference-returning offsets, WeakMap dimension semantics; field-concat dependency |\n| builtin-reflection | Six builtin descriptors used by Twig; metadata generated with PHP 8.4.8; not generic reflection support |\n| return-reference | Forwarded method/static reference returns and arguments; static-reference dependency |\n| touch-directory | touch an existing directory without opening it as a file |\n| empty-class-autoload | Empty class name must not reach autoload |\n| server-preconnect | Poll idle speculative sockets; partial request behavior remains a limit |\n| object-vars-snapshot | Singleton internal reference wrappers must not leak into property snapshots |\n| stream-constants | Stream-wrapper constant values and namespaced resolution |\n| session-regenerate-cookie | Emit replacement cookie after ID rotation; HTTP regression |\n| preg-byte-offset | Convert byte-mode start offset into internal Latin1 view; Unicode Twig reproduction |\n| chained-magic-argument | Dereference receiver before deferred property read; magic/hooks/visibility fixtures |\n| spl-fileinfo-ctime | Timestamp accessor, inherited iterator behavior and failed-stat RuntimeException |\n| static-property-reference | Bind static storage to source cell, preserve old aliases, return references and execute finally; static-reference/return-reference dependencies |\n\nThe `static-property-reference` candidate covers static-property reference binding\nand bare reference returns. Its alias/rebinding/finally fixture passes Zend parity and fixes Views class loading;\nfull browser acceptance is still blocked elsewhere. Reference-call RHS binding, parenthesized/dynamic forms and typed static-property enforcement\nremain outside this candidate.\nRuntime assertions differ in coverage: see HANDOVER.md rather than equating every\nexported patch with completed browser validation.\n\n## Reconstruct, edit and export\n\n1. Run `scripts/prepare-runtime.py` into a fresh `.work` directory. Read upstream's\n   AGENTS/process files. The current candidate is uncommitted in that checkout.\n2. Reproduce the behavior on a documented standard-PHP oracle. Minimise the test.\n3. Add a focused PHPT in tests/phpt, then implement the smallest correct runtime fix.\n4. Review object/reference/COW, exception, reentrancy and error/notice semantics;\n   follow upstream's single adversarial reviewer requirement.\n5. Export only the new change relative to the applied series, not the entire tree\n   diff against upstream. Use a temporary local baseline commit if helpful. Add the\n   patch to series/Dockerfile and regenerate its hash in manifest.json.\n6. Reconstruct from scratch and run affected tests, combined Drupal checks, and the\n   upstream-required gates before calling a submission ready. Full upstream corpus\n   and performance promotion gates have not been completed for this experiment.\n7. Build per-fix branches from upstream with only necessary dependencies. Include\n   fixture, explanation, before/after evidence, error behavior and coverage limits.\n   Keep unrelated setup files and generated benchmark outputs out of runtime PRs.\n\nA good PR says: trigger, previous failure, corrected behavior, minimal regression,\nwhy this layer owns the fix, dependencies, executed validation and remaining gaps.\nList behavioral dependencies explicitly; \u201capplies after the integration branch\u201d is\nnot enough for an upstream reviewer. Mark larger PDO/DOM work experimental until\nit meets the maintainer's own quality bar.\n\nThe user authenticates and pushes. Prepare exact commands and reviewable commits;\ndo not submit through an API to bypass that preference.\n\n## Agent work queue\n\nThe [current plan](../.agents/plan/current/README.md) assigns each patch below to\none implementation/contribution task. Patched status does not imply upstream\nreadiness; each task includes remaining work and acceptance checks.\n\n## Establish the submission process before publishing\n\nOwned by [task 13](../.agents/plan/current/13-upstream-process.md). The existing\npatch map is not a verified guide to each maintainer's current submission process.\nFor each actual destination, research its current contribution/process files,\nissue tracker, supported base branch, test commands, sign-off/licensing rules and\nAI-assistance disclosure policy. Record exact source links and date checked;\nresolve conflicting historical instructions before preparing a submission.\n\nCreate a local contribution register containing: fix, destination, duplicate issue\nor PR, prerequisites, branch/base commit, minimal fixture, required gate results,\ndraft title/body, review status and next action. Start with one small isolated fix\nto prove the process before splitting the larger driver/compiler changes.\n\nPrepare a dry-run submission packet with before/after evidence, minimal diff,\nexecuted validation and known limits. Document the exact user-run authentication,\nfork/push and issue/PR steps once the destination and branch are verified. Do not\ninvent commands or post maintainer questions during research. Publication remains\ngated on end-to-end success and user approval.\n\nAlso document the follow-through: addressing review, rerunning dependent branches,\nrecording upstream acceptance, updating the pinned runtime and removing a local\npatch only after its replacement passes the combined suite. An accepted upstream\nchange is not automatically integrated into this project.\n", "docs/USAGE.md": "# Install and use\n\n## Status and prerequisites\n\nA local installation completed on 12 November 2026. Updated tracker launch and\ncompletion stages were verified separately; a fresh install of the updated config\nand Coder acceptance remain untested. See [receipt](receipts/2026-11-12-tracker-landing.md).\n\nHost requirements: DDEV **1.25.5 or newer** and working Docker, Git, Bash and Python 3; One Line Installer\n2.x with config-source and late-hook support. No Rust toolchain is needed on the\nhost because Docker builds it. Allow several minutes and enough disk/CPU for a\nRust build. Coder freeform supplies the host; see CODER.md.\n\nThe project checks DDEV before configuration and prints upgrade commands when\nit is older than 1.25.5. A native DDEV version constraint then blocks the first\nservice start, before Composer installs Drupal or the PHP Rust build runs. OLI\nhooks alone only warn, so the constraint supplies the enforced stop. A small\nconfiguration scaffold can remain; after upgrading, rerun the original installer\nfrom its parent directory with a new empty destination. Existing sites are never\nremoved automatically to retry.\n\nFor Homebrew, run `brew upgrade ddev/ddev/ddev`. If Homebrew reports an untrusted\nformula, first run `brew trust --formula ddev/ddev/ddev`, then repeat the upgrade.\nVerify with `ddev --version`. Passwords and trust decisions stay with you. The\nproject never runs an upgrade or changes Homebrew trust automatically.\n\n## Separate source and installed projects\n\nKeep a source checkout and disposable sites as siblings, for example:\n\n```text\n~/code/ai/drupalphprust/          # Git source, patches, plans, docs\n~/code/ai/drupalphprust-local/    # Generated Drupal/DDEV site\n```\n\nThe source checkout needs no Coder client, credentials, API keys or sibling\nrepositories. The installed site contains generated Drupal files and its database;\nthose are not the portable source. Do not move databases through Git.\n\n## Run the One Line Installer directly\n\nFrom a **parent directory**, not an existing DDEV site:\n\n```bash\nbash \u003c(curl -fsSL https://aibp.drupalstarforge.ai/install.sh) \\\n  https://github.com/jamieaa64/drupalphprust\n```\n\nThe installer fetches the repository's default branch. Its configuration picker\nshows **Local (default)** first and **Coder** second. Choose Local (or press Enter)\nfor your laptop. It asks for a new project name; no `--name`, `--config` or `--ref`\nis needed for normal local installation. DDEV handles its usual setup prompts,\nincluding administrator authentication in your terminal when needed.\n\nFor Coder, run inside an existing DDEV freeform workspace and either choose Coder\nor append `--config coder`. This is the installer's existing config argument,\nnot an invented `--coder` flag. No new Coder template is required.\n\nThe two configs share the same build and hooks. They pre-answer the host choice\nas `DRUPALPHPRUST_TARGET=local` or `coder`; the installer saves that non-secret\nanswer in ignored `.ddev/.env`. The host hook reads only that key, without sourcing\nor exposing other environment values. `main` must contain these changes before\nthe default URL command uses them; `--ref BRANCH` remains optional for development.\n\nFor unattended installation use `--yolo --config drupalphprust` locally or\n`--yolo --config coder` on Coder: the upstream installer requires a selector when\nmultiple configs are present in unattended mode. The normal interactive command\nabove needs no selector.\n\nThe late hook builds the runtime and enables the DDEV sidecar. Since upstream\ncan continue after hook failure, verify in the generated project:\n\n```bash\ntest -s .ddev/.runtime-ready\nddev describe\nddev exec -s phpr phpr tests/probes/fiber-generator-suspend.php\nddev logs -s phpr\n```\n\nInstallation still does not prove full Drupal rendering compatibility. Use a new\nproject name for retries: `drupalphprust-local` is a preserved partial attempt.\nThe direct Rust loopback port is allocated automatically to avoid collisions.\nAn explicit `PHPR_HTTP_PORT=18091` persists across restarts and rebuilds.\n\nThe optional Python developer helper is not part of this default workflow. Raw\nupstream local-path sources copy the whole source folder, including ignored files;\nuse a clean checkout for those. Git URL installs fetch committed source only.\n\n## Host prerequisite failures\n\nIf DDEV reports an unresolved `NAME.ddev.site` hostname and asks for administrator\nprivileges, enter your password directly in your interactive terminal when DDEV\nrequests it. A separate hostname command is not the normal installation workflow.\nDo not give an agent your password. A failed fresh install may leave a partial\nfolder: inspect and preserve it before choosing a new destination or retrying.\nThe launcher never deletes or resets an existing directory to force a retry.\n\n## Rebuild or recover a failed hook\n\nFrom the installed project, after checking the error:\n\n```bash\nbash scripts/build-runtime.sh dev-release\n# Or rerun the complete late hook, which also updates its completion marker:\nbash .drupalaibp/setup-runtime.sh\n```\n\nThe hook's working directory must be the installed project root. It uses Docker\non the host and DDEV for services; it does not run inside the PHP web container.\nThe source config's `./setup-runtime.sh` path is relative to `.drupalaibp/`; the\ninstaller stages that hook into the generated project root. No `../` copy_paths\nare needed: the source overlay supplies the repository.\n\n## Day-to-day commands\n\n```bash\nddev start\nddev drush status                 # standard PHP tooling\nddev tracker                      # open the tracker\nddev phpr tests/probes/fiber-generator-suspend.php  # known failing compatibility probe\nddev logs -s phpr\nddev stop\n```\n\nThe installer prints two named URLs and saves them in `.ddev/.runtime-urls`:\n`https://php.\u003cproject-host>/` runs standard PHP, and `https://rust.\u003cproject-host>/`\nruns PHP Rust. It derives the host and scheme from DDEV, rather than the folder\nname. The original DDEV URL continues to use Zend. These are separate service\nroutes, not two names for the standard PHP web container.\n\nDDEV allocates the direct Rust loopback port; inspect `ddev describe` for the\nactual mapping. On Coder this is on the workspace machine. To pin a tunnel port,\nrun `PHPR_HTTP_PORT=18091 bash scripts/enable-runtime.sh dev-release`.\nDifferent projects must use different explicitly pinned ports.\nUse separate browser contexts for control/candidate to avoid shared-host cookies.\n\nTo disable the experiment, use `ddev add-on remove php-rust`, then\n`ddev restart`. The normal web/db services and database remain.\n\n## Scoped compatibility experiment\n\nThe existing evidence comes from a site with these explicit reductions. On a\nnew **disposable** site, apply them only if reproducing that scoped baseline:\n\n```bash\nddev drush pm:uninstall simple_sitemap klaro -y\nddev drush config:set system.performance css.preprocess 0 -y\nddev drush config:set system.performance js.preprocess 0 -y\nddev drush config:set automated_cron.settings interval 0 -y\nddev drush cache:rebuild\n```\n\nCheck module availability/dependencies first; do not force uninstall dependent\nfeatures. Record changes for both engines. These are not automatically applied\nby the installer. Keep a normal, untouched Zend CMS control for reporting what has\nbeen excluded; compare performance only between equivalently configured sites.\n\n## Release and measurement\n\nOnly after correctness passes:\n\n```bash\nbash scripts/build-runtime.sh release\n```\n\nThis changes the runtime image, not the application's Composer lock or database.\nFollow TESTING.md for cache/seed isolation and repeatable results. The included\nbenchmark is sequential HTTP latency tooling, not a complete load-testing system.\n\n## Named-route checks\n\nAfter runtime setup, read `.ddev/.runtime-urls` and open both URLs. Confirm the\nRust hostname appears only on the phpr service in `ddev utility compose-config`.\nDo not add it to `additional_hostnames`, which would also route it to standard PHP.\nThe web service retains existing DDEV aliases and adds the labelled PHP alias.\nCustom hostnames without wildcard DNS may need normal DDEV/local hostname setup.\nCheck TLS and Drupal trusted-host settings on the installed site. Use separate\nbrowser contexts for the two runtimes; application cookie settings may span hosts.\n\nRouting uses DDEV's documented [custom service hostnames](https://docs.ddev.com/en/stable/users/extend/custom-compose-files/).\n\n## Tracker landing page\n\nOLI opens `https://tracker.\u003cproject-host>/` on its own static DDEV service.\nThe actual scheme, hostname and port are derived from DDEV and saved as the\nabsolute `LAUNCH_PATH` in ignored `.ddev/.env`, which OLI already supports. The final message\nlists the tracker and both runtime sites using actual installation metadata.\n`python3 scripts/tracker.py --install` publishes the page and refreshes timestamped\nservice status; `--message` prints the three URLs. Normal tracker regeneration\nalso refreshes Markdown in any managed installed copy. Only generated tracker content is served, from ignored `.ddev/.tracker`,\noutside Drupal\u2019s document root.\n\nBefore OLI announces completion, the setup hook registers all three unresolved local hostnames through\n`ddev hostname`, inheriting the installer terminal for any user authentication.\nAlready resolving names are skipped. Coder keeps its existing private routes and\ntunnels. A failed or cancelled registration is shown in the tracker with a retry\ncommand; it does not suppress the tracker page.\n\nTo retry, run `python3 scripts/register-runtime-hostnames.py`, then\n`python3 scripts/tracker.py --install`. Alternatively, the user can run\n`ddev hostname HOST 127.0.0.1` for each hostname in `.ddev/.runtime-urls`.\nDDEV may request an administrator password. Do not add the Rust hostname to\n`additional_hostnames`, which would route it to standard PHP.\n\n## Removing an installation\n\nUse the normal AIBP delete command. The bundled add-on uses DDEV\u2019s native\npre-delete hook; no extra command is needed. See [cleanup](CLEANUP.md).\n", "docs/history/DATABASE-FINDINGS.md": "> Historical investigation record imported on 2026-11-11. Paths and status below may be stale. Read ../../.agents/plan/current/README.md first.\n\n# Experimental PDO MySQL driver\n\nThe pinned PHP Rust source already implements mysqli using Rust's `mysql` crate.\nDrupal uses PDO instead. This patch adds `Pdo\\Mysql` and PDO dispatch over the\nexisting wire client, preserving the Drupal CMS installation and MariaDB database.\n\nSource: `francescotinti/php-rust`, commit\n`72f688c3183b79858c01d250ce3999d86e143544`, development branch\n`codex/drupal-pdo-mysql` in the temporary source checkout. The durable source change\nis `patches/pdo-mysql.patch`; no upstream changes have been published.\n\n## Scope\n\nImplemented paths include DSN connection, the PHP 8.4 PDO factory/subclass,\nDrupal's PDO options, positional/named parameters, native and client-emulated\nbinding, buffered fetching, numeric/string/null conversions, matched-row counts,\nlast insert IDs, transactions, savepoints and PDO error reporting.\n\nThis candidate targets DDEV's MariaDB 11.8. `inTransaction()` queries MariaDB's\nactual session state. It is **not a general MySQL-compatible production driver**:\nMySQL proper and older MariaDB servers have not been validated. It rejects\nunsupported TLS options, persistent connections, unbuffered queries, executable\nSQL comments, column metadata and unsafe session charsets. Advanced PDO features,\nlarge results and stored procedures are outside the validated subset.\n\nSingle-statement enforcement uses MySQL's prepared-statement protocol even for\nclient-emulated queries. The PHP scanner is not the security boundary. This also\nmeans additional round trips and that commands must be preparable (MariaDB\n10.6.2+ supports the relevant commands). The original mysqli behavior is unchanged.\nBoth quoting and placeholder scanning consult current connection settings;\nunsupported multibyte charsets fail closed after `SET NAMES` as well as at connect.\nThis correctness-first implementation has not been optimized or benchmarked.\n\n## Reproduce in the disposable Coder workspace\n\nFrom `/home/coder/php-rust-lab`, with this experiment's files uploaded:\n\n```sh\ndocker build -f Dockerfile.pdo-mysql -t canvas-phpr:pdo-mysql .\nbash test-database.sh /home/coder/php-rust-migration php-rust-migration\nbash install-coder-runtime.sh /home/coder/php-rust-migration canvas-phpr:pdo-mysql\n```\n\nThe tests use the DDEV-only `db` database/user/password defaults. Writes are to\nconnection-local temporary tables. The Drupal test reads `core.extension` from\nconfiguration, uses Drupal's real connection/query classes, and does not require\na service container. Outputs and diagnostics go under ignored `results/database`.\nThe runner requires successful processes, empty unexpected stderr, and exact\nZend/Rust output matches. The restrictions probe separately checks deliberate\nfail-closed behavior rather than claiming parity for unsupported features.\n\nTests cover binary values, Unicode, injection-shaped bound values, numeric and\nnull values, native and emulated statements, parameter errors, SQLSTATEs, silent\nerrors, transactions/savepoints, changed versus matched rows, repeated parameters,\nreferences, autocommit, cursor reuse, and existing SQLite/mysqli behavior.\n\n## Full Drupal remains a separate gate\n\nWith the initial PDO patch, Drupal bootstrap advanced beyond the missing\n`Pdo\\Mysql` class and failed at `RecursiveCallbackFilterIterator` in module\ndiscovery. That missing SPL class is unrelated to database connectivity. The\nmain migration application remains on Zend until full bootstrap and authenticated\nOAuth/MCP checks succeed. Passing database tests is not a working-agent or speed\nclaim. The separate SQLite `createCollation()` gap is unchanged.\n\n## Validation result \u2014 10 November 2026\n\nThe final hardened image passed all four byte-for-byte fixture comparisons against\nDDEV PHP 8.4 and the separate charset/comment/ANSI_QUOTES fail-closed probe:\n\n- `pdo-mysql`: core PDO operations, emulated and native.\n- `pdo-mysql-edge`: numeric boundaries, autocommit, cursor reuse and error cases.\n- `database-regressions`: existing SQLite scalar functions/rollback and mysqli.\n- `drupal-database`: Drupal 11.4.12's unmodified connection and query wrappers.\n- `pdo-mysql-restrictions`: unsafe session charsets, executable comments and\n  multiple statements under ANSI_QUOTES.\n\nThis is a focused integration suite, not the upstream project's full PHP corpus,\nrelease test battery or performance certification. Those broader gates have not\nbeen run, and this patch is not an upstream runtime release.\n\nThe candidate was installed into `php-rust-migration` and its installed `ddev phpr`\npassed the Drupal database fixture against the Zend reference. Standard PHP still\nbootstraps Drupal 11.4.12 with all six required Canvas/OAuth/MCP modules. Installed\nPHP Rust reports both `mysql` and `sqlite` PDO drivers; its full bootstrap exits\n255 at the missing iterator class noted above.\n\nVerified build receipt:\n\n- Patch SHA256: `0e4993ff5684b35d8f7effc113bb8281f4146350c975989c18fd845280b700a6`.\n- Runtime image ID: `sha256:034a8d9417bc6c9146270d4e2a86af9581816ca802888eaf9c0777f0ca1020a5`.\n- Original pinned runtime image remains available; only the isolated test\n  workspace's experimental PHP Rust binaries were replaced.\n", "docs/history/ITERATOR-FINDINGS.md": "> Historical investigation record imported on 2026-11-11. Paths and status below may be stale. Read ../../.agents/plan/current/README.md first.\n\n# Recursive callback iterator support\n\n`patches/recursive-callback-iterator.patch` adds PHP's\n`RecursiveCallbackFilterIterator` and repairs two existing SPL behaviors needed\nby Drupal's extension discovery:\n\n- Recursive children retain the callback and subclass identity.\n- `RecursiveDirectoryIterator::current()` honors `CURRENT_AS_SELF`.\n- `RecursiveIteratorIterator` walks live iterators lazily. Its previous eager\n  collection retained multiple references to the same mutable directory iterator,\n  causing different entries to report the final filename.\n\nThe traversal handles the three ordering modes, depth limits and\n`CATCH_GET_CHILD`, including exceptions from child detection and retrieval.\nThese are focused compatibility fixes, not a claim of complete SPL conformance.\n\n## Build and reproduce\n\nThe iterator image includes the previous PDO MySQL patch. From the uploaded lab\nin the disposable Coder workspace:\n\n```sh\ndocker build -f Dockerfile.iterator -t canvas-phpr:iterator .\nbash test-iterator.sh /home/coder/php-rust-migration\nbash test-database.sh /home/coder/php-rust-migration php-rust-migration canvas-phpr:iterator\nbash install-coder-runtime.sh /home/coder/php-rust-migration canvas-phpr:iterator\n```\n\nThe iterator runner compares stdout exactly against standard PHP in DDEV and\nrejects unexpected stderr. Fixtures cover arrays, filesystem pruning, multiple\nfiles using Drupal's `CURRENT_AS_SELF` pattern, traversal ordering, depth limits,\nsubclass propagation, invalid arguments, callback failures and inaccessible\nchildren. Temporary filesystem fixtures are removed in `finally`.\n\nThe patch is separate from `pdo-mysql.patch`; the original baseline and the\nPDO-only image remain available. No upstream publication or full upstream PHP\nconformance/performance suite is included in this experiment.\n\n## Verified result \u2014 10 November 2026\n\nThe compiled image passes the complete iterator fixture byte-for-byte against\nDDEV's standard PHP. All four PDO/database comparison suites and the database\nfail-closed security probe also pass.\n\nFull Drupal bootstrap now advances beyond extension discovery into Symfony's\nservice-container compilation. It exits 255 because PHP Rust cannot compile\n`web/core/lib/Drupal/Core/DependencyInjection/AutowireTrait.php`, reported by\n`ContainerBuilder::getReflectionClass()`. This is a separate compiler gap;\nfull Drupal and OAuth/MCP readiness have not yet passed. The normal Zend control\nremains the main application runtime.\n\nThe final candidate was installed in `php-rust-migration`. The installed\n`ddev phpr` matches the complete Zend iterator fixture; the installed bootstrap\nreproduces the AutowireTrait failure. Zend still boots Drupal 11.4.12 with the\nsix required Canvas/OAuth/MCP modules and a working MySQL connection.\n\nBuild receipt:\n\n- Iterator patch SHA256: `7f9bdbdece57813c636276481ed275a81fa5c5a27763da7585c55d61c4e7c5aa`.\n- Image ID: `sha256:786b7c1081774f3a2425f862d6a14bd92199c7c2847fdd1820a7b48d59c2286d`.\n", "docs/history/OOB-FINDINGS.md": "> Historical investigation record imported on 2026-11-11. Paths and status below may be stale. Read ../../.agents/plan/current/README.md first.\n\n# OOB Drupal comparison: working notes\n\n## Environment\n\n- Coder workspace `php-rust-migration`, separate clean project `/home/coder/drupal-oob`.\n- Official Drupal CMS 2.2.8 Starter recipe, Drupal core 11.4.12, Mercury theme.\n- Zend PHP 8.4.27, MariaDB 11.8, DDEV 1.25.5.\n- Runtime upstream source pinned at `72f688c3183b79858c01d250ce3999d86e143544`.\n- The original migration project and seed workspace are retained.\n- `simple_sitemap` alone was uninstalled: XMLWriter is absent in PHP Rust.\n- No OAuth, MCP or migration-agent acceptance requirements.\n\n## Confirmed so far\n\n- PHP Rust boots Drupal, builds its dependency container and reads configuration\n  using the experimental PDO MySQL driver against MariaDB.\n- Zend browser: homepage, login, dashboard, create and publish a Utility page,\n  edit and save it, and render the updated body all passed on 2026-11-11.\n- PHP Rust HTTP rendering is still under investigation. A successful bootstrap\n  is not a successful browser workflow.\n\n## Runtime corrections isolated locally\n\nPDO MySQL, recursive callback/filter/filesystem iterators, nested trait autoload\ncase, diamond trait reuse, private-property unserialization, builtin object\nprotocol dispatch, and deferred arguments in object-method callbacks each have\nfocused fixtures and separate local contribution branches. Callable class\nautoloading is the next candidate under validation.\n\n## Known limits outside the current fixes\n\n- The driver targets the tested MariaDB subset, not complete PDO MySQL parity;\n  see DATABASE-FINDINGS.md for restrictions and explicit rejections.\n- Countable objects with an explicit second `count()` mode argument still fail.\n- `Closure::fromCallable()` invalid-callable errors and exceptions thrown by an\n  autoloader do not yet match Zend's TypeError wrapping. The autoload candidate\n  tests successful class loading, not full error-message parity.\n- These are experimental compatibility patches, not upstream release pins.\n  The upstream full corpus/performance promotion gate has not been run.\n\n## Measurements\n\nNo validated PHP Rust HTTP performance result yet. `benchmark-http.py` records\ninterleaved requests, validates status and required page content, and retains raw\nsamples. It measures the whole HTTP stack, not isolated interpreter throughput.\n\nLatest regression run: the four database parity suites, explicit driver safety\nrestrictions, recursive iterator suite, and seven focused runtime fixtures pass.\nCross-file reference-return binding subsequently passed its focused fixture and\nadvanced rendering to Fiber suspension. Dynamic Fiber dispatch is being tested.\n\nThe adversarial review identified a same-unit namespace fallback aliasing edge\ncase and missing native Fiber argument validation. Both have source corrections\nand new fixtures queued for the next build; neither is counted as verified yet.\n\nThe Fiber dispatch fixture now passes pause/resume through static, dynamic,\nspread, named and instance calls, including argument-error classes. Drupal then\nexposed a panic when suspension crosses `call_user_func_array`'s synchronous host\ncallback bridge. A frame-based trampoline candidate is under validation.\n\nThe callback trampoline fixture passes direct, dynamic, spread and namespaced\ncalls, reference arguments and reference returns. Suspension through other\nsynchronous host callbacks (for example an outer `array_map`) remains unsupported.\nRendering advanced to HTML5 DOM document/namespace construction; those additions\nand Stringable replacement-map handling are now under validation. An HTTP 200\ncontaining warnings or a fatal error is explicitly not a successful page.\n\nDOM namespace additions currently support explicit prefixes without rebinding,\nplus element default namespaces. Automatic attribute-prefix generation and\nrebinding an existing prefix are explicitly rejected; they must not silently\nchange the namespace of existing attributes. The underlying DOM implementation\nhas other pre-existing limitations and is not advertised as full ext/dom parity.\n\n## 2026-11-11 continuation: static references and render-array concatenation\n\n- `NestedArray::unsetValue()` failed compiling `$ref = &self::getValue(...)`.\n  The compiler now reuses static dispatch followed by checked reference binding.\n  `probes/static-reference.php` matches Zend on mutation through the returned\n  alias, self/parent/static/dynamic calls, named/spread value arguments, and the\n  notice/copy behavior of a non-reference return. A standalone PHPT is included.\n- Broader probes exposed pre-existing gaps: direct static-property reference\n  arguments/returns, and reference input arguments through named/spread calls.\n  These are not claimed fixed by the static return-binding change.\n- Automatic request-triggered cron is disabled (`automated_cron.settings interval\n  0`) for this disposable comparison site. Canvas's cron health check currently\n  encounters a schema callback returning null instead of bool. Foreground page\n  verification does not establish cron compatibility.\n- Minimal Twig rendering, Markup serialization round trips, and a Fiber render\n  pass on both engines. Full HTML remained malformed even after truncating the\n  response caches: render-array `.=` used a separate path that omitted\n  `__toString`. A field-concatenation fix and expanded regressions are in progress.\n- An HTTP 200 containing Markup class names is explicitly a failed page check.\n- The first field-concatenation approach was rejected during review because it\n  broke ArrayAccess reads. The replacement keeps the original path walker and\n  defers Stringable conversion until storage borrows end. A weak destination\n  handle preserves Zend behavior if conversion copies or replaces the root;\n  singleton internal references remain invisible to ReflectionReference.\n  `field-concat` now passes the bilateral regression, including ArrayAccess.\n- Chromium exposed the next real component errors: nested writes discarded\n  reference-returning `offsetGet()` results (including WeakMap), and reflection\n  failed for builtin closures used by Twig. Fixes are under validation. Builtin\n  reflection metadata is explicitly limited to abs/json_encode/max/min/range/\n  is_iterable, exported with the installed PHP 8.4.8 oracle; it does not claim\n  complete builtin reflection coverage.\n- Nested ArrayAccess regression now includes expression results and the\n  distinction between WeakMap's public value-returning method and its dimension\n  access. Both match Zend. All six Twig builtin callbacks now reflect correctly\n  through Drupal's actual Twig service.\n- Current remaining foreground warnings include forwarded by-reference method\n  returns, `touch()` of Twig cache directories, empty-name class autoload, and\n  a Twig documentation-target index warning. The simple recursive property-stack\n  probe matches Zend; the last warning needs a fuller reproduction.\n- Browser navigation exposes a separate CLI-server issue: an idle speculative\n  TCP connection blocks ready requests for its 60-second read timeout. The\n  candidate polls accepted sockets for readiness, retaining sequential PHP\n  execution. A dedicated idle-preconnect regression is included.\n\n### Browser login continuation\n\n- Forwarded return references, directory touch, empty-name autoload, object-var\n  snapshots and stream constants have focused Zend/Rust passing probes. The\n  expanded suite still needs a final run against the combined candidate.\n- Idle-preconnect HTTP regression passes. The server still processes PHP\n  sequentially and is not claimed hardened against partial HTTP requests.\n- The HTML scanner's bounded ASCII/Unicode/NUL probe matches Zend. A diagnostic\n  instruction budget interrupted a large HTML parse but did not prove an\n  infinite loop. Repeated session warnings expanded rendered pages substantially.\n- Login POST persisted an authenticated database session, but its redirect was\n  anonymous: `session_regenerate_id()` did not emit the new session cookie.\n  `test-session-regenerate.py` reproduces this on the old candidate without\n  printing cookie values. A narrowly separated cookie-renewal patch is building.\n- Optional Klaro consent processing and CSS/JS aggregation are being disabled\n  on the shared test site to focus on authoring. Known excluded gaps are DOM\n  XPath expressions used by Klaro and `file_put_contents()` to registered\n  userland stream wrappers. These exclusions apply to both comparison engines;\n  they must not be described as full default Drupal CMS compatibility.\n- Session renewal now passes the HTTP regression on Zend and Rust: two rotations\n  in one response, resumption, existing-cookie rotation, cookie flags, unrelated\n  cookies, and cookies disabled. Login now reaches authenticated routes.\n- Clean homepage and login form render without warnings after the scoped config\n  changes. Dashboard then failed Twig tokenization after non-ASCII text: byte-mode\n  preg_match passed a raw byte offset into its Latin1-expanded engine subject.\n  Offset translation fixes the isolated Twig cases and regex regression.\n- Page creation exposed a separate deferred argument read bug: a reference-returning\n  magic getter left the next property receiver wrapped, bypassing __get and hooks.\n  A minimal chained-property method-argument reproducer is now included; its\n  receiver-dereference correction is under validation.\n", "docs/history/SQLITE-FINDINGS.md": "> Historical investigation record imported on 2026-11-11. Paths and status below may be stale. Read ../../.agents/plan/current/README.md first.\n\n# SQLite compatibility investigation \u2014 10 November 2026\n\n## Actual seed identified\n\nUsing the existing staging Coder session and read-only `coder ssh` commands:\n\n- Server: `https://staging-coder.ddev.com`\n- Workspace: `TestVersion1` (template `canvas-migration`)\n- DDEV project and path: `migration-version-1`, `/home/coder/migration-version-1`\n- Architecture: `x86_64`\n- DDEV: `v1.25.5`; MariaDB image `11.8`; Docker `29.9.2`\n- Drupal: `11.4.11`; MySQL driver; Drush bootstrap successful\n- Enabled: `canvas`, `canvas_oauth`, `canvas_tools`, `simple_oauth`, `mcp_server`,\n  `mcp_server_oauth`, `mcp_server_tool_bridge`, and Drupal CMS modules\n- Installed dependency sizes: vendor 176 MB; node_modules 513 MB; public files 9 MB\n- The seed repository has no HEAD commit, so provenance cannot be established by\n  a Git SHA there. Use the installed Composer lock and installer-config hashes.\n- Installed Composer lock SHA-256:\n  `4abd0fdc8fd5bd19b694d16383c1fd27fe5f2c4ec6b4710a4ef610113bb3b78d`.\n- The installer did not retain `.drupalaibp/drupal-cms-coder.json`. Capture now\n  records that config provenance is unverified and packages the restore hooks\n  from this reviewed branch, instead of assuming the installed site kept them.\n- Confirmed `.mcp.json`, `node_modules/.package-lock.json` and\n  `web/.ht.router.php` exist. The fast-restore prerequisites checked so far are\n  present; this is not yet an executed capture/restore validation.\n\nNo database conversion, module changes, dependency installation or seed export was\nperformed. The snapshot and end-to-end runtime tests remain unexecuted. The\nruntime image tested locally was ARM64, not the staging workspace's architecture.\n\n## Reproduced blocker\n\nInspected the actual seed's\n`web/core/modules/sqlite/src/Driver/Database/sqlite/Connection.php`.\nFor PHP >= 8.4, Drupal constructs its `SqliteConnection` subclass of `Pdo\\Sqlite`,\nregisters SQL functions, then calls:\n\n```php\n$sqlite->createCollation('NOCASE_UTF8', Unicode::strcasecmp(...));\n```\n\nThe pinned PHP Rust source is `72f688c3183b79858c01d250ce3999d86e143544`.\nIts runtime reports PHP 8.5.7, so Drupal takes this PHP >= 8.4 path.\n`sqlite-probe.php` exercises the relevant APIs in independent in-memory databases:\n\n| Operation | Zend PHP 8.4.8 | PHP Rust 8.5.7 |\n| --- | --- | --- |\n| Subclass of Pdo\\Sqlite, SELECT 1 | Pass | Pass |\n| createFunction with first-class callable | Pass | Pass |\n| createCollation and case-insensitive comparison | Pass | **Fail: undefined method** |\n| BEGIN IMMEDIATE, prepared insert, commit, rollback | Pass | Pass |\n\nExact runtime failure:\n\n```text\nError: Call to undefined method LabSqliteConnection::createCollation()\n```\n\nThe probe uses `strcasecmp` for a minimal ASCII example; it does not establish\nfull Unicode collation compatibility. Failure occurs at method availability,\nbefore the callback can run. The legacy `PDO::sqliteCreateCollation` also reports\nabsent, so forcing Drupal onto its older PHP path would not solve it.\n\n## Reproduce\n\nFrom the repository root, with the image already built:\n\n```bash\nphp experiments/php-rust/sqlite-probe.php\n```\n\n```bash\npython3 experiments/php-rust/lab.py check-runtime --driver sqlite\n```\n\nThe first command passes on the tested Zend installation; the second exits 1\nwith the per-check report. No project files or persistent database are mounted\ninto the test container. `check-runtime --driver mysql` separately fails because\nthe image exposes only PDO SQLite, not PDO MySQL.\n\n## Consequence and next implementation step\n\nA SQLite seed cannot currently run this Drupal version on the pinned runtime.\nDo not skip collation registration or substitute different comparison rules:\nthat would change database behavior and invalidate the comparison.\n\nThe next PHP Rust work is to implement correct SQLite collation callbacks (or\nimplement PDO MySQL to preserve the original database stack), test them against\nZend, then rerun Drupal bootstrap, OAuth, MCP and Canvas write tests. There may\nbe further compatibility gaps after this first blocker is fixed.\n\nIf SQLite becomes viable, build a fresh Drupal CMS SQLite seed using the same\nlocked packages and recipes. A MySQL SQL dump cannot simply be imported into\nSQLite. Compare Zend/SQLite against PHP Rust/SQLite to isolate runtime effects;\nretain Zend/MySQL as the original deployment baseline. The current snapshot tool\nstill intentionally supports MySQL/MariaDB only. No SQLite restoration support\nis claimed or enabled.\n", "docs/receipts/2026-11-11-repository-extraction.md": "# Repository extraction validation \u2014 2026-11-11\n\nPrepared locally for `https://github.com/jamieaa64/drupalphprust`. No remote push,\nnew Drupal install or Coder provisioning was performed for this extraction.\n\n## Executed checks\n\n- `python3 scripts/check-repo.py`: exit 0. All 29 patch hashes, application order,\n  Docker upstream pin, config JSON, shell syntax and plan folders agree.\n- `python3 scripts/prepare-runtime.py --source \u003cearlier-runtime-clone>`: exit 0.\n  Fresh non-hardlinked checkout at pinned upstream, all 29 patches applied cleanly.\n  The source argument avoided a redundant network clone; the script defaults to\n  the public upstream URL when another agent has no existing checkout.\n- Compared all 35 patched/new runtime source files from the reconstruction to the\n  earlier integration checkout: byte-identical. No sibling-repo source is needed\n  by the committed Docker build or normal reconstruction path.\n- `python3 -m compileall -q scripts tests`: exit 0.\n- `docker compose -f runtime/docker-compose.phpr.yaml config --quiet` with synthetic\n  DDEV_SITENAME/DDEV_APPROOT: exit 0. This validates Compose structure/interpolation,\n  not DDEV's service lifecycle, mounts or application routing.\n- `php -l` over 51 PHP probe files: all passed on the local PHP oracle.\n- Active documentation Markdown links checked: no missing local targets.\n- Source inventory excludes generated site files, databases, credentials, browser\n  sessions, raw historical logs and `.work` source reconstruction.\n\n## Not executed / not claimed\n\nNo One Line Installer run, new DDEV service startup, Coder template smoke test,\nnew runtime compilation, expanded PHP differential suite, full upstream corpus,\ncreate/edit/view browser acceptance, seed restore or performance comparison.\nPrevious runtime/browser observations are recorded separately in HANDOVER.md and\nare not treated as proof that the new installer/DDEV integration works.\n", "docs/receipts/2026-11-12-automatic-hostnames.md": "# Automatic hostname setup and contributor entry \u2014 12 November 2026\n\n## Implemented locally\n\nOLI's existing `before_launch_site` hook now runs\n`python3 scripts/register-runtime-hostnames.py` before publishing the tracker.\nThe script reads only the two labelled bases in `.ddev/.runtime-urls`, validates\nthem, and invokes `ddev hostname HOST 127.0.0.1` for unresolved local aliases.\nIt inherits the installer's terminal, never handles passwords, rechecks resolution,\nand skips aliases already resolving to 127.0.0.1. A Coder target does not change\nhost DNS; its receipt says private routing is required. Target selection is saved\nbefore building so even a failed build retains the intended host mode.\n\nThe network receipt is ignored and contains only an enumerated status. Failure\nor cancellation produces a failing hook exit while still publishing the tracker.\nOLI may continue after failed hooks, so the page and final message explicitly\nreport hostname status. Runtime-build failure may leave no site URLs; the final\nmessage now reports unavailable URLs rather than crashing with a missing key.\n\n`docs/TRY-IT.md` renders prominently above the Markdown task list, explaining the\nstandard PHP control, shared database, missing XMLWriter (task 16), historical\nFiber/Generator failure, deferred coverage and partial-request server limitation.\nTask 08's classification is unchanged; XMLWriter's fresh-site blocker has its\nown active task. No module was disabled and no runtime compatibility fix is claimed.\n\n## Verification\n\nRuntime/image unchanged: `drupalphprust:dev-release`, DDEV v1.25.0, project\n`phprusttest1`. Prior receipt identifies source/runtime image and HTTP results.\n\n- `python3 tests/test-runtime-hostnames.py`: five tests pass. Injected DDEV and\n  resolver fixtures cover unresolved custom hostnames with ports, successful\n  registration, idempotence, failed command, wrong post-registration DNS,\n  credential URL rejection and Coder skip. No hosts file mutation in these tests.\n- `python3 tests/test-tracker.py`: seven tests pass.\n- `python3 tests/test-installer-launcher.py`: eight tests pass, including host\n  target selection without evaluating unrelated dotenv values.\n- After verifying both actual hostnames resolve locally, executed\n  `bash .drupalaibp/setup-tracker.sh`: both report ready, no authentication or\n  hosts mutation required, installed tracker published successfully.\n- `python3 scripts/tracker.py --message`: all three actual URLs plus\n  `Hostname setup: ready` printed.\n- Reloaded the installed tracker in Chrome: both hostname cards show ready,\n  and the visible introduction explains known failures with links to task owners.\n- Repository checks, snapshot freshness and diff whitespace checks pass.\n\nLimits: the user already registered these two hosts. The new missing-host branch\nis fixture-tested; the real DDEV registration command was exercised earlier by\nthe user, not re-executed against a new hostname by the agent. A fresh OLI install\nand Coder browser routing remain to be tested. This change makes the experiment\naccessible and explains gaps; it does not fix XMLWriter or establish Drupal parity.\n", "docs/receipts/2026-11-12-ddev-prerequisite.md": "# Early DDEV prerequisite and manual upgrade guidance\n\nDate: 2026-11-12. User requested a check and commands they run themselves,\nthen retry installation. No automatic package upgrades, trust or authentication.\n\n## Implementation\n\nBoth OLI configurations run the standalone `check-ddev-version.sh` host hook at\n`before_configure_ddev`. OLI stages this early script into `.ddev/drupalaibp-hooks`\nat project-directory creation. The script prints the detected/minimum version\nand Homebrew/apt upgrade commands; Homebrew formula-specific trust is conditional\non the user receiving that error. It writes an owned DDEV overlay containing\n`ddev_version_constraint: '>= v1.25.5'`. Recovery uses the same script in read-only\n`--check-only` mode through `scripts/require-ddev.py`.\n\nOLI's hook runner warns and continues after failure. The DDEV constraint is the\nactual enforced stop at first service start, before Drupal Composer installation\nand the Rust build. OLI's `step_start_ddev` calls `ddev start` under its normal\nstrict pipeline. A small configuration scaffold can remain. Guidance tells users\nto preserve it and rerun from the parent with a new empty destination; it never\ninstructs automatic deletion of an existing site. No upstream OLI change needed\nfor this manual-upgrade workflow. Aborting before directory creation would need\nadditional installer support.\n\nDDEV documents this constraint in its [configuration reference](https://docs.ddev.com/en/stable/users/configuration/config/#ddev_version_constraint).\n\n## Validation and limits\n\n- `python3 tests/test-ddev-prerequisite.py`: five tests passed, covering old,\n  unknown, prerelease and supported versions; no automatic upgrade commands;\n  repeatability, check-only behavior, owned-file protection and both configs.\n- `python3 tests/test-installer-launcher.py`: eight passed.\n- `python3 tests/test-runtime-config.py`: three passed.\n- `python3 scripts/check-repo.py`: patch hashes, config and shell checks passed.\n- Real `ddev config` on an empty temporary fixture accepted the overlay. The\n  attempted real `ddev start` did NOT validate rejection on old DDEV: the system\n  binary had meanwhile become 1.25.5. Full OLI rejection/retry and browser\n  acceptance remain unverified. Remaining tests used command doubles only.\n\n## Test incident\n\nThe real fixture start used the host's DDEV global state. DDEV detected an upgrade\nfrom 1.25.0 to 1.25.5 and its noninteractive upgrade prompt defaulted to a global\npoweroff. This stopped/removed containers belonging to other projects, including\nRathboneAICanvasPoC, drupalrusttest2 and workbench-gitlab-test. The agent interrupted\nits identified process (exit 130) and informed the user immediately. It did not\nrestart unrelated projects. This was an unintended test side effect.\n\nRead-only checks afterwards found no running fixture container and confirmed\nRathboneAICanvasPoC-mariadb and drupalrusttest2-mariadb volumes still present.\nNo database deletion was invoked or reported. These checks do not assert every\nproject's application health. Further prerequisite tests avoid the host Docker\nand DDEV global state entirely. Do not rerun this test using a host-global\n`ddev start`; use command doubles or a fully isolated test environment.\n", "docs/receipts/2026-11-12-fiber-generator-blocker.md": "# Next blocker: Fiber suspension inside Generator\n\n## Verified state\n\n31 ordered patches reconstruct successfully. Development Docker build exits 0.\nThe combined differential runner passes all 29 probes, including\n`spl-fileinfo-ctime`. The timestamp fixture covers file/directory/iterator values\nand a missing-path RuntimeException, with empty stderr and byte-identical Zend\noutput. Review found that `@filectime` still invokes a user error handler; the\nfinal patch uses a silent internal metadata lookup instead. The extended fixture\ninstalls a throwing error handler and still receives RuntimeException. Re-review\nfound no additional blocker. The corrected build and all 29 probes exit 0\n(`results/combined-runtime-ctime-handler.log` in the disposable workspace).\nThe 31-patch reconstruction also matches all three timestamp source files. This closes the missing-method failure on Drupal's update-check path.\n\nThe new candidate remains `drupalphprust:dev-release`, served by the disposable\ncomparison container for DDEV project `drupal-oob`. Browser `/node/add/page`\nreturns HTTP 500 with `VM: cannot suspend a Fiber from within a Generator\n(unsupported nesting)` from Renderer::executeInRenderContext, line 639.\n\n## Minimal reproduction\n\n```bash\nphp tests/probes/fiber-generator-suspend.php\ndocker run --rm -i drupalphprust:dev-release phpr /dev/stdin \u003c tests/probes/fiber-generator-suspend.php\n```\n\nLocal Zend PHP 8.4.8: exit 0, generator and fiber both complete and receive the\nresume value. PHP Rust: exit 255, internal panic in vm/exceptions.rs:241 after\nprinting `suspended:generator:start`. This is a known-failing fixture and is\nintentionally not in the passing combined runner. PHPT records expected Zend\nbehavior, not an assertion that the runtime passes it.\n\n## Root cause and next implementation work\n\n`vm/coroutines.rs::native_fiber_static` parks frames starting at the fiber baseline.\n`resume_generator` runs its own nested run_loop with a generator baseline. On\nRunExit::Suspended it marks the generator Done and returns an ordinary error.\nIts caller then attempts exception unwinding against frames already parked in\nFiberState, explaining the empty-stack panic in the minimal reproducer.\n\nDo not remove the rejection or treat a suspend as a yield/return. Preserve both\ncontinuations and propagate suspension without ordinary exception unwinding.\nOn Fiber::resume, deliver the resume value, finish/resuspend the generator, and\ncontinue its consumer exactly once. Generator consumers include foreach,\nyield-from, direct Generator methods and synchronous helpers; inspect each\nresume_generator/ensure_started call before changing the protocol.\n\nAcceptance fixtures must include nested yield-from, repeated suspend/resume,\nGenerator::send, early close, exceptions/finally, nested Fibers and side-effect\ncounts (no replay of consumed operations). A clean unsupported error is better\nthan a panic, but does not satisfy Drupal acceptance. Do not bypass suspension\nor edit Drupal core to hide this gap.\n\nAfter a reviewed fix: rebuild, run focused and combined regressions, then verify\nhomepage/login/dashboard/create/edit/view on the selected disposable site.\nInstaller/DDEV sidecar smoke and performance benchmarks remain separate and\nunexecuted. Raw browser snapshots and generated credentials stay outside Git.\n", "docs/receipts/2026-11-12-named-runtime-urls.md": "# Named runtime routes \u2014 2026-11-12\n\nRuntime setup now derives the host/scheme from DDEV's `describe -j` primary URL.\nIt adds `php.\u003chost>` to the web service while retaining DDEV aliases, and routes\n`rust.\u003chost>` exclusively to phpr on container port 8090. The existing loopback\nport remains for Coder/private tunnels. The installer prints both named URLs;\n`.ddev/.runtime-urls` is an ignored local receipt.\n\n## Checks performed\n\n- Eight installer/helper tests pass, including distinct service hostnames, labelled\n  URL output, loopback-port persistence and protection of unowned compose files.\n- Five tracker checks, repository contracts and snapshot freshness pass.\n- A disposable PHP-only DDEV fixture used separate response markers to attempt a\n  routing smoke test. It used standard PHP as a stand-in for the Rust-side service;\n  no Drupal/runtime compatibility claim was intended.\n- DDEV's actual `utility compose-config` succeeds and resolves web to\n  `phprust-route-check.ddev.site,php.phprust-route-check.ddev.site` and phpr to\n  `rust.phprust-route-check.ddev.site`, with 80/443 mapped to 8090 for phpr.\n- Starting the fixture stopped at hostname resolution: DDEV requested administrator\n  authentication to add the base test hostname. No password or hosts change was\n  performed. The disposable fixture was stopped/unlisted afterwards.\n\n## Still unverified\n\nLive HTTP/TLS routing, browser access and Drupal trusted-host acceptance on an\ninstalled site. The existing user's site was not changed. Coder app URLs still\nneed its routing integration; these DDEV hostnames are not public Coder URLs.\n\nAfter publishing and updating an installed checkout, rerun\n`bash scripts/enable-runtime.sh dev-release` from that installed project to apply\nroutes using its already-built image. DDEV may request normal hostname setup\ninteractively. Then open both labelled URLs and verify the runtime behind each.\n", "docs/receipts/2026-11-12-native-ddev-addon.md": "# Dedicated tracker and native DDEV lifecycle\n\nDate: 2026-11-12. Implementation prepared against project commit 09f4cd8.\nNo runtime patches, database changes, live-site upgrades or upstream submissions.\n\n## Implemented locally\n\n- Bundled `php-rust` DDEV add-on installs service configuration, host commands\n  and native `pre-delete` cleanup. Minimum DDEV version: 1.25.5.\n- DDEV/Compose builds the pinned PHP Rust candidate as\n  `debian:bookworm-slim-${DDEV_SITENAME}-phpr-built`. No shared custom image tag.\n- Static tracker service uses `tracker.\u003cactual-project-host>`, separately from\n  `php.` and `rust.`. Only `.ddev/.tracker` is mounted into this service.\n- Exact scheme/host/port comes from DDEV. OLI's existing `.ddev/.env` LAUNCH_PATH\n  override selects the tracker; runtime and hostname setup precede completion.\n- Deleted the bespoke delete wrapper and unsubmitted OLI cleanup patch.\n  Markdown task navigation, runtime compatibility labels and Coder option remain.\n\n## Executed checks\n\nAn isolated `/tmp/phprust-native-addon-fixture` used DDEV v1.25.5 downloaded to\n`/tmp/phprust-ddev-tools/ddev`. System DDEV remains v1.25.0. No existing site's\nservices were restarted or databases touched.\n\n- `ddev add-on get ./ddev-addon`: installed all four managed files; actual\n  pre/post-install working directories confirmed.\n- `ddev utility compose-config`: valid configuration. web has base/php hosts;\n  phpr has rust host; tracker has tracker host. Rust loopback port allocated.\n- `PATH=/tmp/phprust-ddev-tools:$PATH python3 scripts/configure-runtime.py`:\n  generated `https://tracker.phprust-native-addon-fixture.ddev.site/` and set\n  OLI's LAUNCH_PATH through `ddev dotenv set`.\n- Native `ddev delete --clean-containers=false -Oy` from fixture root:\n  invalid ownership receipt stopped deletion (exit 1); corrected empty owned\n  receipt ran cleanup and deletion (exit 0).\n- A zero-filesystem scratch test image with the fixture's Compose ownership label\n  and project image tag was built. Native deletion removed it; subsequent\n  `docker image inspect` confirmed absence. This verifies image lifecycle,\n  not the PHP Rust build. No global prune or other project's deletion was run.\n- `ddev add-on remove php-rust`: ran removal cleanup and removed managed files.\n- Three routing/configuration tests, five hostname tests, eight launcher tests,\n  seven tracker tests and four cleanup tests passed. Cleanup tests use two\n  loopback previews and prove only the selected checkout is stopped.\n- `python3 scripts/check-repo.py`: 31 patch hashes/order and shell/config contracts\n  pass. The existing DDEV 1.25.0 is rejected by the new version guard.\n\nThe named fixture deletion before registration did not exercise its hook;\nthe successful and failed hook checks above used current-directory deletion,\nwhich is the path used by AIBP.\n\n## Remaining acceptance and upstream prerequisite\n\nSubsequent scope: the user requested manual upgrade instructions rather than an\nautomatic upgrade offer. The [early prerequisite check](2026-11-12-ddev-prerequisite.md)\nnow provides those instructions with a native DDEV constraint, without an OLI\nchange. The analysis below describes the earlier automatic-upgrade proposal.\n\nFull new PHP Rust build, fresh OLI installation, actual browser launch, HTTPS\nservice identities, restart persistence and Coder access remain unverified for\nthis revision. A `ddev launch --print-url` attempt on the stopped fixture tried\nstarting it through the older system DDEV and was rejected for unsupported\npre-delete configuration; it did not verify browser launch. No live installation\nis claimed upgraded. Old installation receipts remain historical evidence only.\n\nOLI's `_ensure_ddev_cli` currently accepts any existing `ddev` executable. The\ninspected source is One Line Installer base 5c2c6467f52a891a18a3059af305d6f2ba2020b7.\nIt has no minimum-version configuration. Existing older-DDEV users therefore\nstill need a manual upgrade with the public installer. This is an OPEN installer\nintegration dependency, not a finished one-line experience.\n\nThe smallest upstream improvement is a configured minimum DDEV version enforced\nin `_ensure_ddev_cli`, before project creation, with an upgrade offer using the\nsupported DDEV installer and a version recheck. Declining or a failed upgrade\nmust stop before scaffolding. Ordinary config hooks are best-effort and cannot\nprovide this prerequisite guarantee. That improvement is identified, not yet\nimplemented or submitted. Cleanup itself needs no OLI patch. A tagged OLI release\nwould be required before the public one-line command gains prerequisite handling.\n\nDDEV references: [1.25.5 release](https://ddev.com/blog/release-v1-25-5/),\n[add-ons](https://docs.ddev.com/en/stable/users/extend/creating-add-ons/),\n[hooks](https://docs.ddev.com/en/stable/users/configuration/hooks/).\n", "docs/receipts/2026-11-12-owned-cleanup.md": "# Scoped project cleanup \u2014 12 November 2026\n\nHistorical approach: superseded by [native DDEV add-on cleanup](2026-11-12-native-ddev-addon.md). The custom delete wrapper and unsubmitted OLI patch were removed.\n\n## Cause and owning components\n\nThe public One Line Installer delete implementation was inspected from the\n[project](https://www.drupal.org/project/one_line_installer) and source checkout\nat `5c2c6467f52a891a18a3059af305d6f2ba2020b7`. Both deletion paths call\n`ddev delete -Oy` then remove the folder; neither invokes project cleanup.\n[DDEV delete hooks](https://docs.ddev.com/en/stable/users/configuration/hooks/)\nwere introduced in 1.25.5, later than the installed 1.25.0. Adding those hook names\nto this older project is not a portable fix.\n\n## Changes\n\nProject registration keeps an ignored ownership receipt containing the checkout\nroot and aliases it attempts to create. Already resolving names are not adopted.\nCleanup uses only that receipt; it rejects another root, invokes DDEV removal for\neach owned alias and keeps failed entries for retry. It never prunes Docker or\nremoves the reusable runtime image. Coder target routing remains separate.\n\nLive previews stop when their own root disappears or their root receives a stop\nsignal. No PID or port ownership is guessed. AIBP can delete the static tracker\nwith the folder; there is no separate static tracker service.\n\nThe local OLI patch adds a conventional optional `.drupalaibp/before-delete.sh`\nscript, executed only after confirmation in the selected project. Cleanup failure\nand DDEV failure abort before folder removal. Both deletion paths are covered.\nThe generated script was rebuilt using `bin/generate` with Bashly 1.4.0; generation\ncompleteness checks passed. The patch includes source, generated script, tests\nand contributor/user documentation. Nothing is submitted or published upstream.\n\nUntil that change ships, the project's `scripts/delete-project.sh` confirms and\nperforms scoped cleanup followed by DDEV deletion, leaving folder removal to the\nuser. An alternative is cleanup followed by the existing AIBP delete command.\n\n## Verification\n\n- Five project cleanup tests pass: only owned aliases removed, foreign root\n  rejected, failure retains retry state, and two real isolated loopback tracker\n  processes stop independently on root signal/deletion. The fallback delete\n  wrapper also covers declined confirmation, cleanup failure and DDEV failure.\n- Five hostname, seven tracker and eight installer tests pass.\n- OLI deletion coverage includes 13 tests. The full 1,197-test suite completed\n  with an unchanged agent_handoff assertion failure. Isolated handoff tests\n  subsequently passed on both baseline and modified checkouts. The full-suite\n  gate is not reported as green; no unrelated handoff fix was attempted.\n- OLI ShellCheck 0.11.0: clean; CSpell 9.2.2: clean.\n- Project integrity, generated tracker freshness and diff checks pass.\n- Original orphan PID 54472 was confirmed using `ps` command and `lsof` cwd as\n  `/Users/jamesabrahams/code/ai/phprust/phprusttest1`; its own execution session was\n  stopped. Follow-up `lsof` on 8766 and `ps` on that PID returned no process.\n  No other project's process or shared image was removed.\n\nLimits: no real project/database deletion was performed for testing. Password\nhandling and actual hosts edits remain user-run. Older installs without ownership\nreceipts deliberately retain manual/pre-existing aliases for individual inspection.\nPublic AIBP remains unchanged until its maintainers publish a release containing\nthe prepared patch. See [cleanup instructions](../CLEANUP.md).\n", "docs/receipts/2026-11-12-phprusttest1-xmlwriter.md": "# phprusttest1 XMLWriter reproduction \u2014 2026-11-12\n\n## Environment and scope\n\nExplicitly selected installation: `phprusttest1`, this checkout. No database reset,\nmodule removal, Drupal core change, authentication or push was performed.\nSource HEAD: `baf794e`, branch `main`; installer-generated guidance changes were\nalready uncommitted and were preserved separately.\n\n- DDEV 1.25.5; web, db, phpr and tracker reported OK after Docker socket access.\n- Oracle: DDEV PHP 8.4.27, libxml 2.9.14.\n- Candidate: `debian:bookworm-slim-phprusttest1-phpr-built`, image\n  `sha256:8e0c9c68900e53ad361355c03a0ec457b0367d63302cd70891f5c6f196e555c1`.\n- Composer lock SHA256:\n  `80530d439d9a78720834b53bbc67f6b4fc4d6a6ba2911ad28142f58e936ade58`.\n- Runtime source reconstructed from `72f688c3183b79858c01d250ce3999d86e143544`\n  plus all 31 manifest patches; no runtime edits.\n\n## Commands and results\n\n`python3 scripts/prepare-runtime.py` passed integrity checks and applied the entire\nseries after retrying with network access. The initial sandbox denied network and\nDocker socket access; the resulting initial DDEV stopped labels were not real service\nstate. `ddev describe` with socket access confirmed running services.\n\n`curl -ksS --max-time 30 URL -o OUTPUT -w '%{http_code}\\n'` returned:\n\n| URL | Status | Observation |\n| --- | --- | --- |\n| `https://rust.phprusttest1.ddev.site/` | 500 | Class XMLWriter not found, Symfony ContainerBuilder.php:416 |\n| `https://php.phprusttest1.ddev.site/` | 200 | HTTP availability only |\n| `https://tracker.phprusttest1.ddev.site/` | 200 | HTTP availability only |\n\nTLS certificate validation was skipped for these diagnostic requests; they do not\ncertify TLS or browser acceptance. Raw responses remain outside Git.\n\n`ddev exec php /dev/stdin \u003c tests/probes/xmlwriter-sitemap.php` exited 0 with empty\nstderr. Its output is captured as EXPECT in `tests/phpt/xmlwriter-sitemap.phpt`.\n`ddev exec -s phpr env PHPR_LOG=warn phpr /dev/stdin \u003c tests/probes/xmlwriter-sitemap.php`\nexited 255 with missing XMLWriter at the subclass declaration. This is an expected\nfailing regression fixture, not a passing runtime test; it is not yet added to the\npassing combined runtime suite.\n\n`ddev exec php -r 'echo PHP_VERSION, \"\\n\", LIBXML_DOTTED_VERSION, \"\\n\";'`\nrecorded oracle versions. `phpr --version` is unsupported by this candidate\n(exit 1, tries to open an input file); image identity is recorded above instead.\n\n## Diagnosis and next action\n\nSimple Sitemap's `SitemapWriter` inherits XMLWriter and has its own constructor.\nThe required surface includes openMemory, setIndent, startDocument, writePI,\nwriteComment, startElement, writeAttribute, writeElement, endElement, endDocument\nand outputMemory. The fixture exercises this independently of Drupal. Error-state\nand argument-validation fixtures still need adding before implementation is complete.\n\nRead upstream AGENTS.md, REGOLE.md, NEXT_SESSION_WORDPRESS.md, migration/RULEBOOK.md,\nthe latest available session (185) and its adversarial review. Serena is required\nfor Rust editing there but is unavailable in this session; the user has been asked\nwhether available code tools may be used. No substitute
