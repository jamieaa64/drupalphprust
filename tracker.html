'use strict';
let data=JSON.parse(document.getElementById('snapshot').textContent);
let current=decodeURIComponent(location.hash.slice(1))||(data.steps.find(s=>s.status==='active')||data.steps[0]).path;
let signature=JSON.stringify(data);
const live=data.live===true;
function resolve(base,path){return new URL(path,new URL(base,'https://tracker.invalid/')).pathname.slice(1);}
function inline(parent,text,path){
 const pattern=/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g;let start=0;
 for(const match of text.matchAll(pattern)){
  parent.append(document.createTextNode(text.slice(start,match.index)));const token=match[0];let el;
  if(token.startsWith('`')){el=document.createElement('code');el.textContent=token.slice(1,-1);}
  else if(token.startsWith('**')){el=document.createElement('strong');el.textContent=token.slice(2,-2);}
  else{const parts=token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);const destination=parts[2];el=document.createElement('span');el.textContent=parts[1];
   if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(destination)&&!destination.startsWith('//')){
    const key=resolve(path,destination);if(data.pages[key]){el=document.createElement('a');el.textContent=parts[1];el.href='#'+encodeURIComponent(key);}
   }else if(/^https?:\/\//.test(destination)){el=document.createElement('a');el.textContent=parts[1];el.href=destination;el.target='_blank';el.rel='noopener noreferrer';}
  }
  parent.append(el);start=match.index+token.length;
 }
 parent.append(document.createTextNode(text.slice(start)));
}
function markdown(container,text,path){
 container.replaceChildren();let paragraph=[],list=null,code=null;
 function flush(){if(paragraph.length){const p=document.createElement('p');inline(p,paragraph.join(' '),path);container.append(p);paragraph=[];}list=null;}
 for(const line of text.split('\n')){
  if(line.startsWith('```')){flush();if(code){container.append(code);code=null;}else code=document.createElement('pre');continue;}
  if(code){code.textContent+=line+'\n';continue;}
  if(!line.trim()){flush();continue;}
  if(/^Patches: /.test(line))continue;
  if(/^(Status|Destination): /.test(line)){flush();const p=document.createElement('p');p.className='muted';p.textContent=line;container.append(p);continue;}
  const heading=line.match(/^(#{1,3}) (.*)/);if(heading){flush();const h=document.createElement('h'+heading[1].length);inline(h,heading[2],path);container.append(h);continue;}
  const item=line.match(/^(?:- |\d+\. )(.*)/);if(item){if(paragraph.length)flush();if(!list){list=document.createElement('ul');container.append(list);}const li=document.createElement('li');inline(li,item[1],path);list.append(li);continue;}
  paragraph.push(line);
 }
 flush();if(code)container.append(code);
}
function draw(){
 markdown(document.getElementById('known-gaps'),data.pages['docs/TRY-IT.md']||'','docs/TRY-IT.md');
 const runtimes=document.getElementById('runtimes');runtimes.replaceChildren();
 for(const [key,service,label] of [['php','web','Drupal on standard PHP'],['rust','phpr','Drupal on PHP Rust']]){
  const card=document.createElement('div');card.className='runtime-card';
  const url=data.installation?.urls?.[key];
  const link=document.createElement(url?'a':'strong');link.textContent=label;
  if(url){link.href=url;link.target='_blank';link.rel='noopener noreferrer';}card.append(link);
  const status=document.createElement('p');status.textContent='Service: '+(data.installation?.services?.[service]||'not checked');card.append(status);
  const network=document.createElement('p');const networkState=data.installation?.network||'not-checked';network.textContent='Hostname setup: '+({'ready':'ready on this host','failed':'failed; run python3 scripts/register-runtime-hostnames.py in your terminal','pending':'incomplete; retry hostname setup','private-routing-required':'Coder private route or tunnel required','not-checked':'not checked'}[networkState]||'not checked');card.append(network);
  const compatibility=document.createElement('p');compatibility.textContent=key==='rust'?'Runtime compatibility: experimental; full Drupal journey not verified.':'Runtime compatibility: standard PHP control; full journey not verified here.';card.append(compatibility);
  const checked=document.createElement('p');checked.className='muted';checked.textContent=url?'Service check: '+data.installation.checked:'Site links appear after installation.';card.append(checked);runtimes.append(card);
 }

 const serenaUrl=data.installation?.urls?.serena;
 if(serenaUrl){
  const card=document.createElement('div');card.className='runtime-card';
  const link=document.createElement('a');link.textContent='Serena dashboard';link.href=serenaUrl+'dashboard/index.html';link.target='_blank';link.rel='noopener noreferrer';card.append(link);
  const description=document.createElement('p');description.textContent='Shared Serena server: Rust tools, configuration and logs. Separate host STDIO sessions have their own activity.';card.append(description);
  runtimes.append(card);
 }

 if(!data.pages[current])current=(data.steps.find(s=>s.status==='active')||data.steps[0]).path;
 document.getElementById('count').textContent=data.steps.filter(s=>s.status==='active').length+' active · '+data.steps.filter(s=>s.status==='patched').length+' patched';
 markdown(document.getElementById('summary'),data.pages['PROGRESS.md'],'PROGRESS.md');
 const nav=document.getElementById('steps');nav.replaceChildren();
 for(const step of data.steps){const button=document.createElement('button');button.setAttribute('aria-current',String(current===step.path));button.onclick=()=>{location.hash=encodeURIComponent(step.path);};
  const dot=document.createElement('span');dot.className='dot '+step.status;dot.setAttribute('aria-hidden','true');
  const title=document.createElement('span');title.className='step-title';title.textContent=step.title;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=step.status;
  button.append(dot,title,tag);nav.append(button);
 }
 markdown(document.getElementById('detail'),data.pages[current]||'Document not found.',current);
}
window.addEventListener('hashchange',()=>{current=decodeURIComponent(location.hash.slice(1));draw();});
for(const button of document.querySelectorAll('[data-doc]'))button.onclick=()=>{location.hash=encodeURIComponent(button.dataset.doc);};
document.getElementById('mode').textContent=live?'Live · checks Markdown every 5 seconds':'Snapshot · regenerate with python3 scripts/tracker.py';
draw();
if(live)setInterval(async()=>{try{const response=await fetch('./snapshot',{cache:'no-store'});if(!response.ok)throw Error();const fresh=await response.json();const next=JSON.stringify(fresh);if(next!==signature){data=fresh;signature=next;draw();}document.getElementById('mode').textContent='Live · checks Markdown every 5 seconds';}catch{document.getElementById('mode').textContent='Preview disconnected · showing last snapshot';}},5000);
</script></body></html>
