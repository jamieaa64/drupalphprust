.\n- Repository checks, snapshot freshness and diff whitespace checks pass.\n\nLimits: the user already registered these two hosts. The new missing-host branch\nis fixture-tested; the real DDEV registration command was exercised earlier by\nthe user, not re-executed against a new hostname by the agent. A fresh OLI install\nand Coder browser routing remain to be tested. This change makes the experiment\naccessible and explains gaps; it does not fix XMLWriter or establish Drupal parity.\n", "docs/receipts/2026-11-12-callable-unpack-reference.md": "# Theme-hook references and remaining browser blockers\n\n## Implemented change\n\n`callable-unpack-reference.patch` preserves reference cells when constructing\nand extracting dynamic call arguments. The parameter binder still separates\nby-value parameters. An explicit bytecode flag distinguishes calls from array\nliterals; literals use existing PhpArray copy rules, separating singleton\nreferences while retaining externally shared aliases.\n\nThe minimized `reset($listeners)(...$args)` theme-hook pattern lost mutations on\nthe previous 32-patch runtime. The new fixture covers method closures, array\ncallables, closures, captured references, value isolation, variadics, dynamic\nsort/strlen, array copies, singleton references and namespace fallback.\nThe required adversarial reviewer caught an initial singleton-reference copy\nregression; the corrected distinction passed independent controls and re-review.\nStatically resolved by-reference spread calls still have a pre-existing compiler\nrejection. Full named/iterator unpacking parity and performance are not claimed.\n\n## Verification\n\nSelected site: `phprusttest1`. Rust 1.98.1, dev-release image\n`debian:bookworm-slim-phprusttest1-phpr-built`, ID\n`sha256:a170639244aa024b16bfc3afe40aa2103d2621f9b09d49bc7e95bd45d291a120`.\nBinary hashes:\n\n- phpr: `8c8cba67cb5b39195b1ee7f64accc61f797c5dc35929309566497cfb649afced`\n- php-server: `9372f645334579208906fa8b613685242694994f65103141eb0df09875197797`\n\nExecuted:\n\n```bash\ndocker build --build-arg RUNTIME_PROFILE=dev-release \\\n  -t debian:bookworm-slim-phprusttest1-phpr-built runtime\ndocker compose -f .ddev/.ddev-docker-compose-full.yaml \\\n  up -d --no-deps --force-recreate phpr\nbash tests/test-oob-runtime.sh \"$PWD\" debian:bookworm-slim-phprusttest1-phpr-built phprusttest1\npython3 scripts/prepare-runtime.py --source .work/php-rust --destination .work/font-stall/reconstructed\nddev drush cr\n```\n\nAll 33 combined probes pass against DDEV Zend PHP 8.4.27 with exact stdout and\nempty stderr. The new fixture also matches the pinned PHP 8.5.7 oracle. All nine\nlocal stylesheet/script/font/favicon URLs extracted from the corrected homepage\nreturned 200. All five changed Rust files match fresh reconstruction. Repository\nhash/order checks pass. Canonical corpus and performance promotion are unexecuted.\nThe native release PHPT runner passes the new fixture with `PHPR_REG_LOWER=0`\nand `=1`: one pass, zero failures/skips each. Full release-suite results follow.\n\nAfter cache rebuild, homepage HTML returned 200 in 4.926 seconds with correct\n`/themes/contrib/mercury/fonts/...` preload paths. Before clearing the render cache\nit retained the incorrect paths. This proves the scoped application fix, not\ncomplete browser acceptance.\n\n## Still failing\n\n- Browser showed the hero plus repeated DOMXPath warnings and unresolved title\n  `| [site:name]`. HTTP 200 is therefore a failure.\n- `tests/probes/dom-namespace-axis.php` rejects Masterminds' serializer expression\n  `namespace::*[not(.=../../namespace::*)]`. Zend outputs `html:2` and `body:0`;\n  Rust warns and returns false for both. This establishes a concrete gap, not\n  the cause of every browser warning.\n- `/fonts/Outfit/latin.woff2` still stalls. Temporary instrumentation identifies\n  Renderer::executeInRenderContext's sleep loop during a Canvas 404 subrequest:\n  child Fiber started=true, suspended=false, terminated=false while the caller\n  executes; it is not the current Fiber. All instrumentation was restored and\n  byte-compared with originals.\n- `tests/probes/fiber-nested-render.php` is bounded. Zend finishes both cases;\n  Rust panics during nested Generator/Fiber suspension in exception unwinding.\n  Its exact connection to the browser's running-state loop remains unproven.\n  Both known-failing probes are excluded from the passing combined runner.\n\nOnly the selected Rust service was restarted to recover the listener. No Drupal\ntemplates, exclusions, font aliases or warning suppression were introduced.\nFull browser acceptance still fails. Next: task 01 for Fiber/Generator\ncontinuations, task 08 for namespace XPath, task 06 for token replacement.\n\n## Full release gate\n\n`bash scripts/test-runtime-upstream.sh` completed with exit 101 after an 11m44s\noptimized build: **1757 passed, 2 failed, 2 ignored**. The PHP 8.5.7 oracle was\nrequired; no missing-oracle bypass was used. The two failures match the preceding\nXMLWriter baseline: `vm::census::tests::op_index_maps_sampled_variants_in_range`\n(177 vs 178) and `nessun_sorgente_rs_oltre_cap`. No new failing test name appeared.\nThe source-size guard remains failing: this patch adds seven lines to run.rs\n(7662 to 7669, cap 7551) and two to calls.rs. No guard was disabled or cap raised.\nThis is not a green full gate or an upstream-ready submission.\n", "docs/receipts/2026-11-12-continuations-and-rendering.md": "# Generator continuations and Drupal rendering\n\nHistorical checkpoints for patches 34\u201338. Later browser and test evidence is in\n[the authenticated runtime receipt](2026-11-13-authenticated-runtime.md).\n\nScope: local DDEV `phprusttest1`, unchanged Drupal CMS files and configuration.\nPHP Rust is the target; Zend PHP is the comparison oracle. No fallback-site claim.\n\n## Implemented contribution units\n\n- Task 01: `fiber-generator-continuation.patch` parks explicit pending foreach,\n  Generator-method and yield-from operations with the Fiber frames. Suspension is\n  control flow, not an exception. Resuming at another call depth rebases frame\n  indices. Unsupported synchronous callback/collector boundaries reject suspension\n  before unwinding, preserving PHP finally blocks and a terminated Fiber state.\n- Task 08: `dom-namespace-axis.patch` adds namespace-axis values, inheritance,\n  shadowing, parent traversal, predicate comparisons and PHP namespace-node\n  properties. QName lexing stops at `::`. Namespace declarations are excluded from\n  ordinary attribute collections; SimpleXML filters namespace results.\n- Task 06: `preg-extended-comments.patch` removes extended-mode comments before\n  pattern rewrites. It preserves quoted literals, scoped modes, escaped hash,\n  POSIX classes, initial class brackets/carets and control escapes. This fixes\n  Drupal's token scanner returning no matches for `[site:name]`.\n- Task 06: `multisort-stringable.patch` invokes VM string conversion during\n  string/natural comparisons. Drupal's translated token labels now sort without\n  object-to-string warnings; an exception prevents array writeback.\n\n## Executed evidence\n\nRust 1.98.1, `cargo build --locked --profile dev-release -p php-cli -p php-server`,\n`CARGO_TARGET_DIR=/tmp/serena-target`, one build job in the Serena container.\nSeven focused fixtures match PHP 8.5.7 with clean stderr: fiber-generator-suspend,\nfiber-nested-render, fiber-generator-continuation, dom-namespace-axis,\ndom-namespace-inheritance, preg-extended-comments and multisort-stringable.\nPHPT expectations come from that oracle. The separate helper-boundary PHPT tests\nan explicit runtime limitation, not Zend equivalence.\n\nAn isolated server request to the formerly hanging missing-font route completed\nwith HTTP 404. A cold homepage request after `ddev drush cr` returned HTTP 200,\n`Home | phprusttest1`, expected hero markup and no PHP diagnostics or redundant\nnamespace attributes. The browser subsequently exposed a separate asset-generation\nfailure: `file_put_contents(temporary://...)` bypasses registered stream wrappers.\nThat remaining failure is being addressed; full browser acceptance is not claimed.\nOld session messages from the previous XPath failure were visible on the first\nbrowser request and consumed on reload; they are distinct from the new stream warning.\n\nThe 37-patch candidate was activated by copying the tested development binaries\ninto the existing runtime image and recreating only the `phpr` service. This is a\nlocal activation, not a clean Dockerfile rebuild or installer validation.\n\n- Image: `sha256:9fb603ce77cbad8b73c4935eabff50a88eb598984191f782c8f8cd77b6fd14e7`.\n- phpr: `1eaad549934fdea1df09ca5723fb6ce410be144a6efc8e2172f468acc13daafa`.\n- php-server: `29fc23d53ab445f703a0c5a94c7b07d5a850b4b45bf3d05182a35997ac9470c0`.\n\nThe complete 40-probe `tests/test-oob-runtime.sh` run against this image passed\nwith byte-identical stdout and clean stderr. Public-service missing-route and\nanonymous login requests returned clean HTTP 404 and 200 respectively. The release\nsuite completed with 1,757 passed, two failed and two ignored. The failures remain\n`vm::census::tests::op_index_maps_sampled_variants_in_range` and\n`nessun_sorgente_rs_oltre_cap`; source-size excesses include these new fixes.\nThe suite is not green. Command: `bash scripts/test-runtime-upstream.sh`,\nPHP oracle 8.5.7 in Serena, release profile. All 37 patch hashes/order and\nreconstruction passed; no full upstream corpus or performance gate was run.\n\n## Adversarial review and limits\n\nOne reviewer checked suspension cleanup, nested Fibers, pending-value release,\nnamespace behavior and regex lexical boundaries. Reported regressions were fixed\nand added as fixtures. Pending-send destruction no longer waits until shutdown;\nits remaining catch/destructor ordering difference also exists in the old\nnonsuspending runtime and is not claimed fixed. Abandoned-Fiber destruction and\nsuspension through arbitrary native helpers remain incomplete.\n\nThe existing merge sort schedules comparisons differently from Zend. Pure\nStringable labels are supported; observable side effects in `__toString()` can\noccur in a different order. A three-element throwing probe preserves original\narrays on both engines but logs different conversion order. No general sorting,\nXPath, regex, Fiber or CMS parity claim, upstream submission, or speed claim.\n\n## Registered stream writes: final candidate\n\nTask 08 adds `user-wrapper-write.patch` as patch 38. `file_put_contents` now\nopens the registered PHP wrapper with the correct mode/context, writes arrays,\nscalars or resource data, retries partial writes, and flushes/closes according to\nthe oracle. Zero, false, negative and oversized callback results have distinct\nwarnings and cleanup behavior. Conversion/write/flush exceptions skip close as\nZend does. Default stream-context APIs remain absent in the earlier runtime.\n\nThe main fixture and an independent adversarial fixture match PHP 8.5.7 exactly\nwith clean stderr. Both are retained in `tests/probes/user-wrapper-write.php`\nand its PHPT. The reviewer reran scalar/array failure cases independently and\nreported no outstanding scoped blocker. Full wrapper API parity is not claimed.\n\nBuild recipe is unchanged (CLI server, dev-release, Rust 1.98.1, one job).\nAn accidental Axum-feature build was stopped and discarded; a login-shell PATH\nfailure was corrected before the successful normal build. No measurement used\neither attempt. Final candidate:\n\n- Image: `sha256:6110defbee62cef0a6a411e4e29915ed0f3bb582279b003357ed91d00f964d3d`.\n- phpr: `4fba887cbee2ecc999a2f44cc8be984231574fae1d541d4704377e6a60540013`.\n- php-server: `8db93db284b5d80e33be75621e0d26d1de1a85df954851c82ccefaa7bbd65d1d`.\n\n`bash tests/test-oob-runtime.sh /Users/jamesabrahams/code/ai/phprust/phprusttest1\ndebian:bookworm-slim-phprusttest1-phpr-built phprusttest1` passes all 41 probes.\n`python3 scripts/check-repo.py` passes all 38 hashes/order and structure checks.\n`python3 scripts/prepare-runtime.py --source .work/php-rust --destination\n.work/stream-reconstructed` reconstructs the candidate; all 37 changed runtime\nsource files match byte-for-byte. As above, local activation copied tested\nbinaries into the existing base; a clean installer/image build is not claimed.\n\nBrowser verification on the first stream candidate showed the expected Mercury\nhomepage without error messages; styles, generated CSS/JavaScript and both fonts\nreturned HTTP 200. One previously queued stream warning was consumed on the first\nreload. The second reload was clean. The final candidate only amends error paths;\nfinal browser recheck on patch 38 also passed. Its release rerun was killed\nduring PHPT-runner linking under memory pressure; the retry was intentionally\nstopped before source changes for the newly reproduced registry gap. The completed\n37-patch release result above remains the last full result.\nThe user subsequently authorized the disposable demo login; submission succeeded,\nbut the authenticated dashboard exposed generator collection through a synchronous\nhelper. Follow-on registry and collector work is recorded in the current plan.\n", "docs/receipts/2026-11-12-ddev-prerequisite.md": "# Early DDEV prerequisite and manual upgrade guidance\n\nDate: 2026-11-12. User requested a check and commands they run themselves,\nthen retry installation. No automatic package upgrades, trust or authentication.\n\n## Implementation\n\nBoth OLI configurations run the standalone `check-ddev-version.sh` host hook at\n`before_configure_ddev`. OLI stages this early script into `.ddev/drupalaibp-hooks`\nat project-directory creation. The script prints the detected/minimum version\nand Homebrew/apt upgrade commands; Homebrew formula-specific trust is conditional\non the user receiving that error. It writes an owned DDEV overlay containing\n`ddev_version_constraint: '>= v1.25.5'`. Recovery uses the same script in read-only\n`--check-only` mode through `scripts/require-ddev.py`.\n\nOLI's hook runner warns and continues after failure. The DDEV constraint is the\nactual enforced stop at first service start, before Drupal Composer installation\nand the Rust build. OLI's `step_start_ddev` calls `ddev start` under its normal\nstrict pipeline. A small configuration scaffold can remain. Guidance tells users\nto preserve it and rerun from the parent with a new empty destination; it never\ninstructs automatic deletion of an existing site. No upstream OLI change needed\nfor this manual-upgrade workflow. Aborting before directory creation would need\nadditional installer support.\n\nDDEV documents this constraint in its [configuration reference](https://docs.ddev.com/en/stable/users/configuration/config/#ddev_version_constraint).\n\n## Validation and limits\n\n- `python3 tests/test-ddev-prerequisite.py`: five tests passed, covering old,\n  unknown, prerelease and supported versions; no automatic upgrade commands;\n  repeatability, check-only behavior, owned-file protection and both configs.\n- `python3 tests/test-installer-launcher.py`: eight passed.\n- `python3 tests/test-runtime-config.py`: three passed.\n- `python3 scripts/check-repo.py`: patch hashes, config and shell checks passed.\n- Real `ddev config` on an empty temporary fixture accepted the overlay. The\n  attempted real `ddev start` did NOT validate rejection on old DDEV: the system\n  binary had meanwhile become 1.25.5. Full OLI rejection/retry and browser\n  acceptance remain unverified. Remaining tests used command doubles only.\n\n## Test incident\n\nThe real fixture start used the host's DDEV global state. DDEV detected an upgrade\nfrom 1.25.0 to 1.25.5 and its noninteractive upgrade prompt defaulted to a global\npoweroff. This stopped/removed containers belonging to other projects, including\nRathboneAICanvasPoC, drupalrusttest2 and workbench-gitlab-test. The agent interrupted\nits identified process (exit 130) and informed the user immediately. It did not\nrestart unrelated projects. This was an unintended test side effect.\n\nRead-only checks afterwards found no running fixture container and confirmed\nRathboneAICanvasPoC-mariadb and drupalrusttest2-mariadb volumes still present.\nNo database deletion was invoked or reported. These checks do not assert every\nproject's application health. Further prerequisite tests avoid the host Docker\nand DDEV global state entirely. Do not rerun this test using a host-global\n`ddev start`; use command doubles or a fully isolated test environment.\n", "docs/receipts/2026-11-12-fiber-generator-blocker.md": "# Next blocker: Fiber suspension inside Generator\n\n## Verified state\n\n31 ordered patches reconstruct successfully. Development Docker build exits 0.\nThe combined differential runner passes all 29 probes, including\n`spl-fileinfo-ctime`. The timestamp fixture covers file/directory/iterator values\nand a missing-path RuntimeException, with empty stderr and byte-identical Zend\noutput. Review found that `@filectime` still invokes a user error handler; the\nfinal patch uses a silent internal metadata lookup instead. The extended fixture\ninstalls a throwing error handler and still receives RuntimeException. Re-review\nfound no additional blocker. The corrected build and all 29 probes exit 0\n(`results/combined-runtime-ctime-handler.log` in the disposable workspace).\nThe 31-patch reconstruction also matches all three timestamp source files. This closes the missing-method failure on Drupal's update-check path.\n\nThe new candidate remains `drupalphprust:dev-release`, served by the disposable\ncomparison container for DDEV project `drupal-oob`. Browser `/node/add/page`\nreturns HTTP 500 with `VM: cannot suspend a Fiber from within a Generator\n(unsupported nesting)` from Renderer::executeInRenderContext, line 639.\n\n## Minimal reproduction\n\n```bash\nphp tests/probes/fiber-generator-suspend.php\ndocker run --rm -i drupalphprust:dev-release phpr /dev/stdin \u003c tests/probes/fiber-generator-suspend.php\n```\n\nLocal Zend PHP 8.4.8: exit 0, generator and fiber both complete and receive the\nresume value. PHP Rust: exit 255, internal panic in vm/exceptions.rs:241 after\nprinting `suspended:generator:start`. This is a known-failing fixture and is\nintentionally not in the passing combined runner. PHPT records expected Zend\nbehavior, not an assertion that the runtime passes it.\n\n## Root cause and next implementation work\n\n`vm/coroutines.rs::native_fiber_static` parks frames starting at the fiber baseline.\n`resume_generator` runs its own nested run_loop with a generator baseline. On\nRunExit::Suspended it marks the generator Done and returns an ordinary error.\nIts caller then attempts exception unwinding against frames already parked in\nFiberState, explaining the empty-stack panic in the minimal reproducer.\n\nDo not remove the rejection or treat a suspend as a yield/return. Preserve both\ncontinuations and propagate suspension without ordinary exception unwinding.\nOn Fiber::resume, deliver the resume value, finish/resuspend the generator, and\ncontinue its consumer exactly once. Generator consumers include foreach,\nyield-from, direct Generator methods and synchronous helpers; inspect each\nresume_generator/ensure_started call before changing the protocol.\n\nAcceptance fixtures must include nested yield-from, repeated suspend/resume,\nGenerator::send, early close, exceptions/finally, nested Fibers and side-effect\ncounts (no replay of consumed operations). A clean unsupported error is better\nthan a panic, but does not satisfy Drupal acceptance. Do not bypass suspension\nor edit Drupal core to hide this gap.\n\nAfter a reviewed fix: rebuild, run focused and combined regressions, then verify\nhomepage/login/dashboard/create/edit/view on the selected disposable site.\nInstaller/DDEV sidecar smoke and performance benchmarks remain separate and\nunexecuted. Raw browser snapshots and generated credentials stay outside Git.\n", "docs/receipts/2026-11-12-homepage-font-stall.md": "# Homepage font request stalls PHP Rust\n\nSelected site: `phprusttest1`, existing XMLWriter candidate, serving image\n`debian:bookworm-slim-phprusttest1-phpr-built`. No runtime source or Drupal\nconfiguration changes were made during this diagnosis.\n\nThe prior homepage hero observation does not establish complete browser loading.\nOn 12 November, the Rust route timed out after eight seconds with no bytes even\nwith `curl --resolve rust.phprusttest1.ddev.site:443:127.0.0.1`. Zend returned 200.\nThe Rust process was sleeping in `hrtimer_nanosleep`, with an open idle database\nconnection and no semaphore rows. This does not establish a partial-HTTP-request\ncause; task 15 remains independent.\n\nAfter `docker restart ddev-phprusttest1-phpr` and listener readiness, the homepage\nreturned 200 in 1.216 seconds. Its font preload URLs were `/fonts/Outfit/latin.woff2`\nand `/fonts/Inter/InterVariable.woff2`. The same Zend homepage includes the correct\n`/themes/contrib/mercury` prefix. The Twig preload template uses `mercury_path`.\nThe exact runtime cause of the missing prefix remains unconfirmed.\n\nSequential curl checks returned 200 for the favicon, aggregated CSS, fonts.css,\nmain.min.css and theme.css. The next request reproduced the stall:\n\n```bash\ncurl --max-time 4 -o /dev/null -w '%{http_code}\\n' \\\n  https://rust.phprusttest1.ddev.site/fonts/Outfit/latin.woff2\n```\n\nResult: timeout, zero bytes, HTTP 000; server log ends at `Accepted`. Standard PHP\nreturned 404 for the identical missing path in 0.552 seconds. The Rust service was\nrestarted again to clear the stalled request. Restart is recovery, not a fix:\na browser can trigger the bad font request again.\n\nNext: minimise the missing Twig variable/prefix difference (task 06), and locate\nthe sleep loop in the missing-path request (runtime completion task 01). Test\nboth valid and missing assets, then recheck full browser loading. Do not alter\nDrupal templates or add font aliases to conceal the runtime differences.\n\nFollow-up: [font-prefix fix and remaining blockers](2026-11-12-callable-unpack-reference.md).\n", "docs/receipts/2026-11-12-named-runtime-urls.md": "# Named runtime routes \u2014 2026-11-12\n\nRuntime setup now derives the host/scheme from DDEV's `describe -j` primary URL.\nIt adds `php.\u003chost>` to the web service while retaining DDEV aliases, and routes\n`rust.\u003chost>` exclusively to phpr on container port 8090. The existing loopback\nport remains for Coder/private tunnels. The installer prints both named URLs;\n`.ddev/.runtime-urls` is an ignored local receipt.\n\n## Checks performed\n\n- Eight installer/helper tests pass, including distinct service hostnames, labelled\n  URL output, loopback-port persistence and protection of unowned compose files.\n- Five tracker checks, repository contracts and snapshot freshness pass.\n- A disposable PHP-only DDEV fixture used separate response markers to attempt a\n  routing smoke test. It used standard PHP as a stand-in for the Rust-side service;\n  no Drupal/runtime compatibility claim was intended.\n- DDEV's actual `utility compose-config` succeeds and resolves web to\n  `phprust-route-check.ddev.site,php.phprust-route-check.ddev.site` and phpr to\n  `rust.phprust-route-check.ddev.site`, with 80/443 mapped to 8090 for phpr.\n- Starting the fixture stopped at hostname resolution: DDEV requested administrator\n  authentication to add the base test hostname. No password or hosts change was\n  performed. The disposable fixture was stopped/unlisted afterwards.\n\n## Still unverified\n\nLive HTTP/TLS routing, browser access and Drupal trusted-host acceptance on an\ninstalled site. The existing user's site was not changed. Coder app URLs still\nneed its routing integration; these DDEV hostnames are not public Coder URLs.\n\nAfter publishing and updating an installed checkout, rerun\n`bash scripts/enable-runtime.sh dev-release` from that installed project to apply\nroutes using its already-built image. DDEV may request normal hostname setup\ninteractively. Then open both labelled URLs and verify the runtime behind each.\n", "docs/receipts/2026-11-12-native-ddev-addon.md": "# Dedicated tracker and native DDEV lifecycle\n\nDate: 2026-11-12. Implementation prepared against project commit 09f4cd8.\nNo runtime patches, database changes, live-site upgrades or upstream submissions.\n\n## Implemented locally\n\n- Bundled `php-rust` DDEV add-on installs service configuration, host commands\n  and native `pre-delete` cleanup. Minimum DDEV version: 1.25.5.\n- DDEV/Compose builds the pinned PHP Rust candidate as\n  `debian:bookworm-slim-${DDEV_SITENAME}-phpr-built`. No shared custom image tag.\n- Static tracker service uses `tracker.\u003cactual-project-host>`, separately from\n  `php.` and `rust.`. Only `.ddev/.tracker` is mounted into this service.\n- Exact scheme/host/port comes from DDEV. OLI's existing `.ddev/.env` LAUNCH_PATH\n  override selects the tracker; runtime and hostname setup precede completion.\n- Deleted the bespoke delete wrapper and unsubmitted OLI cleanup patch.\n  Markdown task navigation, runtime compatibility labels and Coder option remain.\n\n## Executed checks\n\nAn isolated `/tmp/phprust-native-addon-fixture` used DDEV v1.25.5 downloaded to\n`/tmp/phprust-ddev-tools/ddev`. System DDEV remains v1.25.0. No existing site's\nservices were restarted or databases touched.\n\n- `ddev add-on get ./ddev-addon`: installed all four managed files; actual\n  pre/post-install working directories confirmed.\n- `ddev utility compose-config`: valid configuration. web has base/php hosts;\n  phpr has rust host; tracker has tracker host. Rust loopback port allocated.\n- `PATH=/tmp/phprust-ddev-tools:$PATH python3 scripts/configure-runtime.py`:\n  generated `https://tracker.phprust-native-addon-fixture.ddev.site/` and set\n  OLI's LAUNCH_PATH through `ddev dotenv set`.\n- Native `ddev delete --clean-containers=false -Oy` from fixture root:\n  invalid ownership receipt stopped deletion (exit 1); corrected empty owned\n  receipt ran cleanup and deletion (exit 0).\n- A zero-filesystem scratch test image with the fixture's Compose ownership label\n  and project image tag was built. Native deletion removed it; subsequent\n  `docker image inspect` confirmed absence. This verifies image lifecycle,\n  not the PHP Rust build. No global prune or other project's deletion was run.\n- `ddev add-on remove php-rust`: ran removal cleanup and removed managed files.\n- Three routing/configuration tests, five hostname tests, eight launcher tests,\n  seven tracker tests and four cleanup tests passed. Cleanup tests use two\n  loopback previews and prove only the selected checkout is stopped.\n- `python3 scripts/check-repo.py`: 31 patch hashes/order and shell/config contracts\n  pass. The existing DDEV 1.25.0 is rejected by the new version guard.\n\nThe named fixture deletion before registration did not exercise its hook;\nthe successful and failed hook checks above used current-directory deletion,\nwhich is the path used by AIBP.\n\n## Remaining acceptance and upstream prerequisite\n\nSubsequent scope: the user requested manual upgrade instructions rather than an\nautomatic upgrade offer. The [early prerequisite check](2026-11-12-ddev-prerequisite.md)\nnow provides those instructions with a native DDEV constraint, without an OLI\nchange. The analysis below describes the earlier automatic-upgrade proposal.\n\nFull new PHP Rust build, fresh OLI installation, actual browser launch, HTTPS\nservice identities, restart persistence and Coder access remain unverified for\nthis revision. A `ddev launch --print-url` attempt on the stopped fixture tried\nstarting it through the older system DDEV and was rejected for unsupported\npre-delete configuration; it did not verify browser launch. No live installation\nis claimed upgraded. Old installation receipts remain historical evidence only.\n\nOLI's `_ensure_ddev_cli` currently accepts any existing `ddev` executable. The\ninspected source is One Line Installer base 5c2c6467f52a891a18a3059af305d6f2ba2020b7.\nIt has no minimum-version configuration. Existing older-DDEV users therefore\nstill need a manual upgrade with the public installer. This is an OPEN installer\nintegration dependency, not a finished one-line experience.\n\nThe smallest upstream improvement is a configured minimum DDEV version enforced\nin `_ensure_ddev_cli`, before project creation, with an upgrade offer using the\nsupported DDEV installer and a version recheck. Declining or a failed upgrade\nmust stop before scaffolding. Ordinary config hooks are best-effort and cannot\nprovide this prerequisite guarantee. That improvement is identified, not yet\nimplemented or submitted. Cleanup itself needs no OLI patch. A tagged OLI release\nwould be required before the public one-line command gains prerequisite handling.\n\nDDEV references: [1.25.5 release](https://ddev.com/blog/release-v1-25-5/),\n[add-ons](https://docs.ddev.com/en/stable/users/extend/creating-add-ons/),\n[hooks](https://docs.ddev.com/en/stable/users/configuration/hooks/).\n", "docs/receipts/2026-11-12-owned-cleanup.md": "# Scoped project cleanup \u2014 12 November 2026\n\nHistorical approach: superseded by [native DDEV add-on cleanup](2026-11-12-native-ddev-addon.md). The custom delete wrapper and unsubmitted OLI patch were removed.\n\n## Cause and owning components\n\nThe public One Line Installer delete implementation was inspected from the\n[project](https://www.drupal.org/project/one_line_installer) and source checkout\nat `5c2c6467f52a891a18a3059af305d6f2ba2020b7`. Both deletion paths call\n`ddev delete -Oy` then remove the folder; neither invokes project cleanup.\n[DDEV delete hooks](https://docs.ddev.com/en/stable/users/configuration/hooks/)\nwere introduced in 1.25.5, later than the installed 1.25.0. Adding those hook names\nto this older project is not a portable fix.\n\n## Changes\n\nProject registration keeps an ignored ownership receipt containing the checkout\nroot and aliases it attempts to create. Already resolving names are not adopted.\nCleanup uses only that receipt; it rejects another root, invokes DDEV removal for\neach owned alias and keeps failed entries for retry. It never prunes Docker or\nremoves the reusable runtime image. Coder target routing remains separate.\n\nLive previews stop when their own root disappears or their root receives a stop\nsignal. No PID or port ownership is guessed. AIBP can delete the static tracker\nwith the folder; there is no separate static tracker service.\n\nThe local OLI patch adds a conventional optional `.drupalaibp/before-delete.sh`\nscript, executed only after confirmation in the selected project. Cleanup failure\nand DDEV failure abort before folder removal. Both deletion paths are covered.\nThe generated script was rebuilt using `bin/generate` with Bashly 1.4.0; generation\ncompleteness checks passed. The patch includes source, generated script, tests\nand contributor/user documentation. Nothing is submitted or published upstream.\n\nUntil that change ships, the project's `scripts/delete-project.sh` confirms and\nperforms scoped cleanup followed by DDEV deletion, leaving folder removal to the\nuser. An alternative is cleanup followed by the existing AIBP delete command.\n\n## Verification\n\n- Five project cleanup tests pass: only owned aliases removed, foreign root\n  rejected, failure retains retry state, and two real isolated loopback tracker\n  processes stop independently on root signal/deletion. The fallback delete\n  wrapper also covers declined confirmation, cleanup failure and DDEV failure.\n- Five hostname, seven tracker and eight installer tests pass.\n- OLI deletion coverage includes 13 tests. The full 1,197-test suite completed\n  with an unchanged agent_handoff assertion failure. Isolated handoff tests\n  subsequently passed on both baseline and modified checkouts. The full-suite\n  gate is not reported as green; no unrelated handoff fix was attempted.\n- OLI ShellCheck 0.11.0: clean; CSpell 9.2.2: clean.\n- Project integrity, generated tracker freshness and diff checks pass.\n- Original orphan PID 54472 was confirmed using `ps` command and `lsof` cwd as\n  `/Users/jamesabrahams/code/ai/phprust/phprusttest1`; its own execution session was\n  stopped. Follow-up `lsof` on 8766 and `ps` on that PID returned no process.\n  No other project's process or shared image was removed.\n\nLimits: no real project/database deletion was performed for testing. Password\nhandling and actual hosts edits remain user-run. Older installs without ownership\nreceipts deliberately retain manual/pre-existing aliases for individual inspection.\nPublic AIBP remains unchanged until its maintainers publish a release containing\nthe prepared patch. See [cleanup instructions](../CLEANUP.md).\n", "docs/receipts/2026-11-12-phprusttest1-xmlwriter.md": "# phprusttest1 XMLWriter reproduction \u2014 2026-11-12\n\n## Environment and scope\n\nExplicitly selected installation: `phprusttest1`, this checkout. No database reset,\nmodule removal, Drupal core change, authentication or push was performed.\nSource HEAD: `baf794e`, branch `main`; installer-generated guidance changes were\nalready uncommitted and were preserved separately.\n\n- DDEV 1.25.5; web, db, phpr and tracker reported OK after Docker socket access.\n- Oracle: DDEV PHP 8.4.27, libxml 2.9.14.\n- Candidate: `debian:bookworm-slim-phprusttest1-phpr-built`, image\n  `sha256:8e0c9c68900e53ad361355c03a0ec457b0367d63302cd70891f5c6f196e555c1`.\n- Composer lock SHA256:\n  `80530d439d9a78720834b53bbc67f6b4fc4d6a6ba2911ad28142f58e936ade58`.\n- Runtime source reconstructed from `72f688c3183b79858c01d250ce3999d86e143544`\n  plus all 31 manifest patches; no runtime edits.\n\n## Commands and results\n\n`python3 scripts/prepare-runtime.py` passed integrity checks and applied the entire\nseries after retrying with network access. The initial sandbox denied network and\nDocker socket access; the resulting initial DDEV stopped labels were not real service\nstate. `ddev describe` with socket access confirmed running services.\n\n`curl -ksS --max-time 30 URL -o OUTPUT -w '%{http_code}\\n'` returned:\n\n| URL | Status | Observation |\n| --- | --- | --- |\n| `https://rust.phprusttest1.ddev.site/` | 500 | Class XMLWriter not found, Symfony ContainerBuilder.php:416 |\n| `https://php.phprusttest1.ddev.site/` | 200 | HTTP availability only |\n| `https://tracker.phprusttest1.ddev.site/` | 200 | HTTP availability only |\n\nTLS certificate validation was skipped for these diagnostic requests; they do not\ncertify TLS or browser acceptance. Raw responses remain outside Git.\n\n`ddev exec php /dev/stdin \u003c tests/probes/xmlwriter-sitemap.php` exited 0 with empty\nstderr. Its output is captured as EXPECT in `tests/phpt/xmlwriter-sitemap.phpt`.\n`ddev exec -s phpr env PHPR_LOG=warn phpr /dev/stdin \u003c tests/probes/xmlwriter-sitemap.php`\nexited 255 with missing XMLWriter at the subclass declaration. This is an expected\nfailing regression fixture, not a passing runtime test; it is not yet added to the\npassing combined runtime suite.\n\n`ddev exec php -r 'echo PHP_VERSION, \"\\n\", LIBXML_DOTTED_VERSION, \"\\n\";'`\nrecorded oracle versions. `phpr --version` is unsupported by this candidate\n(exit 1, tries to open an input file); image identity is recorded above instead.\n\n## Diagnosis and next action\n\nSimple Sitemap's `SitemapWriter` inherits XMLWriter and has its own constructor.\nThe required surface includes openMemory, setIndent, startDocument, writePI,\nwriteComment, startElement, writeAttribute, writeElement, endElement, endDocument\nand outputMemory. The fixture exercises this independently of Drupal. Error-state\nand argument-validation fixtures still need adding before implementation is complete.\n\nRead upstream AGENTS.md, REGOLE.md, NEXT_SESSION_WORDPRESS.md, migration/RULEBOOK.md,\nthe latest available session (185) and its adversarial review. Serena is required\nfor Rust editing there but is unavailable in this session; the user has been asked\nwhether available code tools may be used. No substitute runtime stub was added.\nNext: implement faithful libxml-backed writer support and inheritance dispatch,\nobtain the required single adversarial review, export a discrete patch, rebuild,\nthen test the unchanged CMS. Full upstream gates, browser acceptance, the earlier\nFiber/Generator blocker and performance remain open.\n\nOne adversarial reviewer checked the fixture and evidence: no blocking findings.\nThe PHPT FILE matches the probe and EXPECT matches the captured oracle output.\nFollow-ups: error/state fixtures, PHP 8.5.7 oracle validation, and a separate\nruntime implementation review. This review does not establish Rust semantics or\nupstream readiness.\n", "docs/receipts/2026-11-12-portable-installer.md": "# Portable installer and separate checkout \u2014 2026-11-12\n\n## Prepared\n\n- New independent Git checkout: `/Users/jamesabrahams/code/ai/drupalphprust`.\n  Branch `codex/portable-installer`; origin is the public GitHub repository via SSH.\n  Preserves the previous runtime commits without ignored build/site/credential data.\n- `scripts/install.py --target local|coder --destination NEW_FOLDER` invokes the\n  existing One Line Installer config using a temporary clean clone of committed\n  source. Neither target needs Coder tooling on the build host. Coder target\n  prints laptop tunnel instructions; workspace creation/routing remains separate.\n- Local source must be clean. Source/destination nesting and existing destinations\n  are rejected. Selected runtime port and host target survive service rebuilds.\n- No API keys are required. Authentication remains user-managed outside Git.\n\n## Checks\n\n- Seven focused tests pass using real temporary Git repositories and stubbed\n  Docker/DDEV/installer commands: local and Coder modes, private-file exclusion,\n  failed hook marker, existing destination, dirty source, invalid port, persistent\n  port and unowned service-file protection.\n- Repository contract/hash checks pass for all 31 runtime patches.\n- Reachable Git history and tracked files scanned for private artifact paths and\n  common private-key/GitHub/OpenAI/AWS token patterns: no matches. This heuristic\n  scan is not a mathematical guarantee against every possible secret format.\n- Actual host: DDEV v1.25.0, Docker 29.2.1, arm64 macOS.\n- Official released installer downloaded to a temporary file from\n  `https://project.pages.drupalcode.org/one_line_installer/drupalaibp`.\n  Source contract also inspected at One Line Installer commit\n  `abb8deb61a4c8f7f710d3c1a55c6847b7523dd97`.\n\n## Real local smoke: prerequisite blocked\n\nAttempted from source:\n\n```bash\npython3 scripts/install.py --target local --destination ../drupalphprust-local --runtime-port 18091 --installer /tmp/drupalphprust-installer --yes\n```\n\nThe installer reached initial DDEV startup, then exited 1 because\n`drupalphprust-local.ddev.site` did not resolve and DDEV could not elevate its\nhostname helper. No Drupal installation or runtime build completed in that site.\nThe partial generated folder is preserved. Existing projects were not stopped or\nchanged. The user was asked to run DDEV's displayed hostname command themselves,\nper their authentication rule. Never request the user's password.\n\nAfter that prerequisite: inspect/preserve the partial folder and rerun a clean\ninstallation. Do not claim this local install or a new Coder freeform install\npassed based on the stubbed launcher tests. Full Drupal rendering remains blocked\nby the separately documented Fiber/Generator issue.\n\n## Handoff\n\nThe user pushes `codex/portable-installer` when ready. A Coder workspace can clone\nthat branch and run the same launcher with `--target coder`; no new template is\nneeded. Use private `coder port-forward` access. See USAGE.md and CODER.md.\n", "docs/receipts/2026-11-12-serena-dashboard.md": "# Serena dashboard and DDEV Freeform \u2014 12 November 2026\n\n## Implementation\n\nThe bundled Serena service exposes dashboard port 24282 through its own DDEV\nhostname and a dynamically allocated loopback port. MCP 9121 stays internal.\nThe tracker and `ddev serena-dashboard` link to the dashboard. OLI's existing\nhostname hook now records the Serena alias for normal DDEV/AIBP deletion;\npre-existing resolving aliases are preserved. Route changes invalidate stale\nnetwork readiness. No real site or database was deleted for these checks.\n\n## Local evidence\n\nRuntime: DDEV 1.25.5, project phprusttest1, pinned Serena 2.1.0 / Rust 1.98.1\nimage from `runtime/serena/Dockerfile`.\n\n- `python3 tests/test-runtime-hostnames.py`: 7 passed, including Serena ownership\n  and cleanup plus preservation of a pre-existing alias.\n- `python3 tests/test-project-cleanup.py`: 4 passed.\n- `python3 tests/test-runtime-config.py`: 3 passed.\n- `python3 tests/test-installer-launcher.py`: 8 passed.\n- `python3 tests/test-serena-setup.py`: 9 passed.\n- `python3 tests/test-tracker.py`: 7 passed.\n- `python3 scripts/check-repo.py`: 31 patch hashes/order and static checks passed.\n- `python3 tests/test-serena-http.py` and `python3 tests/test-serena-mcp.py`:\n  Rust symbol lookup verified through the container transports.\n- HTTPS dashboard returned 200 using curl `--resolve` with normal certificate\n  verification; `/get_config_overview` identified the active php-rust project.\n  Browser inspection of the loopback dashboard showed Rust enabled and tool use.\n- Native Codex MCP initially returned the Zval symbol. Recreating the service\n  closed that connection; reconnect MCP in the client after restarting DDEV.\n\nThe Mac still requires the user-run hostname registration command in\n`docs/SERENA.md`; no administrator password was requested or read by the agent.\nA complete fresh OLI install and real deletion remain untested.\n\n## Coder evidence and limits\n\nRead-only `coder templates pull freeform ... --version active --yes` succeeded\nagainst staging-coder.ddev.com, version thankful_west78\n(`416847ac-a65f-4303-83e0-e5a3824347a2`). The prepared add-on preserves that\ntemplate's existing modules. Using hashicorp/terraform:1.13.5 with its locked\nproviders, `terraform validate -no-color` passed and\n`terraform test -filter=tests/serena.tftest.hcl -no-color` passed both mocked\nplans: opt-in disabled and owner-only access when website sharing is public.\n\nNo template was pushed, activated or applied to a workspace. Real proxy/Host\nheader behaviour, owner access and workspace restart acceptance remain pending.\nThe dashboard monitors the shared HTTP process only; independent host STDIO\nconnections do not contribute its activity. Runtime compatibility is unchanged:\nXMLWriter remains the fresh-installation blocker.\n", "docs/receipts/2026-11-12-serena-ddev.md": "# Containerised Serena and installer choices \u2014 2026-11-12\n\n## Delivered\n\nThe bundled DDEV add-on supplies a separate `serena` development service with\nSerena 2.1.0, Rust/rust-analyzer 1.98.1 and rust-src. Python dependencies are\nversion-pinned in `runtime/serena/requirements.txt`; base image digest is pinned.\nDebian package repositories are not snapshot-pinned.\n\nLocal and Coder OLI configs ask for Codex, Claude Code, both or manual, followed\nby host versus DDEV execution. The late setup hook prepares a missing runtime\ncheckout, supplies explicit Rust language/workspace settings and writes selected\nproject-scoped client configuration. DDEV mode installs the selected official\nOLI-used agent add-ons and supplies missing wrappers without auto-approval flags.\nHost mode does not install a host agent. No agent authentication is performed.\n\nOLI's public entry script was inspected on this date: custom\n`single-select-options` questions are supported, their answers are persisted, and\nthe built-in agent picker is skipped in config mode. The project therefore uses\nexplicit custom questions and a late hook, without modifying the installer.\n\n## Executed evidence\n\nSelected project: `phprusttest1`, DDEV 1.25.5, Docker Desktop on arm64 macOS.\n\n- `ddev add-on get ./ddev-addon && ddev restart`: service installed and built.\n- `ddev exec -s serena rustc --version`: `rustc 1.98.1 (48a229cea 2026-09-01)`.\n- `ddev exec -s serena rust-analyzer --version`: `rust-analyzer 1.98.1 (48a229c 2026-09-01)`.\n- Recorded all 74 installed Python package versions, rebuilt using that file,\n  then restarted the project successfully.\n- Final service image: `sha256:0915e7a185e4c5e7d02329c294ac1adef0d601c7aa7e9b7b56f9334b4b671e08`.\n  Docker inspection: host port bindings `{}`, execution user `501:20`.\n  Container Cargo cache is writable by that user.\n- `python3 scripts/setup-serena.py --client codex --location host`: project Codex\n  configuration generated; repeated invocation preserved Serena's expanded YAML.\n- `codex mcp get drupalphprust-serena`: enabled STDIO entry recognised with the\n  project launcher and 180-second startup/tool timeouts. This is configuration\n  recognition, not proof this existing desktop chat has loaded the tools.\n- `ddev serena-mcp --context claude-code --help`: installed command resolves and\n  accepts the documented Claude context override.\n- `python3 tests/test-serena-mcp.py`: PASS after rebuild/restart. Initialisation,\n  initial instructions, tool discovery and actual `Zval` Rust symbol lookup over\n  host STDIO through `ddev exec`.\n- `python3 tests/test-serena-http.py`: PASS after rebuild/restart. The same\n  protocol and symbol checks, with HTTP requests originating in the web container\n  to `http://serena:9121/mcp`. Session identifiers are not printed or saved.\n- `python3 tests/test-serena-setup.py`: 9 PASS. Host/container settings, repeated\n  setup, preserving unrelated configuration, refusing conflicts and symlinks,\n  manual mode, installer choices, mocked selected-add-on installation and no\n  completion marker after a simulated add-on failure.\n- `python3 tests/test-runtime-config.py`: 3 PASS.\n- `python3 tests/test-installer-launcher.py`: 8 PASS.\n- `python3 tests/test-tracker.py`: 7 PASS.\n- `python3 scripts/check-repo.py`: PASS, all 31 runtime patches unchanged.\n- Diagnostic HTTPS requests after restart: Zend 200, Rust 500 with the same\n  missing XMLWriter error. These requests skipped certificate validation and do\n  not establish browser or TLS acceptance.\n\n## Corrections discovered during testing\n\nSerena's initial default exposed its REPL interface and detected no Rust language\nserver in the nested checkout. Explicit `--agent-interface tools` and the bundled\nRust project configuration fixed both failures. Serena expands its project YAML\non activation, so setup now preserves existing YAML instead of comparing its\nbytes with the short template. The tracker task-length check caught an overlong\ntask summary; it was shortened and all seven tracker tests passed on rerun.\n\n## Limits and next work\n\nNo Rust source fix, Drupal change, database reset, login or push was performed.\nXMLWriter and the earlier Fiber/Generator blocker remain. The new connections\nwere tested with protocol clients, not authenticated Codex/Claude sessions.\nCurrent Codex chat tools may require a client reconnect to load the project entry.\n\nA fresh OLI run, remote Coder run, and real installation of both agent add-ons\nthrough the new hook have not been executed; installation sequencing has mock\ncoverage only. One existing local site and both real transports were tested.\nThe host and DDEV client configurations select one execution location per project;\nrun setup again to switch. The internal HTTP service is shared for this runtime\nproject and is not published through a host port or DDEV/Coder router.\n\nSee [setup and recovery](../SERENA.md) and [installer task](../../.agents/plan/current/09-installer.md).\n", "docs/receipts/2026-11-12-static-property-reference.md": "# Static-property reference compatibility \u2014 2026-11-12\n\n## Scope and source\n\nPinned runtime: `72f688c3183b79858c01d250ce3999d86e143544` plus ordered\nrepository patches. Development image `drupalphprust:dev-release`, built using\n`docker build --build-arg RUNTIME_PROFILE=dev-release -f runtime/Dockerfile`.\nDisposable Coder site `drupal-oob`; DDEV standard PHP 8.4.27 is the differential\noracle. Local PHP 8.4.8 generated the PHPT expectation.\n\n## Results\n\n- Old `canvas-phpr:oob-dev` fails the new fixture at static reference assignment.\n- First candidate built but failed alias-return parity with notices. Fixed the\n  missing bare-static return lowering; no workaround in Drupal core.\n- Binding replaces the declaring-class storage cell, preserving old aliases when\n  rebound. Literal static reference returns use the live cell.\n- Single adversarial review caught finally being skipped. Shared ReturnRef\n  completion now parks the reference and runs finally. Added a regression checking\n  both finally output and mutation through the returned alias. Re-review found no\n  remaining blocker in that change.\n- `bash tests/test-oob-runtime.sh /home/coder/drupal-oob drupalphprust:dev-release drupal-oob`:\n  exit 0, all 28 probes passed with empty stderr and byte-identical stdout.\n- Actual Drupal Views class probe returned `bool(true)` after the reference fix\n  (before the final finally amendment); browser acceptance remains separate.\n- All 30 patches reconstructed cleanly; nine changed source files matched the\n  working candidate byte-for-byte. Local-source reconstruction exposed an existing\n  branch-name collision; checkout now uses `-B` only in the newly created clone.\n- Fresh Chromium login reached `/admin/dashboard?check_logged_in=1`, then HTTP 500:\n  `Call to undefined method SplFileInfo::getCTime()` in ProjectInfo.php line 84.\n  This is the next discrete candidate patch, not proof of completed E2E.\n\n## Limits\n\nStatic reference-call RHS bindings, parenthesized/dynamic return forms and typed\nstatic-property enforcement remain outside this fix. Full upstream corpus and\nperformance promotion gates were not run; this is a development compatibility\ncandidate, not a promoted runtime release. The existing comparison container was\nused, not the new DDEV sidecar or One Line Installer integration.\nRaw logs and generated test credentials remain outside Git.\n", "docs/receipts/2026-11-12-tracker-landing.md": "# Tracker landing page and installation verification \u2014 12 November 2026\n\n## Installation observed\n\nRoot: `/Users/jamesabrahams/code/ai/phprust/phprusttest1`; source HEAD\n`cf8c634c95f5f1a6f3026c5d00150fdc1093f9f4`, branch main, with preserved installer\nchanges. DDEV project: `phprusttest1`, DDEV v1.25.0, Docker Desktop.\nThe existing terminal reached installation completion and returned to a shell.\nThe dev-release build completed; image `drupalphprust:dev-release`, image config\n`sha256:dccd91734db4e9be1c7ae23f8e5f9881975e8b46f661dba734279b3b7b20b1c4`.\n`ddev describe -j` reported web, db and phpr running. Only allowlisted service\nstatus and timestamp are stored by the tracker; full output is not persisted.\nNo installer rerun, DB reset, module changes or credential collection was performed.\n\n## OLI contract inspected\n\nDownloaded the public generated script from\nhttps://project.pages.drupalcode.org/one_line_installer/drupalaibp on this date,\nfor inspection only. Source sections: `src/lib/steps/launch_site.sh`,\n`print_welcome.sh`, `_welcome_text_substitute.sh` and `src/lib/core/pipeline.sh`.\n\n- `launch_path` is passed to `ddev launch`; a persisted `LAUNCH_PATH` answer can override it.\n- `replace_welcome_text` replaces the whole generic ready/login message.\n- `{SITE_URL}` is guessed from the project directory in that message, so it is\n  unsuitable for custom DDEV hostnames/ports. Hooks run as child shells and\n  cannot export a replacement value into the parent's welcome variables.\n- Existing `before_launch_site` and `before_agent_handoff` events solve this in\n  repository configuration: publish the tracker, then print actual URLs from\n  DDEV and `.ddev/.runtime-urls` immediately before the replacement welcome text.\n- No upstream installer change or submission is needed.\n\n## Changes and verification\n\nBoth local and Coder configs now launch `/project-tracker/`. The new host hooks\ninvoke `python3 scripts/tracker.py --install` and `--message`. The installed HTML\nlives in ignored `web/project-tracker/`; an ownership marker prevents replacing\nan existing unrelated directory. Committed `tracker.html` remains portable and\ncontains no installation metadata. Normal regeneration also refreshes the managed\ninstalled copy. Markdown task navigation remains intact; the loopback server\nstill refreshes Markdown and supports relative Coder proxy paths.\n\nExecuted:\n\n- `python3 scripts/tracker.py --install`: published landing page, stored timestamped\n  web/phpr service status separately from explicit unverified compatibility labels.\n- `python3 scripts/tracker.py --message`: printed Project tracker, Drupal on\n  standard PHP, Drupal on PHP Rust with actual installation URLs.\n- Extracted OLI's unchanged launch function into a temporary harness, set\n  `LAUNCH_PATH=/project-tracker/`, ran `step_launch_site`: Chrome opened\n  `https://phprusttest1.ddev.site/project-tracker/`; page title, runtime cards and\n  Markdown tasks verified in the browser. HTTPS fetch returned 200.\n- Extracted OLI's unchanged welcome functions and supplied the configured\n  replacement array: the hook's three exact URLs appeared followed by the\n  compatibility caveat; no generic Drupal-ready or credential message appeared.\n- `ddev utility compose-config`: php hostname belongs to web; rust hostname\n  belongs only to phpr.\n- Temporary unique PHP identity endpoint, removed in `finally`, requested with\n  `curl --resolve HOST:443:127.0.0.1`: php host returned `8.4.17|fpm-fcgi`;\n  rust host returned `8.5.7|cli-server`. TLS verification stayed enabled.\n- Ordinary requests to both named hostnames failed DNS resolution on this Mac.\n  User-run `ddev hostname HOST 127.0.0.1` requested for each; authentication stays\n  with the user. Distinct service routing passes, ordinary link accessibility\n  remains pending DNS repair. Browser follow-up on a blank new tab was blocked\n  by URL policy; no bypass attempted.\n- `python3 scripts/tracker.py --serve`: port 8765 already occupied; preserved its\n  owner and started this project's server with `--port 8766` instead.\n- Seven tracker tests pass, including credential-bearing URL rejection and\n  metadata allowlisting; `python3 scripts/check-repo.py` passes.\n\nHomepage checks with the same explicit local DNS resolution returned standard PHP\nHTTP 200 (10,180 bytes, no detected fatal/warning markers) and PHP Rust HTTP 500\n(2,984 bytes): `Class \"XMLWriter\" not found` in ContainerBuilder.php:416.\nThe current installation has not had optional-module exclusions applied; do not\nassume the prior scoped Fiber/Generator blocker is the first failure here.\n\nLimits: this verifies the launch and welcome stages on the existing installation,\nnot a second clean install with the amended config. Coder private access and\nstop/start persistence remain untested. Running services are not proof of Drupal\ncompatibility; no end-to-end or performance claim. `phpr --version` is unsupported\nby this build; the identity endpoint provides the runtime version instead.\n\n## Follow-up: user completed hostname registration\n\nAfter the user ran both `ddev hostname` commands, Python `socket.gethostbyname`\nreturned `127.0.0.1` for both hostnames. Normal `urllib.request.urlopen` requests\n(no explicit DNS override; TLS verification enabled) reached both sites:\nstandard PHP HTTP 200, 10,180 bytes, no detected fatal/warning markers;\nPHP Rust HTTP 500, 2,984 bytes, the same missing XMLWriter error. DNS repair\nis verified; runtime compatibility remains failing. Automatic installation-time\nhostname registration is still outstanding, separate from this manual repair.\n", "docs/receipts/2026-11-12-xmlwriter-memory.md": "# XMLWriter memory support \u2014 12 November 2026\n\nThe unchanged Drupal CMS homepage now renders on PHP Rust. This fixes the\nmissing-class blocker; it does not establish full CMS compatibility or speed.\n\n## Candidate and oracle\n\n- Project: `phprusttest1`, DDEV 1.25.5, arm64 Docker Desktop.\n- Upstream pin: `72f688c3183b79858c01d250ce3999d86e143544`, existing 31 patches\n  plus `xmlwriter-memory.patch` (32 total).\n- Rust toolchain: 1.98.1; serving build: `dev-release`, not a promoted release pin.\n- Oracle: DDEV PHP 8.4.27, libxml 2.9.14. Runtime identifies as PHP 8.5.7;\n  PHP 8.5.7 was subsequently added as the upstream differential oracle (below);\n  the three XMLWriter fixtures also match it exactly. Full reflection/type/error\n  coverage remains unproven.\n- Running image: `debian:bookworm-slim-phprusttest1-phpr-built`, ID\n  `sha256:ccbe09a0f1f5a9a17390cd983126a569d1f69041d3debae46aefdac131c75576`.\n- Serving CLI SHA256: `4db982691cf30ed600d991f2ac99a1f0a2ee68b99f2093c1f2756a3362dbf15b`.\n- Serving HTTP binary SHA256: `bee8ae90573664d680acf2183aff742f55d27ece11fbd26e38d95431d7a232da`.\n- Composer lock SHA256:\n  `80530d439d9a78720834b53bbc67f6b4fc4d6a6ba2911ad28142f58e936ade58`.\n\n## Scope and review\n\nThe patch supplies the OO in-memory writer API used by Simple Sitemap's\n`SitemapWriter extends XMLWriter`, including a child constructor that does not\ncall its parent. Libxml supplies XML escaping, indentation, namespaces, encoding\nand document/element/attribute state. Output can be retained, drained and reopened.\nNative state is separate from PHP properties and serialization. Weak object\nidentity prevents reused object IDs from inheriting a buffer; clones are rejected.\n\nThe single required adversarial reviewer initially identified procedural-dispatch\nand diagnostic mismatches. Procedural wrappers were removed. PI wording was\ncorrected; libxml diagnostics now respect PHP handlers and internal-error mode,\nincluding delayed encoder errors during output. Callback state is restored before\nPHP error handlers execute. Final scoped verdict: no remaining blocker found for\nthe tested OO memory contribution.\n\nURI, DTD and procedural APIs remain absent. Buffers belonging to expired PHP\nobjects are reclaimed at later allocation or request shutdown, not necessarily\nimmediately at `unset`. Destructor-time diagnostic equivalence remains unproven.\nThe change is not a claim of complete XMLWriter parity or successful sitemap\ncreation. No Drupal source, module enablement or database reset was used.\n\n## Executed validation\n\n- `cargo build --locked --profile dev-release -p php-cli -p php-server` in the\n  Serena DDEV container, target `/tmp/serena-target`: passed.\n- `cargo test --locked --profile dev-release -p php-runtime --test xmlwriter`:\n  2 integration tests passed (inherited writer/escaping/draining; catchable\n  uninitialized-object, clone and invalid-PI errors).\n- Each of `tests/probes/xmlwriter-{sitemap,state,errors}.php` ran on Zend and the\n  candidate, exact stdout agreement and empty stderr: 795, 955 and 965 bytes.\n  Corresponding standalone PHPT expectations are committed.\n- Native release `phpt-runner --isolate --list-fails` on those three PHPTs:\n  3 passed / 0 failed / 0 skipped with each of `PHPR_REG_LOWER=0` and `=1`.\n- `python3 scripts/prepare-runtime.py --source .work/php-rust --destination\n  .work/xmlwriter-final`: fresh reconstruction succeeded; all six changed/new\n  runtime files were byte-identical to the edited candidate.\n- `docker build --build-arg RUNTIME_PROFILE=dev-release -t\n  debian:bookworm-slim-phprusttest1-phpr-built runtime`, then `ddev start`: passed.\n  Running container image ID matches the built image.\n- `bash tests/test-oob-runtime.sh \"$PWD\"\n  debian:bookworm-slim-phprusttest1-phpr-built phprusttest1`: all 32 probes passed,\n  including the three XMLWriter cases. No prior probe regressed.\n- HTTPS Rust homepage: 200; browser at\n  `https://rust.phprusttest1.ddev.site/` showed the expected hero and CTA, without\n  visible fatal/warning/class placeholders. Standard PHP homepage remained 200.\n- A subsequent login request timed out after browser activity. Server log showed\n  an accepted connection with no completed request. After restarting only\n  `ddev-phprusttest1-phpr`, a direct anonymous `/user/login` request returned 200\n  with username/password form controls and no error indicators. This is consistent\n  with task 15's existing connection-handling limitation, not proof of its cause.\n  No login was submitted. Authenticated create/edit/view remains open.\n- `python3 scripts/check-repo.py`: 32 patch hashes/order and static checks passed.\n\n## Upstream gate limits\n\n`CARGO_BUILD_JOBS=2 cargo test --locked --release` was killed during fat-LTO\nlinking (SIGKILL). A single-job retry compiled successfully, then stopped at the\nupstream differential harness because its expected PHP oracle executable is\nnot installed inside Serena. The final run used the explicit upstream option:\n\n```bash\nPHPR_ALLOW_MISSING_ORACLE=1 CARGO_BUILD_JOBS=1 CARGO_TARGET_DIR=/tmp/serena-target \\\n  cargo test --locked --release --no-fail-fast\n```\n\nInitial diagnostic run, exit 101: Cargo reported 1,757 passed, 2 failed, 2 ignored. Three reported passes\nare explicit missing-oracle early returns (`builtins_match_oracle`,\n`evaluator_matches_oracle`, `differential_operators_vs_oracle`), leaving 1,754\nexecuted passes. Both new XMLWriter tests passed in release. The two failures\nare `vm::census::tests::op_index_maps_sampled_variants_in_range` (177 vs 178) and\n`nessun_sorgente_rs_oltre_cap` (pre-existing source line-count limits). Baseline\ncomparison reproduced both failures on a fresh **31-patch** checkout without\nXMLWriter, using dev-release focused Cargo runs. The census failure is identical;\nthe same 11 files already exceed their caps. XMLWriter adds 5 lines to vm/mod.rs,\n2 to vm/run.rs and 1 to lower/mod.rs, all already over cap. No thresholds were\nraised or failures hidden. This is **not a green full upstream gate**.\n\n### Final run with the real upstream oracle\n\nAt the user's request, the developer image now contains PHP 8.5.7 from\n`php:8.5.7-cli-bookworm@sha256:1ff2cdf2754bcac61128bfda455d418639c0f45a8b1583b4b90f9873a2ba1368`.\nThe executable, required shared libraries and build-time version/XMLWriter check\nwere verified. Its source archive and license are retained in `/opt/php-oracle`.\nThe wrapper disables CLI OPcache/JIT; the launcher explicitly unsets the skip flag.\nThe same bundle was installed into the live Serena container without restarting\nMCP or discarding its test cache; the built developer image supplies future starts.\n\n`bash scripts/test-runtime-upstream.sh` completed with **1,757 executed passes,\n2 failures, 2 ignored** (exit 101). All three differential tests executed against\nPHP 8.5.7 and passed; none was bypassed. The only failures remain the two baseline\nguards identified above. The three XMLWriter fixtures also matched the official\nPHP 8.5.7 image byte-for-byte with empty stderr (795/955/965 bytes), using\n`docker run --rm --network none` with the project mounted read-only.\n\nThe canonical corpus\nscript depends on its maintainer's `/Volumes/Extreme Pro/Claude/...` PHP source,\nrunner and frozen paths, which are unavailable in this checkout. No canonical\npin/stash, full corpus promotion or R=5 performance gate is claimed. This is a\nlocal compatibility candidate; upstream submission remains gated on the complete\nDrupal flow and user approval.\n\nReferences: [PHP XMLWriter](https://www.php.net/manual/en/book.xmlwriter.php),\n[libxml writer API](https://gnome.pages.gitlab.gnome.org/libxml2/html/xmlwriter_8h.html).\n", "docs/receipts/2026-11-13-authenticated-runtime.md": "# Authenticated Drupal CMS runtime work \u2014 13 November 2026\n\nThe selected disposable site is `phprusttest1`. The user explicitly authorized\nits demo admin login. Login, create, edit, publish and anonymous view succeeded; cold-cache follow-up is recorded below.\nNo password or session data is included in this receipt.\n\n## Verified changes\n\n| Patch | Owner | Reproduction and result |\n| --- | --- | --- |\n| 39 `stream-wrapper-registry.patch` | Task 08 | Registered wrappers now appear in registration order and clear at request reset. Removes duplicate-registration warnings on Drupal subrequests. |\n| 40 `fiber-generator-collector.patch` | Task 01 | `iterator_to_array` retains partial results across Generator/Fiber suspension; overwrite/destructor ordering and invalid keys match the oracle. Authenticated dashboard now loads. |\n| 41 `ref-builtin-field-spread.patch` | Task 05 | Named builtins such as `array_push($element['#submit'], ...$handlers)` now compile with reference writeback. Utility-page form opens. |\n| 42 `function-reference-forward.patch` | Task 05 | Reference-returning functions can forward function/dynamic-call references; Drupal's `batchGet()` wrapper retains its alias. |\n| 43 `static-reference-value.patch` | Task 05 | Value-context static calls dereference their return; explicit `=&` retains aliases. Repeated ordinary assignment previously created a self-referential cell and crashed `isset` with native stack overflow. Drupal save now reaches validation. |\n| 44 `preg-binary-replacement.patch` | Task 06 | Replacement bytes no longer pass through lossy UTF-8 conversion. Drupal's EF/FF date-format markers survive and dashboard dates render correctly. |\n| 45 `date-current-errors.patch` | Task 06 | Current-time mutable/immutable constructors clear stale parse diagnostics; setters retain diagnostics. Drupal revision timestamp validation now succeeds. |\n| 46 `mb-stringable.patch` | Task 06 | Multibyte case conversion resolves Stringable input and encoding arguments; cold-cache token label warnings triggered this follow-up. |\n\nEach change received the required independent adversarial review. Focused fixtures\nmatch PHP 8.5.7 byte-for-byte with empty stderr. This is scoped acceptance, not\ncomplete PHP or regular-expression parity.\n\n## Commands and environment\n\nBuild inside the project's Serena service, pinned Rust 1.98.1:\n\n```bash\nddev exec -s serena bash -c 'export PATH=/usr/local/cargo/bin:$PATH; cd /var/www/html/.work/php-rust/php-rust && CARGO_TARGET_DIR=/tmp/serena-target CARGO_BUILD_JOBS=1 cargo build --locked --profile dev-release -p php-cli -p php-server -p phpt-runner'\n```\n\nThe differential executables are `/opt/php-oracle/php` (PHP 8.5.7) and\n`/tmp/serena-target/dev-release/phpr`. Fixtures are under `tests/probes`.\nFinal development candidate: all **49** `tests/test-oob-runtime.sh` probes pass\nagainst DDEV Zend PHP **8.4.27**, with identical output and empty stderr. New\nfocused fixtures also match the bundled PHP **8.5.7** oracle. Native project PHPT\nresults are **47/47 passed, 0 failed, 0 skipped** in each compiler mode:\n\n```bash\nddev exec -s serena env PHPR_REG_LOWER=0 timeout 180 /tmp/serena-target/dev-release/phpt-runner --isolate --list-fails /var/www/html/tests/phpt\nddev exec -s serena env PHPR_REG_LOWER=1 timeout 180 /tmp/serena-target/dev-release/phpt-runner --isolate --list-fails /var/www/html/tests/phpt\npython3 scripts/prepare-runtime.py --source .work/php-rust --destination .work/runtime-reconstructed-46\npython3 scripts/check-repo.py\n```\n\nReconstruction applies all 46 patches; all **49 patched source files** match the\nedited checkout byte-for-byte. Hash/order and repository checks pass.\n\nThe candidate binaries were copied into the local DDEV runtime image and only\n`phpr` was recreated. This is development activation, not a clean Dockerfile\nrelease build. Exact candidate identity:\n\n- Image: `sha256:e252597d43bd7ee21332b1c155d542dc069533bbbadd14e5fc944b0391caa967`.\n- `phpr`: `e050bf3989539f991a314eeba1bec8ef0163117f7e875e5e0a18289c65296a1c`.\n- `php-server`: `d8c9dea04a347daccc0b1e22c0b49ee12e5beb27e2617429353c30a8a8c09785`.\n\n`bash scripts/test-runtime-upstream.sh` completed against patches 1\u201346 with\npinned Rust 1.98.1, the unchanged release recipe (fat LTO, one codegen unit,\none build job) and PHP 8.5.7 oracle. Result: **1,756 passed, 3 failed, 2 ignored**;\nexit status 101. Local log: `.work/mb-stringable-fix/release-tests.log`.\n\n- `vm::census::tests::op_index_maps_sampled_variants_in_range`: opcode accounting\n  assertion reports 177 versus 178.\n- `nessun_sorgente_rs_oltre_cap`: 14 Rust source files exceed their recorded size\n  limits, including the new date, compiler and regular-expression changes.\n- `rczval_pattern_resta_nel_funnel`: `vm/host.rs` contains seven matching\n  reference allocations where the guard expects six. This is an additional\n  failure compared with the patch-37 checkpoint and needs investigation of the\n  allocation site and the required `zcell()` funnel, not a blind expectation bump.\n\nThe historical patch-37 result was 1,757 passed, 2 failed, 2 ignored; see\n[the previous receipt](2026-11-12-continuations-and-rendering.md). No full green\nrelease gate is claimed. The official upstream external corpus and performance\ngates have not been run.\n\n## Browser evidence and remaining work\n\n- Demo login and authenticated dashboard succeed.\n- Created Utility-page node 2 through PHP Rust, edited its body and published it.\n  Drupal displayed its update success message and the edited content.\n- Anonymous HTTPS GET to `/php-rust-verification-13-november` returned 200 with\n  the expected edited body, no administrative toolbar and no runtime diagnostics.\n- Restarted only `phpr`, rebuilt Drupal caches with `ddev drush cache:rebuild` and\n  confirmed the saved content persists. This exposed Token module translated-label\n  warnings in `mb_strtolower`; after patch 46 and another cache rebuild, the\n  published page renders cleanly with no warnings or placeholder class names.\n- The first create redirect used HTTP after repeated diagnostic retries; direct\n  HTTPS view succeeded. The later edit/publish redirected correctly to HTTPS.\n  A fresh create redirect should be checked again before claiming it fully resolved.\n- Earlier filter-settings warnings did not recur on the fresh form. Rich-text editor\n  initialization and broader cold-cache plugin discovery still need coverage.\n- General regex limits remain: empty/nonempty alternatives can skip a subsequent\n  nonempty match; invalid `/u` array subjects remain null entries instead of being\n  omitted. Both predate patch 44 and are outside its byte-preservation claim.\n- General textual DateTime constructor diagnostics, dynamic by-reference builtin\n  calls, strict-mode string coercion and unsupported native-helper Fiber suspension\n  remain broader limits. The fixes do not establish complete PHP compatibility.\n\n## Next work\n\n1. Resolve the remaining release gate failures and preserve their exact outcomes.\n2. Test a clean One Line Installer build from the pushed repository; verify\n   hostname/client setup and deletion cleanup on that installation.\n3. Validate DDEV Freeform integration on the known Coder deployment, with the user\n   performing authentication, template publication and workspace updates.\n4. Cover rich-text/media/sitemap and remaining runtime gaps with independent fixtures.\n5. Prepare discrete upstream contribution packets, then request approval for actual\n   submissions. No upstream PRs or performance comparison have been made.\n\nTemporary debugger images, diagnostics, raw browser state and local logs remain\noutside Git. No Drupal workaround was retained: the temporary validator diagnostic\nwas restored byte-for-byte before the successful save.\n"}, "steps": [{"path": ".agents/plan/current/01-fiber-generators.md", "title": "01. Complete Drupal runtime support", "status": "active"}, {"path": ".agents/plan/current/02-pdo-mysql.md", "title": "02. PDO MySQL driver", "status": "patched"}, {"path": ".agents/plan/current/03-iterators-filesystem.md", "title": "03. Iterators and filesystem", "status": "patched"}, {"path": ".agents/plan/current/04-class-loading.md", "title": "04. Class loading and serialization", "status": "patched"}, {"path": ".agents/plan/current/05-callables-references.md", "title": "05. Callables and references", "status": "patched"}, {"path": ".agents/plan/current/06-rendering-twig.md", "title": "06. Rendering and Twig semantics", "status": "partial"}, {"path": ".agents/plan/current/07-sessions-http.md", "title": "07. Sessions and HTTP serving", "status": "patched"}, {"path": ".agents/plan/current/08-optional-cms-gaps.md", "title": "08. Deferred CMS compatibility", "status": "partial"}, {"path": ".agents/plan/current/09-installer.md", "title": "09. Portable one-line installation", "status": "active"}, {"path": ".agents/plan/current/10-coder-tracker.md", "title": "10. Coder tracker and Serena dashboard integration", "status": "active"}, {"path": ".agents/plan/current/11-fast-seed.md", "title": "11. Fast build and clean seed", "status": "pending"}, {"path": ".agents/plan/current/12-benchmark.md", "title": "12. Compare capabilities and tradeoffs", "status": "active"}, {"path": ".agents/plan/current/13-upstream-process.md", "title": "13. Work out upstream submission process", "status": "pending"}, {"path": ".agents/plan/current/14-drupal-opportunities.md", "title": "14. Benefits now versus Drupal changes", "status": "pending"}, {"path": ".agents/plan/current/15-http-partial-requests.md", "title": "15. Partial HTTP request handling", "status": "pending"}, {"path": ".agents/plan/current/16-xmlwriter.md", "title": "16. Implement XMLWriter for out-of-box Drupal CMS", "status": "patched"}]}</script>
