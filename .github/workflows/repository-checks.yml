name: Repository contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-repo.py
      - run: python3 scripts/check-secrets.py
      - run: python3 tests/test-installer-launcher.py
      - run: python3 tests/test-tracker.py
      - run: python3 scripts/tracker.py --check
      - run: python3 -m compileall -q scripts tests
# This deliberately does not install Drupal or claim runtime compatibility.
